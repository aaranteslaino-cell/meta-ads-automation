<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta Ads — Monitor Ao Vivo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1c1e21;min-height:100vh}
.wrap{max-width:1400px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h1{color:#1877f2;font-size:22px;margin-bottom:2px}
h2{font-size:17px;margin-bottom:14px}
h3{font-size:14px;margin-bottom:10px;color:#444}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-blue{background:#1877f2;color:#fff}.btn-blue:not(:disabled):hover{background:#1465d8}
.btn-gray{background:#e4e6eb;color:#1c1e21}.btn-gray:not(:disabled):hover{background:#d0d2d8}
.btn-red{background:#fa3e3e;color:#fff}.btn-red:not(:disabled):hover{background:#d32f2f}
.btn-sm{padding:5px 10px;font-size:12px}
.fg{margin-bottom:12px}
label{display:block;font-size:12px;font-weight:700;color:#65676b;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
input,select{width:100%;padding:8px 11px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;transition:border-color .15s;background:#fff}
input:focus,select:focus{outline:none;border-color:#1877f2}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row > *{flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:#f0f2f5;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border:none;color:#1c1e21}
.chip:hover{background:#e4e6eb}
.chip.active{background:#1877f2;color:#fff}
.connected{display:flex;align-items:center;gap:6px;font-size:13px;color:#42b72a;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#42b72a;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.bread{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;padding:10px 14px;background:#f7f8fa;border-radius:8px}
.bread a{color:#1877f2;text-decoration:none;cursor:pointer;font-weight:500}
.bread a:hover{text-decoration:underline}
.bread .sep{color:#888}
.bread .cur{color:#1c1e21;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #eee;font-size:13px}
th{font-weight:700;font-size:11px;color:#65676b;text-transform:uppercase;letter-spacing:.3px;background:#f7f8fa;cursor:pointer;user-select:none;position:sticky;top:0}
th:hover{background:#eef0f3}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.row-link{cursor:pointer;transition:background .12s}

tr.total{background:#eef3fb;font-weight:700}
tr.total td{border-top:2px solid #1877f2;border-bottom:none}
/* Rodapé de totais fixo no fim da tabela (sempre visível, como no Meta) */
tfoot td{position:sticky;background:#eef3fb;z-index:3}
tfoot tr:last-child td{bottom:0}
tfoot tr:nth-last-child(2) td{bottom:39px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.b-green{background:#e6f4ea;color:#137333}
.b-orange{background:#fef3e2;color:#c47a00}

.info-box{background:#e7f0fd;border-radius:8px;padding:10px 14px;font-size:13px;color:#1877f2}

.loading{display:inline-block;width:14px;height:14px;border:2px solid #ddd;border-top-color:#1877f2;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:40px;text-align:center;color:#888;font-style:italic}
.tbl-wrap{max-height:600px;overflow:auto;border-radius:8px;border:1px solid #eee}
.right{text-align:right}
.acct-tag{display:inline-block;padding:1px 6px;background:#eef0f3;border-radius:8px;font-size:10px;color:#65676b;font-weight:600;margin-left:6px}
.id-col{font-family:'Consolas','Monaco',monospace;font-size:11px;color:#65676b;white-space:nowrap}
.id-cell{display:inline-flex;align-items:center;gap:4px}
.copy-btn{background:none;border:none;cursor:pointer;font-size:11px;padding:2px 4px;border-radius:4px;opacity:.5;transition:all .15s}
.copy-btn:hover{background:#eef0f3;opacity:1}
.refresh-info{display:flex;align-items:center;gap:6px;font-size:12px;color:#888}
hr{border:none;border-top:1px solid #e4e6eb;margin:14px 0}
.token-item{display:flex;gap:8px;align-items:center;margin-bottom:6px;padding:6px 10px;background:#f7f8fa;border-radius:6px;font-size:13px}
.token-item .lbl{font-weight:600;color:#1877f2}
.token-item .id{color:#888;font-family:monospace;font-size:11px}

<body>
<div class="wrap">
  <div class="card">
    <h1>Meta Ads — Monitor Ao Vivo</h1>
    <p style="color:#888;font-size:13px">Acompanhamento em tempo real de campanhas, conjuntos e anúncios</p>
  </div>
  <div id="root"></div>
</div>

<script>
const GQL = 'https://graph.facebook.com/v21.0';

// ── Supabase: receita real cruzada por campanha/conjunto/anúncio ──────────────
// Consome a RPC agregada public.meta_revenue_by_ad (sem dados pessoais), que
// deriva campaign_id/adset_id/ad_id das UTMs (contorna o bug do n8n que grava
// meta_campaign_id/ad_id = 'direct'). Receita = valor_bruto/100 (todas as vendas).
const SB_URL_DEFAULT = 'https://mnrnnmfaupvmjfgpzkou.supabase.co';
const SB_KEY_DEFAULT = 'sb_publishable_KraV-pqYINerxc0nCgdHaA_xHj7ew87';

// ── Estado ────────────────────────────────────────────────────────────────────
let S = loadState() || {
  tokens:[],
  connected:false,
  accounts:[],
  view:'accounts',   // accounts | allCampaigns | campaigns | adsets | ads
  selectedAccountIds:[], // contas selecionadas para visão cross-account
  path:[],           // [{type, id, name}] breadcrumb
  period:'today',    // today | yesterday | last_7d | last_30d | last_14d
  statusFilter:'active',  // active | paused | review | rejected | all
  showPaused:false,  // legado — mantido por compat
  autoRefresh:true,
  sortBy:'spend',
  sortDir:'desc',
  data:[],           // current view data
  lastRefresh:null,
  refreshing:false,
  search:'',         // texto da pesquisa
  filterMinSpend:''  // gasto mínimo (R$)
};
// SEMPRE força estado inicial limpo no load — evita state corrompido travar a UI
S.refreshing = false;
S.connected = false;
S.accounts = [];
S.data = [];
S.path = [];
S.view = 'accounts';
S.lastRefresh = null;
// Defaults defensivos para os demais campos
if(!Array.isArray(S.tokens)) S.tokens = [];
if(!Array.isArray(S.selectedAccountIds)) S.selectedAccountIds = [];
if(!S.period) S.period = 'today';
if(!S.sortBy) S.sortBy = 'spend';
if(!S.sortDir) S.sortDir = 'desc';
if(typeof S.search !== 'string') S.search = '';
if(typeof S.filterMinSpend !== 'string') S.filterMinSpend = '';
if(typeof S.showPaused !== 'boolean') S.showPaused = false;
if(typeof S.autoRefresh !== 'boolean') S.autoRefresh = true;
if(!S.statusFilter) S.statusFilter = 'active';
// Supabase / receita
if(typeof S.sbUrl !== 'string' || !S.sbUrl) S.sbUrl = SB_URL_DEFAULT;
if(typeof S.sbKey !== 'string' || !S.sbKey) S.sbKey = SB_KEY_DEFAULT;
if(typeof S.showRevenue !== 'boolean') S.showRevenue = true;
S._rev = null; // cache de receita do refresh atual (não persistido)

function loadState(){
  try{ return JSON.parse(localStorage.getItem('mam_state')); }catch(e){ return null; }
}
function saveState(){
  try{
    const save = {...S, data:[], refreshing:false};
    localStorage.setItem('mam_state', JSON.stringify(save));
  }catch(e){}
}

// Reaproveita tokens da automação de subir campanhas (sincroniza sempre que tem novos)
function loadSharedTokens(){
  try{
    const maa = JSON.parse(localStorage.getItem('maa_state'));
    if(maa?.tokens?.length){
      let changed = false;
      maa.tokens.forEach(srcTok=>{
        // adiciona tokens da automação que ainda não estão aqui (pelo valor do token)
        if(!S.tokens.find(t=>t.token === srcTok.token)){
          S.tokens.push({...srcTok, id: srcTok.id || Date.now()+Math.random()});
          changed = true;
        }
      });
      if(changed) saveState();
    }
  }catch(e){}
}
loadSharedTokens();

// ── Helpers ───────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const fmtMoney = (v, cur='BRL') => {
  const n = parseFloat(v)||0;
  if(cur==='BRL') return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  if(cur==='USD') return 'US$ '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return cur+' '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
};
const fmtNum = v => Math.round(parseFloat(v)||0).toLocaleString('pt-BR');
const fmtPct = v => (parseFloat(v)||0).toFixed(2)+'%';
const fmtRoas = r => (r==null) ? '—' : (parseFloat(r)||0).toFixed(2)+'x';
const roasColor = r => (r==null) ? '#888' : (r>=1.5?'#1a9e3e':r>=1?'#2e7d32':r>=0.7?'#b08900':'#d32f2f');

function getTokenById(id){ return S.tokens.find(t=>t.id===id)?.token || ''; }

// ── API ───────────────────────────────────────────────────────────────────────
async function api(path, params={}, token=null){
  let url = path.startsWith('http') ? path : GQL+path;
  const sep = url.includes('?') ? '&' : '?';
  url += sep+'access_token='+encodeURIComponent(token);
  Object.entries(params).forEach(([k,v])=>{
    url += '&'+encodeURIComponent(k)+'='+encodeURIComponent(typeof v==='object'?JSON.stringify(v):v);
  });
  const res = await fetch(url);
  const json = await res.json();
  if(json.error){
    const e = json.error;
    throw new Error(`(${e.code}${e.error_subcode?'/'+e.error_subcode:''}) ${e.message}`);
  }
  return json;
}

// ── Conectar (carrega todas contas) ───────────────────────────────────────────
async function connect(){
  if(!S.tokens.length){ alert('Nenhum token cadastrado. Cadastre na automação de subir campanhas ou adicione abaixo.'); return; }

  const btn = $('btn-connect');
  if(btn){ btn.disabled=true; btn.textContent='Conectando…'; }

  S.accounts = [];
  const errs = [];

  for(const tk of S.tokens){
    if(!tk.token) continue;
    try{
      const r = await api('/me/adaccounts',{fields:'id,name,account_id,currency,account_status,timezone_name,timezone_offset_hours_utc',limit:500}, tk.token);
      const accs = (r.data||[]).map(a=>({...a, _tokenId:tk.id, _tokenLabel:tk.label,
        _tzOffset: (a.timezone_offset_hours_utc!=null ? Number(a.timezone_offset_hours_utc) : null),
        _tzName: a.timezone_name}));
      S.accounts.push(...accs);
    }catch(e){ errs.push(`[${tk.label}] ${e.message}`); }
  }

  // dedup
  const seen = new Set();
  S.accounts = S.accounts.filter(a=>{ if(seen.has(a.id)) return false; seen.add(a.id); return true; });

  if(!S.accounts.length){
    if(btn){ btn.disabled=false; btn.textContent='Conectar'; }
    alert('Nenhuma conta encontrada.'+(errs.length?'\n\n'+errs.join('\n'):''));
    return;
  }

  S.connected = true;
  S.view = 'accounts';
  S.path = [];
  saveState();
  render();
  await refreshData();
  scheduleAutoRefresh();
}

function disconnect(){
  S.connected=false; S.accounts=[]; S.data=[]; S.path=[]; S.view='accounts';
  if(autoTimer) clearTimeout(autoTimer);
  saveState(); render();
}

// ── Tokens ────────────────────────────────────────────────────────────────────
function addToken(){
  const label = $('new-tok-label').value.trim();
  const token = $('new-tok-value').value.trim();
  if(!label || !token){ alert('Preencha label e token.'); return; }
  S.tokens.push({id:Date.now()+Math.random(), label, token});
  saveState(); render();
}
function removeToken(id){
  if(!confirm('Remover este token?')) return;
  S.tokens = S.tokens.filter(t=>t.id!==id);
  saveState(); render();
}

// ── Fetch insights ────────────────────────────────────────────────────────────
const INSIGHT_FIELDS = 'spend,impressions,clicks,ctr,cpc,cpm,reach,frequency,inline_link_clicks,inline_link_click_ctr,actions,cost_per_action_type';

// Extrai métrica de actions[] da resposta da Meta
function getActionValue(actions, type){
  if(!Array.isArray(actions)) return 0;
  const a = actions.find(x=>x.action_type===type);
  return a ? parseFloat(a.value)||0 : 0;
}

// ── Fuso de Brasília uniforme ──────────────────────────────────────────────────
// O Meta reporta cada conta no fuso DELA (sem override na API). Para contas fora de
// Brasília, puxamos o gasto por HORA (no fuso do anunciante) e re-agrupamos nos dias
// do Brasil, deixando todo o monitor consistente em BRT.
const BR_OFFSET = -3; // UTC-3

// Data de HOJE em Brasília (YYYY-MM-DD), independente do fuso do navegador
const brToday = () => new Intl.DateTimeFormat('en-CA', {timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
const addDaysStr = (s, days) => { const d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+days); return d.toISOString().slice(0,10); };
function brWindow(period){
  const today = brToday();
  if(period==='today')     return {since:today, until:today};
  if(period==='yesterday'){ const y=addDaysStr(today,-1); return {since:y, until:y}; }
  const n = period==='last_3d'?3 : period==='last_7d'?7 : period==='last_14d'?14 : period==='last_30d'?30 : 7;
  return {since: addDaysStr(today,-n), until: addDaysStr(today,-1)}; // N dias terminando ontem (igual ao last_Nd do Meta)
}

async function fetchInsights(parentId, level, tokenId, tzOffset){
  // Conta fora do fuso BR → caminho horário re-agrupado
  if(tzOffset != null && Number(tzOffset) !== BR_OFFSET){
    return await fetchInsightsHourlyBRT(parentId, level, tokenId, Number(tzOffset));
  }
  const tok = getTokenById(tokenId);
  if(!tok) throw new Error('Token não encontrado');
  const params = {
    level,
    fields: `${INSIGHT_FIELDS},campaign_id,campaign_name,adset_id,adset_name,ad_id,ad_name`,
    date_preset: S.period,
    limit: 500
  };
  const r = await api(`/${parentId}/insights`, params, tok);
  return r.data || [];
}

// Puxa gasto/métricas por hora (fuso do anunciante) e re-agrupa em dias de Brasília,
// devolvendo no MESMO formato que mergeInsightsAndEntities espera.
async function fetchInsightsHourlyBRT(parentId, level, tokenId, tzOffset){
  const tok = getTokenById(tokenId);
  if(!tok) throw new Error('Token não encontrado');
  const win = brWindow(S.period);
  const shift = BR_OFFSET - tzOffset;            // horas a somar no horário da conta → BRT
  const accSince = addDaysStr(win.since, -1);     // folga de 1 dia em cada ponta
  const accUntil = addDaysStr(win.until, 1);
  const idField = level==='campaign'?'campaign_id' : level==='adset'?'adset_id' : level==='ad'?'ad_id' : null;
  const nameField = idField ? idField.replace('_id','_name') : null;

  // campos enxutos: reach/frequency não combinam com breakdown horário; ctr/cpc/cpm recalculados aqui
  let url = `${GQL}/${parentId}/insights?` + [
    'level='+level,
    'fields='+encodeURIComponent('spend,impressions,clicks,actions,campaign_id,campaign_name,adset_id,adset_name,ad_id,ad_name'),
    'breakdowns=hourly_stats_aggregated_by_advertiser_time_zone',
    'time_increment=1',
    'time_range='+encodeURIComponent(JSON.stringify({since:accSince, until:accUntil})),
    'limit=500',
    'access_token='+encodeURIComponent(tok)
  ].join('&');

  const acc = {};
  let pages = 0;
  while(url && pages < 60){
    pages++;
    const json = await (await fetch(url)).json();
    if(json.error) throw new Error(`(${json.error.code}) ${json.error.message}`);
    (json.data||[]).forEach(row=>{
      const hStr = row.hourly_stats_aggregated_by_advertiser_time_zone || '00';
      const hr = parseInt(hStr.slice(0,2),10) || 0;
      const base = new Date(row.date_start+'T00:00:00Z');
      base.setUTCHours(hr + shift);               // desloca para o relógio de Brasília
      const brDate = base.toISOString().slice(0,10);
      if(brDate < win.since || brDate > win.until) return;   // fora da janela BR
      const id = idField ? row[idField] : '__acct__';
      if(!id) return;
      if(!acc[id]) acc[id] = {id, name: nameField ? (row[nameField]||id) : id, spend:0, impressions:0, clicks:0, lpv:0, ic:0};
      const a = acc[id];
      a.spend += parseFloat(row.spend)||0;
      a.impressions += parseInt(row.impressions)||0;
      a.clicks += parseInt(row.clicks)||0;
      a.lpv += getActionValue(row.actions,'landing_page_view');
      a.ic  += getActionValue(row.actions,'initiate_checkout') || getActionValue(row.actions,'offsite_conversion.fb_pixel_initiate_checkout');
    });
    url = (json.paging && json.paging.next) ? json.paging.next : null;
  }

  return Object.values(acc).map(a=>{
    const ins = {
      spend:a.spend, impressions:a.impressions, clicks:a.clicks,
      ctr: a.impressions ? (a.clicks/a.impressions*100) : 0,
      cpc: a.clicks ? (a.spend/a.clicks) : 0,
      cpm: a.impressions ? (a.spend/a.impressions*1000) : 0,
      actions: [{action_type:'landing_page_view', value:a.lpv}, {action_type:'initiate_checkout', value:a.ic}],
      cost_per_action_type: [
        {action_type:'landing_page_view', value: a.lpv ? a.spend/a.lpv : 0},
        {action_type:'initiate_checkout', value: a.ic ? a.spend/a.ic : 0}
      ]
    };
    if(idField){ ins[idField]=a.id; ins[nameField]=a.name; }
    return ins;
  });
}

async function fetchEntityList(parentId, level, tokenId){
  const tok = getTokenById(tokenId);
  const fields = 'id,name,status,effective_status';
  let path;
  if(level==='campaign') path = `/${parentId}/campaigns`;
  else if(level==='adset') path = `/${parentId}/adsets`;
  else if(level==='ad') path = `/${parentId}/ads`;
  const r = await api(path, {fields, limit:500}, tok);
  return r.data || [];
}

function mergeInsightsAndEntities(insights, entities, idField){
  const byId = {};
  entities.forEach(e=>{ byId[e.id] = {...e, spend:0, impressions:0, clicks:0, ctr:0, cpc:0, cpm:0, landing_page_views:0, cost_per_landing_page_view:0, initiate_checkout:0, cost_per_initiate_checkout:0}; });
  insights.forEach(ins=>{
    const id = ins[idField];
    if(!id) return;
    if(!byId[id]) byId[id] = {id, name: ins[idField.replace('_id','_name')]||id, status:'?', effective_status:'?'};
    Object.assign(byId[id], {
      spend: parseFloat(ins.spend)||0,
      impressions: parseInt(ins.impressions)||0,
      clicks: parseInt(ins.clicks)||0,
      reach: parseInt(ins.reach)||0,
      frequency: parseFloat(ins.frequency)||0,
      ctr: parseFloat(ins.ctr)||0,
      cpc: parseFloat(ins.cpc)||0,
      cpm: parseFloat(ins.cpm)||0,
      landing_page_views: getActionValue(ins.actions, 'landing_page_view'),
      cost_per_landing_page_view: getActionValue(ins.cost_per_action_type, 'landing_page_view'),
      initiate_checkout: getActionValue(ins.actions, 'initiate_checkout') || getActionValue(ins.actions, 'offsite_conversion.fb_pixel_initiate_checkout'),
      cost_per_initiate_checkout: getActionValue(ins.cost_per_action_type, 'initiate_checkout') || getActionValue(ins.cost_per_action_type, 'offsite_conversion.fb_pixel_initiate_checkout')
    });
  });
  return Object.values(byId);
}

async function fetchAllCampaignsAcrossAccounts(){
  // Busca campanhas de cada conta selecionada (ou todas se nenhuma selecionada)
  const targets = S.selectedAccountIds.length
    ? S.accounts.filter(a=>S.selectedAccountIds.includes(a.id))
    : S.accounts;

  const promises = targets.map(async acc=>{
    try{
      const insights = await fetchInsights(acc.id, 'campaign', acc._tokenId, acc._tzOffset);
      let entities = [];
      try{ entities = await fetchEntityList(acc.id, 'campaign', acc._tokenId); }catch(e){}
      const merged = mergeInsightsAndEntities(insights, entities, 'campaign_id');
      merged.forEach(m=>{
        m._accountId = acc.id;
        m._accountName = acc.name;
        m._currency = acc.currency;
        m._tokenId = acc._tokenId;
        m._tokenLabel = acc._tokenLabel;
        m._tzOffset = acc._tzOffset;
      });
      return merged;
    }catch(e){
      return [];
    }
  });
  const all = await Promise.all(promises);
  return all.flat();
}

// ── Receita real (Supabase RPC) ───────────────────────────────────────────────
// Converte o período do monitor (date_preset do Meta) numa janela [since, until)
// para casar com a receita. Aproximação: usa meia-noite local; pequenas diferenças
// de fuso entre a conta de anúncio e o created_at (UTC) são esperadas.
function periodRange(period){
  // Mesma janela do gasto (brWindow): meia-noite de Brasília, N dias terminando ontem.
  const today = brToday();
  const at = s => `${s}T00:00:00-03:00`;
  if(period === 'today')     return { since: at(today),                until: at(addDaysStr(today,1)) };
  if(period === 'yesterday') return { since: at(addDaysStr(today,-1)), until: at(today) };
  const n = period==='last_3d'?3 : period==='last_7d'?7 : period==='last_14d'?14 : period==='last_30d'?30 : 7;
  return { since: at(addDaysStr(today,-n)), until: at(today) };
}

async function fetchRevenue(){
  if(!S.showRevenue || !S.sbUrl || !S.sbKey) return null;
  const { since, until } = periodRange(S.period);
  try{
    const res = await fetch(`${S.sbUrl}/rest/v1/rpc/meta_revenue_by_ad`, {
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':S.sbKey,'Authorization':'Bearer '+S.sbKey},
      body: JSON.stringify({ p_since: since, p_until: until })
    });
    if(!res.ok) throw new Error('HTTP '+res.status+' '+(await res.text()).slice(0,120));
    const rows = await res.json();
    const byCampaign={}, byAdset={}, byAd={};
    const add = (m,k,v)=>{ if(!k) return; if(!m[k]) m[k]={vendas:0,receita:0}; m[k].vendas+=v.vendas; m[k].receita+=v.receita; };
    (rows||[]).forEach(r=>{
      const v = { vendas: parseInt(r.vendas)||0, receita: parseFloat(r.receita_bruta)||0 };
      add(byCampaign, r.campaign_id, v); add(byAdset, r.adset_id, v); add(byAd, r.ad_id, v);
    });
    return { byCampaign, byAdset, byAd };
  }catch(e){ console.warn('[receita Supabase] falhou:', e.message); return { _error:e.message, byCampaign:{}, byAdset:{}, byAd:{} }; }
}

// Anexa receita/ROAS às linhas conforme o nível (campaign|adset|ad)
function attachRevenue(rows, level){
  if(!S._rev) return;
  const map = level==='ad' ? S._rev.byAd : level==='adset' ? S._rev.byAdset : S._rev.byCampaign;
  rows.forEach(r=>{
    const hit = map[String(r.id)];
    r._receita = hit ? hit.receita : 0;
    r._vendas  = hit ? hit.vendas  : 0;
    const cur = r.currency || r._currency || 'BRL';
    r._roas   = (cur==='BRL' && (r.spend>0)) ? (r._receita / r.spend) : null;
    r._cpa    = (r._vendas>0) ? (r.spend / r._vendas) : null;        // custo por venda (moeda da conta)
    r._ticket = (r._vendas>0) ? (r._receita / r._vendas) : null;     // ticket médio (R$)
  });
}

async function refreshData(){
  if(S.refreshing) return;
  S.refreshing = true;
  render();

  try{
    // Receita do período (1 chamada por refresh, reaproveitada por todos os níveis)
    S._rev = await fetchRevenue();

    if(S.view === 'allCampaigns'){
      // Sem filtro server-side: applyFilters faz no client com S.statusFilter
      S.data = await fetchAllCampaignsAcrossAccounts();
      attachRevenue(S.data, 'campaign');
    } else if(S.view === 'accounts'){
      // Para cada conta, busca summary insights
      const promises = S.accounts.map(async acc=>{
        try{
          const data = await fetchInsights(acc.id, 'account', acc._tokenId, acc._tzOffset);
          const ins = data[0] || {};
          return {
            ...acc,
            spend: parseFloat(ins.spend)||0,
            impressions: parseInt(ins.impressions)||0,
            clicks: parseInt(ins.clicks)||0,
            ctr: parseFloat(ins.ctr)||0,
            cpc: parseFloat(ins.cpc)||0,
            cpm: parseFloat(ins.cpm)||0,
            reach: parseInt(ins.reach)||0,
            frequency: parseFloat(ins.frequency)||0,
            landing_page_views: getActionValue(ins.actions, 'landing_page_view'),
            cost_per_landing_page_view: getActionValue(ins.cost_per_action_type, 'landing_page_view'),
            initiate_checkout: getActionValue(ins.actions, 'initiate_checkout') || getActionValue(ins.actions, 'offsite_conversion.fb_pixel_initiate_checkout'),
            cost_per_initiate_checkout: getActionValue(ins.cost_per_action_type, 'initiate_checkout') || getActionValue(ins.cost_per_action_type, 'offsite_conversion.fb_pixel_initiate_checkout'),
            _error: null
          };
        }catch(e){
          return {...acc, spend:0, impressions:0, clicks:0, ctr:0, cpc:0, cpm:0, landing_page_views:0, cost_per_landing_page_view:0, initiate_checkout:0, cost_per_initiate_checkout:0, _error:e.message};
        }
      });
      S.data = await Promise.all(promises);
    } else {
      // View campaigns / adsets / ads
      const last = S.path[S.path.length-1];
      const tokenId = last._tokenId;
      const level = S.view === 'campaigns' ? 'campaign' : S.view === 'adsets' ? 'adset' : 'ad';
      const idField = level + '_id';

      const insights = await fetchInsights(last.id, level, tokenId, (S.path[0]||{})._tzOffset);
      let entities = [];
      try{ entities = await fetchEntityList(last.id, level, tokenId); }
      catch(e){ /* sem entidade — usa insights apenas */ }

      let merged = mergeInsightsAndEntities(insights, entities, idField);

      // Sem filtro server-side: applyFilters faz no client com S.statusFilter
      // Inserir currency da conta-mãe
      const acct = S.path.find(p=>p.type==='account');
      merged.forEach(m=>{ m._currency = acct?.currency || 'BRL'; m._tokenId = tokenId; });
      attachRevenue(merged, level);

      S.data = merged;
    }

    sortData();
    S.lastRefresh = new Date();
  }catch(e){
    console.error(e);
    alert('Erro ao buscar dados:\n'+e.message);
  }finally{
    S.refreshing = false;
    render();
  }
}

function sortData(){
  const dir = S.sortDir === 'asc' ? 1 : -1;
  S.data.sort((a,b)=>{
    let av = a[S.sortBy], bv = b[S.sortBy];
    if(typeof av === 'string') return av.localeCompare(bv) * dir;
    return ((av||0) - (bv||0)) * dir;
  });
}

// ── Auto-refresh ──────────────────────────────────────────────────────────────
let autoTimer = null;
let countdownTimer = null;
let countdownEnd = null;
function scheduleAutoRefresh(){
  if(autoTimer) clearTimeout(autoTimer);
  if(countdownTimer) clearInterval(countdownTimer);
  if(!S.autoRefresh || !S.connected) return;
  countdownEnd = Date.now() + 5*60*1000;
  countdownTimer = setInterval(()=>{
    const el = $('countdown');
    if(el && countdownEnd){
      const ms = Math.max(0, countdownEnd - Date.now());
      const m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000);
      el.textContent = `${m}:${String(s).padStart(2,'0')}`;
    }
  }, 1000);
  autoTimer = setTimeout(async()=>{
    await refreshData();
    scheduleAutoRefresh();
  }, 5*60*1000);
}

// ── Drill-down ────────────────────────────────────────────────────────────────
async function drillInto(item){
  if(S.view === 'accounts'){
    S.path = [{type:'account', id:item.id, name:item.name, currency:item.currency, _tokenId:item._tokenId, _tzOffset:item._tzOffset}];
    S.view = 'campaigns';
  } else if(S.view === 'allCampaigns'){
    // Cross-account: reconstrói path com a conta dona da campanha
    S.path = [
      {type:'account', id:item._accountId, name:item._accountName, currency:item._currency, _tokenId:item._tokenId, _tzOffset:item._tzOffset},
      {type:'campaign', id:item.id, name:item.name, _tokenId:item._tokenId}
    ];
    S.view = 'adsets';
  } else if(S.view === 'campaigns'){
    S.path.push({type:'campaign', id:item.id, name:item.name, _tokenId:S.path[0]._tokenId});
    S.view = 'adsets';
  } else if(S.view === 'adsets'){
    S.path.push({type:'adset', id:item.id, name:item.name, _tokenId:S.path[0]._tokenId});
    S.view = 'ads';
  } else return;
  saveState(); render();
  await refreshData();
}

function goTo(level){
  if(level === 'accounts'){
    S.path = []; S.view = 'accounts';
  } else if(level === 'allCampaigns'){
    S.path = []; S.view = 'allCampaigns';
  } else if(level === 'campaigns'){
    S.path = S.path.slice(0,1); S.view = 'campaigns';
  } else if(level === 'adsets'){
    S.path = S.path.slice(0,2); S.view = 'adsets';
  }
  saveState(); render();
  refreshData();
}

function setPeriod(p){ S.period = p; saveState(); refreshData(); }
function setSort(col){
  if(S.sortBy === col){ S.sortDir = S.sortDir === 'asc' ? 'desc' : 'asc'; }
  else { S.sortBy = col; S.sortDir = 'desc'; }
  sortData(); render();
}
function togglePaused(){ S.showPaused = !S.showPaused; saveState(); refreshData(); }
function toggleRevenue(){ S.showRevenue = !S.showRevenue; saveState(); refreshData(); }
function toggleAutoRefresh(){
  S.autoRefresh = !S.autoRefresh; saveState();
  if(S.autoRefresh) scheduleAutoRefresh();
  else { if(autoTimer) clearTimeout(autoTimer); if(countdownTimer) clearInterval(countdownTimer); }
  render();
}

function applyFilters(rows){
  let r = rows.slice();
  if(S.search?.trim()){
    const q = S.search.toLowerCase();
    r = r.filter(x => (x.name||'').toLowerCase().includes(q) || String(x.id||'').includes(q) || String(x.account_id||'').includes(q));
  }
  if(S.filterMinSpend && parseFloat(S.filterMinSpend)>0){
    const min = parseFloat(S.filterMinSpend);
    r = r.filter(x => (x.spend||0) >= min);
  }
  // Filtro de status (não se aplica à visão de contas)
  if(S.view !== 'accounts' && S.statusFilter && S.statusFilter !== 'all'){
    r = r.filter(x => matchStatusFilter(x));
  }
  return r;
}

function matchStatusFilter(item){
  const st = (item.effective_status || item.status || '').toUpperCase();
  switch(S.statusFilter){
    case 'active': return st === 'ACTIVE';
    case 'paused': return st.includes('PAUSED');
    case 'review': return st.includes('PENDING_REVIEW') || st.includes('IN_PROCESS');
    case 'rejected': return st.includes('DISAPPROVED') || st.includes('REJECTED');
    case 'archived': return st.includes('ARCHIVED');
    default: return true;
  }
}

function setStatusFilter(f){ S.statusFilter = f; saveState(); render(); }

// Gera as <td> de uma linha de total a partir das colunas ativas (mantém alinhamento)
function totalRowCells(t, cur, cols){
  const d = {
    ctr: t.impressions ? (t.clicks/t.impressions*100) : 0,
    cpc: t.clicks ? (t.spend/t.clicks) : 0,
    cpm: t.impressions ? (t.spend/t.impressions*1000) : 0,
    cost_per_landing_page_view: t.landing_page_views ? (t.spend/t.landing_page_views) : 0,
    cost_per_initiate_checkout: t.initiate_checkout ? (t.spend/t.initiate_checkout) : 0,
    _receita: t._receita||0,
    _roas: (cur==='BRL' && t.spend>0) ? ((t._receita||0)/t.spend) : null,
    _cpa: (t._vendas>0) ? (t.spend/t._vendas) : null,
    _ticket: (t._vendas>0) ? ((t._receita||0)/t._vendas) : null
  };
  const val = k => (k in t) ? t[k] : d[k];
  const money = ['spend','cpc','cpm','cost_per_landing_page_view','cost_per_initiate_checkout'];
  let cells = '';
  cols.forEach((c, idx)=>{
    if(idx===0) cells += `<td>Total ${cur||''}</td>`;
    else if(c.k==='id' || c.k==='effective_status') cells += '<td></td>';
    else if(c.k==='_roas') cells += `<td class="num" style="color:${roasColor(d._roas)};font-weight:600">${fmtRoas(d._roas)}</td>`;
    else if(c.k==='_receita') cells += `<td class="num">${fmtMoney(d._receita,'BRL')}</td>`;
    else if(c.k==='_ticket') cells += `<td class="num">${d._ticket!=null?fmtMoney(d._ticket,'BRL'):'—'}</td>`;
    else if(c.k==='_cpa') cells += `<td class="num">${d._cpa!=null?fmtMoney(d._cpa,cur):'—'}</td>`;
    else if(money.includes(c.k)) cells += `<td class="num">${fmtMoney(val(c.k), cur)}</td>`;
    else if(c.k==='ctr') cells += `<td class="num">${fmtPct(d.ctr)}</td>`;
    else cells += `<td class="num">${fmtNum(val(c.k)||0)}</td>`;
  });
  return cells;
}

function buildTable(){
  // Ordem do funil: entrega/criativo → meio de funil → checkout → vendas (fim)
  const cols = [
    {k:'name', l:'Nome', num:false},
    {k:'id', l:'ID', num:false},
    {k:'spend', l:'Gasto', num:true},
    {k:'impressions', l:'Impressões', num:true},
    {k:'clicks', l:'Cliques', num:true},
    {k:'ctr', l:'CTR', num:true},
    {k:'cpc', l:'CPC', num:true},
    {k:'cpm', l:'CPM', num:true},
    {k:'landing_page_views', l:'Visualizações pág destino', num:true},
    {k:'cost_per_landing_page_view', l:'Custo por VPD', num:true},
    {k:'initiate_checkout', l:'Finalização de compra', num:true},
    {k:'cost_per_initiate_checkout', l:'Custo por finalização', num:true}
  ];
  if(S.view !== 'accounts') cols.splice(2,0,{k:'effective_status', l:'Status', num:false});

  // Métricas de venda real (Assiny/Supabase) — no FIM, fechando o funil
  if(S.showRevenue && S.view !== 'accounts'){
    cols.push(
      {k:'_vendas',  l:'Vendas',       num:true},
      {k:'_receita', l:'Receita',      num:true},
      {k:'_cpa',     l:'CPA',          num:true},
      {k:'_ticket',  l:'Ticket Médio', num:true},
      {k:'_roas',    l:'ROAS',         num:true});
  }

  const showName = S.view === 'accounts' ? 'Conta'
    : (S.view === 'campaigns' || S.view === 'allCampaigns') ? 'Campanha'
    : S.view === 'adsets' ? 'Conjunto' : 'Anúncio';
  cols[0].l = showName;

  // Aplica filtros (pesquisa + gasto mínimo)
  const filtered = applyFilters(S.data);

  const tot = filtered.reduce((t,r)=>{
    t.spend += r.spend||0;
    t.impressions += r.impressions||0;
    t.clicks += r.clicks||0;
    t.landing_page_views += r.landing_page_views||0;
    t.initiate_checkout += r.initiate_checkout||0;
    t._receita += r._receita||0;
    t._vendas += r._vendas||0;
    return t;
  }, {spend:0, impressions:0, clicks:0, landing_page_views:0, initiate_checkout:0, _receita:0, _vendas:0});
  tot.ctr = tot.impressions ? (tot.clicks/tot.impressions*100) : 0;
  tot.cpc = tot.clicks ? (tot.spend/tot.clicks) : 0;
  tot.cpm = tot.impressions ? (tot.spend/tot.impressions*1000) : 0;
  tot.cost_per_landing_page_view = tot.landing_page_views ? (tot.spend/tot.landing_page_views) : 0;
  tot.cost_per_initiate_checkout = tot.initiate_checkout ? (tot.spend/tot.initiate_checkout) : 0;

  const byCur = {};
  filtered.forEach(r=>{
    const cur = r.currency || r._currency || 'BRL';
    if(!byCur[cur]) byCur[cur] = {spend:0, impressions:0, clicks:0, landing_page_views:0, initiate_checkout:0, _receita:0, _vendas:0};
    byCur[cur].spend += r.spend||0;
    byCur[cur].impressions += r.impressions||0;
    byCur[cur].clicks += r.clicks||0;
    byCur[cur].landing_page_views += r.landing_page_views||0;
    byCur[cur].initiate_checkout += r.initiate_checkout||0;
    byCur[cur]._receita += r._receita||0;
    byCur[cur]._vendas += r._vendas||0;
  });

  const mainCur = S.view === 'accounts' ? null : (S.path[0]?.currency || 'BRL');
  const filteredCount = filtered.length;
  const totalCount = S.data.length;

  const title = S.view==='accounts' ? 'Contas de Anúncios'
    : S.view==='allCampaigns' ? `🌐 Todas Campanhas (${S.accounts.length} contas)`
    : S.view==='campaigns' ? 'Campanhas'
    : S.view==='adsets' ? 'Conjuntos' : 'Anúncios';
  return `
  <div class="card">
    <h2>${title}
      <span style="font-weight:400;color:#888;font-size:13px">(${filteredCount}${filteredCount!==totalCount?` de ${totalCount}`:''})</span>
    </h2>
    ${filteredCount === 0 ? `
      <div class="empty">
        ${S.refreshing ? '<span class="loading"></span> Buscando dados…' : (totalCount > 0 ? 'Nenhum resultado para os filtros aplicados.' : 'Sem dados para o período selecionado.')}
      </div>
    ` : `
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>${cols.map(c=>`<th class="${c.num?'num':''}" onclick="setSort('${c.k}')">${c.l}${S.sortBy===c.k?(S.sortDir==='asc'?' ▲':' ▼'):''}</th>`).join('')}</tr>
        </thead>
        <tbody>
          ${filtered.map(r=>renderRow(r,cols,mainCur)).join('')}
        </tbody>
        <tfoot>
          ${(S.view === 'accounts' || S.view === 'allCampaigns')
            ? Object.entries(byCur).map(([cur, t])=>`<tr class="total">${totalRowCells(t, cur, cols)}</tr>`).join('')
            : `<tr class="total">${totalRowCells(tot, mainCur, cols)}</tr>`}
        </tfoot>
      </table>
    </div>
    `}
  </div>`;
}

function renderRow(r, cols, mainCur){
  const cur = r.currency || r._currency || mainCur || 'BRL';
  const clickable = S.view !== 'ads';
  const safe = JSON.stringify(r).replace(/'/g,"&apos;").replace(/"/g,'&quot;');
  const onclick = clickable ? `onclick='drillInto(${safe})'` : '';
  const cls = clickable ? 'row-link' : '';
  const status = r.effective_status || r.status;
  const statusBadge = status && status !== '?' ? `<span class="badge ${statusBadgeClass(status)}">${status.replace(/_/g,' ').toLowerCase()}</span>` : '';
  // ID: para conta usa account_id (sem o "act_"), para resto usa id puro
  const displayId = S.view === 'accounts' ? (r.account_id || r.id.replace('act_','')) : r.id;
  const idCell = `<span class="id-cell" title="${esc(displayId)}">${esc(displayId)}<button class="copy-btn" onclick="event.stopPropagation();copyId('${esc(displayId)}',this)" title="Copiar ID">📋</button></span>`;
  const accTag = (S.view === 'allCampaigns' && r._accountName) ? `<span class="acct-tag" style="background:#e7f0fd;color:#1877f2">${esc(r._accountName)}</span>` : '';
  const nameCell = `${esc(r.name||r.id)}${accTag}${r._tokenLabel?`<span class="acct-tag">${esc(r._tokenLabel)}</span>`:''}${cur!=='BRL'?`<span class="acct-tag">${cur}</span>`:''}`;
  const money = ['spend','cpc','cpm','cost_per_landing_page_view','cost_per_initiate_checkout'];
  const cells = cols.map((c, idx)=>{
    if(idx===0) return `<td>${nameCell}</td>`;
    if(c.k==='id') return `<td class="id-col">${idCell}</td>`;
    if(c.k==='effective_status') return `<td>${statusBadge}</td>`;
    if(c.k==='_roas'){
      const hasRev = r._receita!=null;
      return `<td class="num" style="color:${roasColor(r._roas)};font-weight:600" title="${hasRev?(r._vendas||0)+' venda(s)':'sem dado de receita'}">${fmtRoas(r._roas)}</td>`;
    }
    if(c.k==='_receita') return `<td class="num">${r._receita!=null?fmtMoney(r._receita||0,'BRL'):'—'}</td>`;
    if(c.k==='_ticket') return `<td class="num">${r._ticket!=null?fmtMoney(r._ticket,'BRL'):'—'}</td>`;
    if(c.k==='_cpa') return `<td class="num">${r._cpa!=null?fmtMoney(r._cpa,cur):'—'}</td>`;
    if(money.includes(c.k)) return `<td class="num">${fmtMoney(r[c.k]||0, cur)}</td>`;
    if(c.k==='ctr') return `<td class="num">${fmtPct(r.ctr||0)}</td>`;
    return `<td class="num">${fmtNum(r[c.k]||0)}</td>`;
  }).join('');
  return `<tr class="${cls}" ${onclick}>${cells}</tr>`;
}

function copyId(id, btn){
  navigator.clipboard.writeText(id).then(()=>{
    const old = btn.textContent;
    btn.textContent = '✓';
    btn.style.color = '#42b72a';
    setTimeout(()=>{ btn.textContent = old; btn.style.color = ''; }, 1500);
  }).catch(()=>alert('ID: '+id));
}

function statusBadgeClass(s){
  const u = (s||'').toUpperCase();
  if(u === 'ACTIVE') return 'b-green';
  if(u === 'PAUSED') return 'b-orange';
  if(u.includes('DISAPPROVED') || u.includes('REJECT')) return 'b-red';
  return 'b-gray';
}

render();
</script>
</body>
</html>
