<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1c1e21;min-height:100vh}
.wrap{max-width:1400px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h1{color:#7b2ff7;font-size:22px;margin-bottom:2px}
h2{font-size:17px;margin-bottom:14px}
h3{font-size:14px;margin-bottom:10px;color:#444}
.sub{color:#888;font-size:13px}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-purple{background:#7b2ff7;color:#fff}.btn-purple:not(:disabled):hover{background:#6822d8}
.btn-gray{background:#e4e6eb;color:#1c1e21}.btn-gray:not(:disabled):hover{background:#d0d2d8}
label{display:block;font-size:12px;font-weight:700;color:#65676b;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
input,select{width:100%;padding:8px 11px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;background:#fff}
input:focus,select:focus{outline:none;border-color:#7b2ff7}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row > *{flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:#f0f2f5;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border:none;color:#1c1e21}
.chip:hover{background:#e4e6eb}
.chip.active{background:#7b2ff7;color:#fff}
.connected{display:flex;align-items:center;gap:6px;font-size:13px;color:#42b72a;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#42b72a;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid #eee;font-size:13px}
th{font-weight:700;font-size:11px;color:#65676b;text-transform:uppercase;letter-spacing:.3px;background:#f7f8fa;cursor:pointer;user-select:none;position:sticky;top:0}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.total{background:#f3eefe;font-weight:700}
.loading{display:inline-block;width:14px;height:14px;border:2px solid #ddd;border-top-color:#7b2ff7;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:40px;text-align:center;color:#888;font-style:italic}
.tbl-wrap{max-height:560px;overflow:auto;border-radius:8px;border:1px solid #eee}
.info-box{background:#e7f0fd;border-radius:8px;padding:10px 14px;font-size:13px;color:#1877f2}
.warn-box{background:#fef3e2;border-radius:8px;padding:10px 14px;font-size:13px;color:#c47a00}
.err-box{background:#fce8e6;border-radius:8px;padding:10px 14px;font-size:13px;color:#c5221f}
.token-item{display:flex;gap:8px;align-items:center;margin-bottom:6px;padding:6px 10px;background:#f7f8fa;border-radius:6px;font-size:13px}
.token-item .lbl{font-weight:600;color:#7b2ff7}
.token-item .id{color:#888;font-family:monospace;font-size:11px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:#faf9ff;border:1px solid #efeaff;border-radius:10px;padding:14px}
.kpi .k-l{font-size:11px;font-weight:700;color:#7a7a8c;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.kpi .k-v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:12px;color:#888;margin-top:3px}
.kpi.danger{background:#fff5f5;border-color:#ffdada}
.kpi.danger .k-v{color:#d32f2f}
.kpi.good{background:#f2fbf4;border-color:#cfeed6}
/* Colunas bom/ruim */
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.cols2{grid-template-columns:1fr}}
.lane h3{display:flex;align-items:center;gap:8px;font-size:15px}
.item{border-radius:10px;padding:11px 13px;margin-bottom:8px;border:1px solid #eee}
.item.bom{background:#f2fbf4;border-color:#cfeed6}
.item.ruim{background:#fff5f5;border-color:#ffdada}
.item.observar{background:#fffdf3;border-color:#f2eccf}
.item .i-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.item .i-name{font-weight:700;font-size:10.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.item .i-metric{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .i-reason{font-size:12px;color:#555;margin-top:4px}
.item .i-sub{font-size:11px;color:#8a8a8a;margin-top:3px;font-family:monospace}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.b-bom{background:#e6f4ea;color:#137333}
.b-ruim{background:#fce8e6;color:#c5221f}
.b-observar{background:#fef7e0;color:#a86b00}
.b-novo{background:#eef0f3;color:#65676b}
.verdict-good{color:#137333}.verdict-bad{color:#c5221f}
.act{background:#faf9ff;border-left:3px solid #7b2ff7;border-radius:6px;padding:10px 13px;margin-bottom:8px;font-size:13.5px;line-height:1.45}
.act b{color:#7b2ff7}
.mini{font-size:11px;color:#8a8a8a}
.pill{display:inline-block;padding:1px 7px;border-radius:8px;font-size:10px;font-weight:700;background:#eef0f3;color:#555;margin-left:5px}
.winner{color:#137333;font-weight:800}
.loser{color:#c5221f;font-weight:800}
details{margin-top:6px}
summary{cursor:pointer;font-weight:600;color:#7b2ff7;font-size:13px}
.subtab{background:#f3eefe;border:1px solid #e0d8f5;color:#5a2ca0;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:600}
.subtab.on{background:#7b2ff7;border-color:#7b2ff7;color:#fff}
.drill{cursor:pointer;color:#7b2ff7;font-weight:600}
.drill:hover{text-decoration:underline}
.rk-tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;text-transform:uppercase;letter-spacing:.3px}
.rk-esc{background:#e6f7ec;color:#137333}.rk-at{background:#fdf3e0;color:#b26a00}.rk-cut{background:#fdeeee;color:#c5221f}.rk-res{background:#f3eefe;color:#7b2ff7}
.ins-row{padding:8px 12px;border:1px solid #eee;border-radius:8px;margin-bottom:7px;font-size:13px;line-height:1.5}
.ins-row .rk-tag{margin-right:6px}
.leitura-box{margin-top:6px;padding:8px 12px;border:1px solid #e0d8f5;border-radius:8px;background:#faf9ff;font-size:12px;line-height:1.55}
body.dark .leitura-box{background:#211b33;border-color:#33294d}
.sug-box{margin-top:6px;padding:8px 12px;border:1px solid #cfe8d6;border-radius:8px;background:#f4fbf6;font-size:12px;line-height:1.55}
.sug-box i{color:#137333;font-style:normal;font-weight:600}
body.dark .sug-box{background:#16291d;border-color:#24503a}
body.dark .sug-box i{color:#5fd88a}
/* ── Modo escuro ─────────────────────────────────────────────── */

body.dark .card{background:#1b1b23;box-shadow:0 1px 4px rgba(0,0,0,.4)}

body.dark h2{color:#e6e6ec}
body.dark h3{color:#b9b9c4}

body.dark tr.total{background:#2a2340}

body.dark .empty{color:#8a8a96}

body.dark .warn-box{background:#3a2e12;color:#e0a94a}
body.dark .err-box{background:#3a1a18;color:#f0837a}
body.dark .token-item{background:#22222c}
body.dark .kpi{background:#22222c;border-color:#33333f}
body.dark .kpi .k-l{color:#9a9aa6}
body.dark .kpi.danger{background:#331a1a;border-color:#5a2626}
body.dark .kpi.good{background:#17301f;border-color:#245036}
body.dark .item{border-color:#2c2c38}
body.dark .item.bom{background:#17301f;border-color:#245036}
body.dark .item.ruim{background:#331a1a;border-color:#5a2626}
body.dark .item.observar{background:#332d16;border-color:#544a1f}

body.dark .subtab{background:#2a2340;border-color:#3d3358;color:#c4adf0}
body.dark .subtab.on{background:#7b2ff7;border-color:#7b2ff7;color:#fff}
body.dark .drill{color:#a97bff}
body.dark .ins-row{border-color:#2c2c38}
body.dark .rk-esc{background:#17301f;color:#5fd88a}body.dark .rk-at{background:#332d16;color:#e0a94a}body.dark .rk-cut{background:#331a1a;color:#f0837a}body.dark .rk-res{background:#2a2340;color:#c4adf0}
body.dark summary{color:#a97bff}
body.dark .b-novo{background:#2c2c38;color:#b9b9c4}
body.dark .theme-tgl{background:#2c2c38;color:#ffd76a}
.theme-tgl{background:#e4e6eb;color:#7b4a00;padding:8px 12px;border:none;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600}
.init-bar{background:#f2ecff;border:1px solid #e0d8f5}
.funil-bar{background:#faf9ff}
body.dark .init-bar{background:#211b33;border-color:#332a4d}
body.dark .init-bar label{color:#b79bf0}

body.dark details div[style*="color:#5a2ca0"]{color:#b79bf0 !important}
</style>

<div class="wrap">

    <h1>Meta Ads — Otimização</h1>
    <p class="sub">Diagnóstico automático: o que escalar, o que cortar e leituras por conta, lance e oferta. Cruza gasto do Meta com receita real do Supabase.</p>

</div>

<script>
const GQL = 'https://graph.facebook.com/v21.0';
const SB_URL_DEFAULT = 'https://mnrnnmfaupvmjfgpzkou.supabase.co';
const SB_KEY_DEFAULT = 'sb_publishable_KraV-pqYINerxc0nCgdHaA_xHj7ew87';

// Funis do negócio — o match no nome da campanha ignora acento (TOMÉ = TOME)
const FUNNELS = [
  {key:'NATH',    label:'Nathalia', match:'NATH',     emoji:'👩'},
  {key:'TOME',    label:'Tomé',     match:'TOME',     emoji:'👨'},
  {key:'COELHO',  label:'Coelho',   match:'COELHO',   emoji:'🐰'},
  {key:'BACKEND', label:'Backend',  match:'mentoria', emoji:'💼', backend:true}, // Consultorias & Mentorias (sem mídia paga)
  {key:'SESSAO',  label:'Sessão Estratégica', match:'', emoji:'🎯', sheet:'sessao'},  // funil de lead: Oportunidade/CPO
  {key:'DIRECT',  label:'Direct',   match:'',         emoji:'💬', sheet:'direct'},    // funil de mensagem: Conversas/Custo
  {key:'ROICLUB', label:'ROI CLUB', match:'',         emoji:'🏆', sheet:'roiclub'},   // funil de lead: gasto e lead pelo Meta
  {key:'ALL',     label:'Todos',    match:'',         emoji:'🌐'}
];
// Planilha do Google (Sessão Estratégica + Direct) — mesma fonte do Dashboard iniciAmazon
const SHEET_ID='1fafPK17RgaKcYDoF1tGwaArOR1xUy_q2x_wVaQAQSvM';
// Ponte do Typeform. A API do Typeform recusa chamada de navegador (CORS), então
// um Apps Script busca lá e grava nesta aba, que o navegador consegue ler.
// Ver apps-script-typeform-ponte.js.
const TF_SHEET_ID='1Xk3jipROXslXYMdp6x994NzbEMt_puoacSKe-MlYFJM';
const TF_ABA='typeform_leads';
const SHEET_TABS={formulario:'0',paginas:'1149544245',investimento:'609047758',funil_direct:'1714865460',campanhas_direct:'1772428914'};

// ── Estado ──────────────────────────────────────────────────────────────────
let S = loadState() || {};
S.tokens = Array.isArray(S.tokens) ? S.tokens : [];
S.connected = false;
S.accounts = [];
S.data = [];
S.refreshing = false;
S.lastRefresh = null;
if(!S.period) S.period = 'last_7d';
if(typeof S.customSince!=='string') S.customSince='';   // YYYY-MM-DD (BRT) quando período='custom'
if(typeof S.customUntil!=='string') S.customUntil='';
if(typeof S.selCampaign!=='string') S.selCampaign='';   // campanha selecionada p/ curva do dia individual
if(typeof S.nameContains !== 'string') S.nameContains = '';
// Funil selecionado (seletor no topo). Migra o filtro antigo (nameContains='NATH') para funil.
if(!S.funnel){
  const nc0=(S.nameContains||'').trim().toUpperCase().replace('É','E');
  S.funnel = (nc0==='TOME')?'TOME' : (nc0==='COELHO')?'COELHO' : 'NATH';
  if(['NATH','TOME','COELHO'].includes(nc0)) S.nameContains='';
}
if(typeof S.sbUrl !== 'string' || !S.sbUrl) S.sbUrl = SB_URL_DEFAULT;
if(typeof S.sbKey !== 'string' || !S.sbKey) S.sbKey = SB_KEY_DEFAULT;
if(S.cpaAlvo == null) S.cpaAlvo = '';       // vazio = usa CPA médio da carteira
if(S.roasAlvo == null || S.roasAlvo === '') S.roasAlvo = 1.0;
if(S.minSpend == null) S.minSpend = '';     // vazio = default por período
if(S.usdBrl == null || S.usdBrl === '') S.usdBrl = 5.40;
// Custo alvo por métrica (referência nov/2025–jan/2026, métricas de pixel do Meta). Editáveis e persistidos.
S.alvos = Object.assign({cpm:40, cpc:1.5, ctr:2.7, cpl:5, cic:22, tkm:100, cvt:60, ppc:1.5}, S.alvos||{});
S._rev = null;
S._comp = null;        // cache do comparativo 1D/2D/3D/5D
S._compLoading = false;
S._exec = {};          // marca campanhas já executadas nesta sessão (não persiste)
S._otim = null;        // log de otimizações (Supabase)
S._intraday = null;    // curva do dia (gasto/receita por hora)
S._intradayLoading = false;
S._funis = null;       // funis de checkout + produtos (conversão)
S._funisLoading = false;
S._topAds = null;      // melhores anúncios ativos
S._topAdsLoading = false;
if(typeof S.topAdsSort!=='string') S.topAdsSort='roas'; // critério de ordenação dos top anúncios
S._topPub = null;      // melhores públicos ativos
S._topPubLoading = false;
if(typeof S.backendKeyword!=='string' || !S.backendKeyword) S.backendKeyword='mentoria'; // palavra-chave do backend (organização Mentoria e Consultorias)
S._crossover = null;      // compradores backend + origem no front (Supabase, sempre visível, independe da organização selecionada)
S._crossoverRate = null;  // taxa de conversão geral front→backend (histórico completo)
S._crossoverTipos = null; // breakdown por tipo (Mentoria x Consultoria): taxa, receita, ticket
S._crossoverLoading = false;
S._crossoverCAC = null;   // custo real (gasto Meta) por campanha de origem, carregado sob demanda
S._crossoverCACLoading = false;
S._sheet = null;          // dados da planilha do Google (Sessão Estratégica + Direct)
S._sheetLoading = false;
if(!S.sheetTab) S.sheetTab = 'geral';       // sub-aba (funil/expert) dentro de Sessão/Direct
if(!S.sheetLevel) S.sheetLevel = 'campanha'; // nível do detalhamento
S._sheetDrillCamp = null; S._sheetDrillCampName = '';
S._sheetDrillAdset = null; S._sheetDrillAdsetName = '';
S._pesquisa = null;       // painel da pesquisa de onboarding cruzada com compradores (funil Nathalia)
S._pesquisaLoading = false;

function loadState(){ try{ return JSON.parse(localStorage.getItem('mao_state')); }catch(e){ return null; } }
function saveState(){ try{ localStorage.setItem('mao_state', JSON.stringify({...S, data:[], accounts:[], _rev:null, _comp:null, _exec:{}, _otim:null, _intraday:null, _funis:null, _topAds:null, _topPub:null, _crossover:null, _crossoverRate:null, _crossoverTipos:null, _crossoverCAC:null, _pesquisa:null, _sheet:null, _sheetLoading:false, _refData:null, _critAnalise:null, _refLoading:false, _revFunilLoading:false, _diag:null, _diagLoading:false, _gsSending:false, _directApi:null, _directLoading:false, _sessaoApi:null, _sessaoLoading:false, _rcApi:null, _rcLoading:false, _tfLeads:null, _tfLoading:false, refreshing:false})); }catch(e){} }

// Reaproveita tokens do monitor (mam_state) e da automação (maa_state)
function loadSharedTokens(){
  ['mam_state','maa_state'].forEach(key=>{
    try{
      const src = JSON.parse(localStorage.getItem(key));
      (src?.tokens||[]).forEach(t=>{
        if(t.token && !S.tokens.find(x=>x.token===t.token)) S.tokens.push({...t, id:t.id||Date.now()+Math.random()});
      });
    }catch(e){}
  });
  saveState();
}
loadSharedTokens();

// ── Helpers ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtMoney = (v)=> 'R$ '+(parseFloat(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtMoney0 = (v)=> 'R$ '+(parseFloat(v)||0).toLocaleString('pt-BR',{maximumFractionDigits:0});
const fmtNum = v => Math.round(parseFloat(v)||0).toLocaleString('pt-BR');
const fmtPct = v => (parseFloat(v)||0).toFixed(2)+'%';
const fmtRoas = r => (r==null) ? '—' : (parseFloat(r)||0).toFixed(2)+'x';
const roasColor = r => (r==null) ? '#888' : (r>=1.5?'#137333':r>=1?'#2e7d32':r>=0.7?'#b08900':'#d32f2f');
function getTokenById(id){ return S.tokens.find(t=>t.id===id)?.token || ''; }
// Funil: normaliza (sem acento, minúsculo) e casa nome da campanha com o funil + refino opcional
function norm(s){ return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function currentFunnel(){ return FUNNELS.find(f=>f.key===S.funnel) || FUNNELS[0]; }
// ── Iniciativas: Perpétuo (Nath/Tomé/Coelho/Backend) · Sessão · Direct ──────
const INICIATIVAS=[['perpetuo','Perpétuo','🔁'],['sessao','Sessão','🎯'],['direct','Direct','💬'],['roiclub','ROI CLUB','🏆']];
// Sub-funis de cada iniciativa.
//   ATUAIS  = o que roda hoje, sempre vira aba
//   o resto = histórico, só vira aba quando tem dado no período escolhido
const FUNIS_SESSAO=['NATIVO','PLANO','TOMENATH','CARTA','FLP'];
const SE_ATUAIS=['NATIVO','PLANO','TOMENATH'];
const NOME_SE={NATIVO:'Nativo',PLANO:'Plano de Negócio',TOMENATH:'Tomé + Nath',CARTA:'Carta / Consultoria',FLP:'FLP (VSL)'};

// Desde 12/08 o Typeform virou dois: o original (vagaroiclub, do Tomé) e o do
// Coelho (/to/QL6RHz7f). São formulários e campanhas separados, então viram
// caminhos separados. Sem isso o Coelho somava no balde do Tomé.
const FUNIS_ROICLUB=['TYPEFORM_TOME','TYPEFORM_COELHO','CAPTURA'];
const NOME_RC={TYPEFORM_TOME:'Typeform Tomé',TYPEFORM_COELHO:'Typeform Coelho',CAPTURA:'Página de Captura'};
const RC_EH_TYPEFORM=k=>k==='TYPEFORM_TOME'||k==='TYPEFORM_COELHO';

const EXPERTS_ATUAIS=['Tomé','Coelho','Marcão','Elvio','Manolo'];
function currentIniciativa(){
  if(S.view==='criativos') return 'perpetuo';
  const f=currentFunnel();
  return f.sheet ? f.sheet : 'perpetuo';   // sessao | direct | roiclub
}
function setIniciativa(k){
  if(k===currentIniciativa()) return;
  if(k==='sessao'){ S.view='dash'; setFunnel('SESSAO'); }
  else if(k==='direct'){ S.view='dash'; setFunnel('DIRECT'); }
  else if(k==='roiclub'){ S.view='dash'; setFunnel('ROICLUB'); }
  else { const back=(S.lastPerp&&FUNNELS.some(f=>f.key===S.lastPerp&&!f.sheet))?S.lastPerp:'NATH'; S.view='dash'; setFunnel(back); }

async function api(path, params={}, token=null){
  let url = path.startsWith('http') ? path : GQL+path;
  const sep = url.includes('?') ? '&' : '?';
  url += sep+'access_token='+encodeURIComponent(token);
  Object.entries(params).forEach(([k,v])=>{ url += '&'+encodeURIComponent(k)+'='+encodeURIComponent(typeof v==='object'?JSON.stringify(v):v); });
  const res = await fetch(url);
  const json = await res.json();
  if(json.error){ const e=json.error; throw new Error(`(${e.code}${e.error_subcode?'/'+e.error_subcode:''}) ${e.message}`); }
  return json;
}

// Testa cada token isoladamente: validade, app dono, business, escopos e o erro
// exato de /me/adaccounts. Serve para separar "token expirado" de "app bloqueado".
async function diagTokens(){
  if(!S.tokens.length){ alert('Nenhum token encontrado.'); return; }
  S._diagLoading=true; S._diag=null; render();
  const out=[];
  for(const tk of S.tokens){
    if(!tk.token) continue;
    const d={label:tk.label||'(sem nome)', me:null, app:null, appId:null, biz:[], expira:null, scopes:[], contas:null, erro:null, erroCode:null};
    try{ const me=await api('/me',{fields:'id,name'},tk.token); d.me=me.name||me.id; }
    catch(e){ d.erro=e.message; const m=e.message.match(/^\((\d+)/); d.erroCode=m?m[1]:null; }
    if(d.me){
      try{
        const dbg=await api('/debug_token',{input_token:tk.token},tk.token);
        const dd=(dbg&&dbg.data)||{};
        d.app=dd.application||null; d.appId=dd.app_id||null;
        d.scopes=dd.scopes||[];
        d.expira = dd.expires_at ? (dd.expires_at===0?'nunca':new Date(dd.expires_at*1000).toLocaleString('pt-BR')) : 'nunca';
        if(dd.is_valid===false) d.erro='token marcado como INVÁLIDO pelo Meta';
      }catch(e){ /* debug_token pode ser negado sem app token; não é fatal */ }
      try{ const b=await api('/me/businesses',{fields:'id,name',limit:50},tk.token); d.biz=(b.data||[]).map(x=>x.name); }catch(e){}
      try{ const r=await api('/me/adaccounts',{fields:'id,name,account_status',limit:500},tk.token);
        d.contas=(r.data||[]).length;
        d.desativadas=(r.data||[]).filter(a=>a.account_status!==1).map(a=>a.name);
      }catch(e){ d.erro=e.message; const m=e.message.match(/^\((\d+)/); d.erroCode=m?m[1]:null; }
    }
    out.push(d);
  }
  S._diag=out; S._diagLoading=false; render();
}
function _diagVeredito(d){
  if(!d.me){
    if(d.erroCode==='200') return {cor:'#c5221f', txt:'O APP está bloqueado pelo Meta — não é o token. Nem /me responde. Gerar token novo COM O MESMO APP não resolve: use outro app do Business Manager para gerar o token, ou destrave este app no painel de desenvolvedores.'};
    if(/465/.test(d.erro||'')) return {cor:'#c5221f', txt:'O app usado não pertence ao Business Manager deste system user. Adicione o app no BM e gere o token de novo escolhendo esse app.'};
    if(d.erroCode==='190') return {cor:'#c5221f', txt:'Token expirado ou revogado — gere um novo no Business Manager.'};
    return {cor:'#c5221f', txt:'Token não responde: '+(d.erro||'erro desconhecido')};
  }
  if(d.contas>0) return {cor:'#137333', txt:`OK — ${d.contas} conta(s) acessível(is).`+(d.desativadas&&d.desativadas.length?` ⚠️ ${d.desativadas.length} com status ≠ ativa: ${d.desativadas.slice(0,3).join(', ')}`:'')};
  if(d.erroCode==='200') return {cor:'#c5221f', txt:'Acesso à API bloqueado pelo Meta para este app/business. Verifique o Security Center do BM e se a Marketing API do app continua liberada (não é problema de token expirado — o token responde, o acesso é que foi cortado).'};
  if(/465/.test(d.erro||'')) return {cor:'#c5221f', txt:'O app usado não pertence ao Business Manager deste system user. Adicione o app no BM (Configurações → Contas → Apps) e gere o token de novo escolhendo esse app.'};
  if(d.erro) return {cor:'#c5221f', txt:d.erro};
  return {cor:'#b26a00', txt:'Token válido mas nenhuma conta de anúncio vinculada — dê acesso às contas para este system user.'};
}

const INSIGHT_FIELDS = 'spend,impressions,clicks,ctr,cpc,cpm,reach,frequency,actions,cost_per_action_type';
function getActionValue(actions, type){ if(!Array.isArray(actions)) return 0; const a=actions.find(x=>x.action_type===type); return a?parseFloat(a.value)||0:0; }
const BR_OFFSET = -3;
const brToday = () => new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const addDaysStr = (s,days)=>{ const d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+days); return d.toISOString().slice(0,10); };
function customRange(){ const u=S.customUntil||brToday(); const s=S.customSince||addDaysStr(u,-6); return (s<=u)?{since:s,until:u}:{since:u,until:s}; }
function monthStart(){ return brToday().slice(0,8)+'01'; }
function brWindow(period){
  const today=brToday();
  if(period==='custom') return customRange();
  if(period==='today') return {since:today,until:today};
  if(period==='yesterday'){ const y=addDaysStr(today,-1); return {since:y,until:y}; }
  if(period==='this_month') return {since:monthStart(),until:today};
  const n=period==='last_3d'?3:period==='last_7d'?7:period==='last_14d'?14:period==='last_30d'?30:7;
  return {since:addDaysStr(today,-n),until:addDaysStr(today,-1)};
}
function periodDays(period){
  if(period==='custom'){ const r=customRange(); return Math.max(1, Math.round((new Date(r.until+'T00:00:00Z')-new Date(r.since+'T00:00:00Z'))/864e5)+1); }
  if(period==='this_month'){ return Math.max(1, Math.round((new Date(brToday()+'T00:00:00Z')-new Date(monthStart()+'T00:00:00Z'))/864e5)+1); }
  return period==='today'||period==='yesterday'?1:(period==='last_3d'?3:period==='last_7d'?7:period==='last_14d'?14:period==='last_30d'?30:7);
}

async function fetchInsights(parentId, level, tokenId, tzOffset){
  if(tzOffset!=null && Number(tzOffset)!==BR_OFFSET) return await fetchInsightsHourlyBRT(parentId, level, tokenId, Number(tzOffset));
  const tok=getTokenById(tokenId); if(!tok) throw new Error('Token não encontrado');
  const qs=[`level=${level}`,`fields=${encodeURIComponent(INSIGHT_FIELDS+',campaign_id,campaign_name')}`,`limit=500`];
  if(S.period==='custom'){ qs.push('time_range='+encodeURIComponent(JSON.stringify(brWindow('custom')))); } else { qs.push('date_preset='+S.period); }
  let url=`${GQL}/${parentId}/insights?${qs.join('&')}&access_token=${encodeURIComponent(tok)}`;
  const all=[]; let pages=0; let rlErrs=0;
  while(url && pages<30){ pages++;
    const j=await (await fetch(url)).json();
    if(j.error){
      const code=j.error.code||0;
      if((code===4||code===17||code===32||code===613)&&rlErrs<3){ rlErrs++; await new Promise(r=>setTimeout(r,rlErrs*15000)); continue; }
      throw new Error(`(${code}) ${j.error.message}`);
    }
    if(j.data) all.push(...j.data);
    url=(j.paging&&j.paging.next)?j.paging.next:null;
  }
  return all;
}
async function fetchInsightsHourlyBRT(parentId, level, tokenId, tzOffset){
  const tok=getTokenById(tokenId); if(!tok) throw new Error('Token não encontrado');
  const win=brWindow(S.period); const shift=BR_OFFSET-tzOffset;
  const accSince=addDaysStr(win.since,-1), accUntil=addDaysStr(win.until,1);
  let url=`${GQL}/${parentId}/insights?`+[
    'level='+level,
    'fields='+encodeURIComponent('spend,impressions,clicks,actions,campaign_id,campaign_name'),
    'breakdowns=hourly_stats_aggregated_by_advertiser_time_zone',
    'time_increment=1',
    'time_range='+encodeURIComponent(JSON.stringify({since:accSince,until:accUntil})),
    'limit=500','access_token='+encodeURIComponent(tok)
  ].join('&');
  const acc={}; let pages=0; let rlErrs=0;
  while(url && pages<60){
    pages++;
    const json=await (await fetch(url)).json();
    if(json.error){
      const code=json.error.code||0;
      if((code===4||code===17||code===32||code===613)&&rlErrs<3){ rlErrs++; await new Promise(r=>setTimeout(r,rlErrs*15000)); continue; }
      throw new Error(`(${code}) ${json.error.message}`);
    }
    (json.data||[]).forEach(row=>{
      const hStr=row.hourly_stats_aggregated_by_advertiser_time_zone||'00';
      const hr=parseInt(hStr.slice(0,2),10)||0;
      const base=new Date(row.date_start+'T00:00:00Z'); base.setUTCHours(hr+shift);
      const brDate=base.toISOString().slice(0,10);
      if(brDate<win.since||brDate>win.until) return;
      const id=row.campaign_id; if(!id) return;
      if(!acc[id]) acc[id]={id,name:row.campaign_name||id,spend:0,impressions:0,clicks:0,lpv:0,ic:0};
      const a=acc[id];
      a.spend+=parseFloat(row.spend)||0; a.impressions+=parseInt(row.impressions)||0; a.clicks+=parseInt(row.clicks)||0;
      a.lpv+=getActionValue(row.actions,'landing_page_view');
      a.ic +=getActionValue(row.actions,'initiate_checkout')||getActionValue(row.actions,'offsite_conversion.fb_pixel_initiate_checkout');
    });
    url=(json.paging&&json.paging.next)?json.paging.next:null;
  }
  return Object.values(acc).map(a=>({
    spend:a.spend, impressions:a.impressions, clicks:a.clicks,
    ctr:a.impressions?(a.clicks/a.impressions*100):0, cpc:a.clicks?(a.spend/a.clicks):0, cpm:a.impressions?(a.spend/a.impressions*1000):0,
    actions:[{action_type:'landing_page_view',value:a.lpv},{action_type:'initiate_checkout',value:a.ic}],
    cost_per_action_type:[{action_type:'landing_page_view',value:a.lpv?a.spend/a.lpv:0},{action_type:'initiate_checkout',value:a.ic?a.spend/a.ic:0}],
    campaign_id:a.id, campaign_name:a.name
  }));
}

// ── Funis de lead ao vivo pela API do Meta ──────────────────────────────────
// Sessão e ROI CLUB. Puxa gasto, pageview e LEAD do pixel, então assim que a LP
// voltar a disparar o evento os números aparecem sozinhos, sem depender da
// planilha nem do Typeform.
//
// O nome da campanha mudou de padrão em 06/08, e o filtro do Meta é CONTAIN de
// um valor só (vários filtros viram E, não OU). Por isso cada funil busca uma
// vez por termo e junta, descartando repetido por (dia + anúncio).
const LEAD_ACTIONS=['offsite_conversion.fb_pixel_lead','lead','onsite_conversion.lead_grouped'];
const FUNIL_API={
  SESSAO:  {store:'_sessaoApi', loading:'_sessaoLoading', termos:['SESSÃO','SE-F0'], rotulo:'Sessão',   classificar:cn=>_classFunnel(cn)},
  ROICLUB: {store:'_rcApi',     loading:'_rcLoading',     termos:['ROICLUB','RCB'],  rotulo:'ROI CLUB', classificar:cn=>_classRoiClub(cn)}
};

function _actVal(actions,tipos){
  if(!actions) return 0;
  for(const t of tipos){ const a=actions.find(x=>x.action_type===t); if(a) return parseFloat(a.value)||0; }
  return 0;
}

/**
 * Intervalo enviado ao Meta nas views de funil.
 *
 * Antes ia o date_preset ("last_7d"), e o preset do Meta não inclui hoje,
 * enquanto a tela mostrava e filtrava até hoje. Resultado: lead de hoje entrava
 * e o gasto de hoje não, empurrando CPL e CPO para baixo sem aviso.
 * Agora vai o mesmo intervalo que o cabeçalho exibe, então as três leituras
 * (rótulo, gasto e lead) falam do mesmo período.
 */
function janelaMeta(){ const w=sheetWindow(); return {since:w.since, until:w.until}; }
function _mesmaJanela(a,b){ return !!a&&!!b&&a.since===b.since&&a.until===b.until; }

/**
 * Busca as linhas de um funil numa conta, já com a data em horário de Brasília.
 *
 * As contas C01, que rodam Direct, Sessão e ROI CLUB, estão em America/New_York.
 * O "dia" que o Meta devolve para elas vai da 01h de Brasília até a 00h59 do dia
 * seguinte, enquanto o lead da planilha usa o dia de Brasília cheio. Sobrava
 * 1 hora de descasamento em cada ponta: no total de um período isso se anula,
 * mas em "Hoje", "Ontem" e nas barras do gráfico não, chegando a 3% no dia.
 *
 * Quando a conta está em UTC-3, mantém a busca diária, que é bem mais leve.
 * Fora disso, pede a quebra por hora, alarga a janela em um dia de cada lado
 * (a hora 23 de lá cai no dia seguinte aqui) e reatribui cada hora ao dia certo.
 */
async function _linhasFunilDaConta(acc, tok, termo, jan, flds){
  const tz=(acc._tzOffset!=null?Number(acc._tzOffset):BR_OFFSET);
  const shift=BR_OFFSET-tz;
  const porHora=(shift!==0);
  const filt=encodeURIComponent(JSON.stringify([{field:'campaign.name',operator:'CONTAIN',value:termo}]));
  const range=porHora?{since:addDaysStr(jan.since,-1),until:addDaysStr(jan.until,1)}:jan;

  const qs=[`level=ad`,`fields=${flds}`,`time_increment=1`,`limit=500`,`filtering=${filt}`,
            'time_range='+encodeURIComponent(JSON.stringify(range))];
  if(porHora) qs.push('breakdowns=hourly_stats_aggregated_by_advertiser_time_zone');

  let url=`${GQL}/${acc.id}/insights?${qs.join('&')}&access_token=${encodeURIComponent(tok)}`;
  const out=[]; let pg=0;
  while(url && pg<60){ pg++;
    let j; try{ j=await (await fetch(url)).json(); }catch(e){ break; }
    if(j.error){ console.warn('[funil]',acc.name,j.error.message); break; }
    (j.data||[]).forEach(r=>{
      let dia=r.date_start||'';
      if(porHora){
        const h=parseInt(String(r.hourly_stats_aggregated_by_advertiser_time_zone||'00').slice(0,2),10)||0;
        const base=new Date(dia+'T00:00:00Z'); base.setUTCHours(h+shift);
        dia=base.toISOString().slice(0,10);
      }
      if(dia<jan.since||dia>jan.until) return;   // sobra da janela alargada
      // A chave identifica a linha crua. Com quebra por hora existem 24 linhas
      // por anúncio e por dia, e todas precisam somar; a chave só evita contar
      // duas vezes a mesma linha quando ela casa com mais de um termo de busca.
      const hora=porHora?String(r.hourly_stats_aggregated_by_advertiser_time_zone||''):'';
      out.push({key:(r.date_start||'')+'|'+(r.ad_id||'')+'|'+hora, row:r, dia});
    });
    url=(j.paging&&j.paging.next)?j.paging.next:null;
  }
  return out;
}

/** Refaz a busca quando a janela mudou desde o último fetch (ex.: a planilha

function _csvParse(text){
  const rows=[]; let row=[], field='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else q=false; } else field+=c; }
    else { if(c==='"') q=true; else if(c===','){ row.push(field); field=''; } else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; } else if(c==='\r'){} else field+=c; }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const hdr=rows[0]; return rows.slice(1).filter(r=>r.length>1||(r[0]||'').trim()).map(r=>{ const o={}; hdr.forEach((h,i)=>o[h]=r[i]!=null?r[i]:''); return o; });
}

function _num(v){ if(v==null) return 0; let s=String(v).trim(); if(!s) return 0; s=s.replace('R$','').replace(/ /g,'').trim(); if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=parseFloat(s); return isNaN(n)?0:n; }

// ── Nomenclatura das campanhas ──────────────────────────────────────────────
// Desde 06/08 o padrão é, separado por barra vertical:
//   DD/MM | EMPRESA | CONTA | FUNIL | SUB-FUNIL | ESTRUTURA | FASE
// Ler pela POSIÇÃO evita os falsos positivos de procurar palavra solta: o nome
// da conta ou da fase pode conter "TESTE", "LP" ou o nome de um expert.
function _slotsCamp(cn){ return String(cn||'').split('|').map(s=>s.trim()); }
function _subFunil(cn){ const p=_slotsCamp(cn); return p.length>=5 ? _sa(p[4]) : ''; }
function _sa(s){ return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim(); }

// Sessão. Os três primeiros são os funis que rodam hoje; CARTA e FLP ficam para
// o histórico de julho e só aparecem como aba quando têm dado no período.
function _classFunnel(cn){
  const sub=_subFunil(cn), n=_sa(cn);
  if(sub){
    if(sub.includes('NATIVO'))                 return 'NATIVO';
    if(sub.includes('PLANO')||sub==='LP')      return 'PLANO';   // LP antiga = mesma /sessao-estrategica2/
    if(sub.includes('TOME')&&sub.includes('NATH')) return 'TOMENATH';
  }
  if(n.includes('FLP')||n.includes('FUNIL_VSL')) return 'FLP';
  if(n.includes('CARTA')||n.includes('CONSULTORIA_LP')||n.includes('FUNIL_CARTA')) return 'CARTA';
  return 'NATIVO'; }

/**
 * A qual iniciativa o lead da aba "paginas" pertence.
 * Ordem de confiança: slug da página → URL → nome da campanha. O slug ganha
 * porque é o único preenchido quando a UTM não chega (caso dos 80 leads de
 * 11/08), e porque diz onde a pessoa realmente estava.
 */
function _iniciativaDoLead(slug,url,campanha){
  const s=_sa(slug)+' '+_sa(url);
  if(s.includes('ROI-CLUB')||s.includes('ROICLUB')||s.includes('ROI CLUB')) return 'roiclub';
  const c=_sa(campanha);
  if(c.includes('ROICLUB')||c.includes('RCB')) return 'roiclub';
  return 'sessao';
}

// ROI CLUB: Typeform ou página de captura ("FULL SALES" no nome da campanha).
function _classRoiClub(cn){
  const sub=_subFunil(cn), n=_sa(cn);
  if(sub.includes('TYPEFORM')||n.includes('TYPEFORM'))
    return (sub.includes('COELHO')||n.includes('COELHO')) ? 'TYPEFORM_COELHO' : 'TYPEFORM_TOME';
  return 'CAPTURA'; }
// Direct: o expert é o sub-funil. Elvio e Manolo entraram em ago/2026 e ainda
// não têm campanha com gasto, mas já ficam mapeados para não caírem em "Outros".
const EXPERTS_DIRECT=[['COELHO','Coelho'],['TOME','Tomé'],['MARCAO','Marcão'],['ELVIO','Elvio'],['MANOLO','Manolo'],['NATH','Nath']];
function _classExpert(cn){
  const sub=_subFunil(cn), n=_sa(cn);
  for(const [chave,rotulo] of EXPERTS_DIRECT){ if(sub.includes(chave)) return rotulo; }
  for(const [chave,rotulo] of EXPERTS_DIRECT){ if(n.includes(chave)) return rotulo; }
  return 'Outros'; }
const _NOTOPP=new Set(['até 3.000,00 reais','até r$ 3.000','até r$3.000','não tenho como iniciar um negócio hoje.','']);
/**
 * Oportunidade = declarou verba acima de R$ 3.000.
 *
 * A lista fixa _NOTOPP só cobria as frases da Sessão. O ROI CLUB usa outra
 * redação ("Não tenho nada disponível para investir") e 61 leads sem verba
 * nenhuma entravam como oportunidade. Por isso a regra passou a ser por
 * prefixo, que aguenta variação de redação entre formulários:
 *   "não tenho..."  → sem verba, e também "não tenho como iniciar"
 *   "até 3..."      → até R$ 3.000, o corte combinado
 * A lista antiga fica como rede de segurança para frases fora desses padrões.
 */
function _isOpp(a){
  a=(a||'').trim().toLowerCase();
  if(!a||_NOTOPP.has(a)) return false;
  const n=a.normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(n.startsWith('nao tenho')) return false;
  if(n.startsWith('ate 3'))     return false;
  if(n.startsWith('<test lead'))return false;
  return true; }

// ── Receita (Supabase) ──────────────────────────────────────────────────────
function periodRange(period){
  const today=brToday(); const at=s=>`${s}T00:00:00-03:00`;
  if(period==='custom'){ const r=customRange(); return {since:at(r.since), until:at(addDaysStr(r.until,1))}; }
  if(period==='today') return {since:at(today),until:at(addDaysStr(today,1))};
  if(period==='yesterday') return {since:at(addDaysStr(today,-1)),until:at(today)};
  if(period==='this_month') return {since:at(monthStart()),until:at(addDaysStr(today,1))};
  const n=periodDays(period);
  return {since:at(addDaysStr(today,-n)),until:at(today)};
}

function tagLance(r){ const m=(r.name||'').match(/CBO\s*(TRAD|CPA)/i); if(m) return 'CBO '+m[1].toUpperCase(); if(/\bABO\b/i.test(r.name||'')) return 'ABO'; if(r.daily_budget>0||r.lifetime_budget>0) return 'CBO'; return 'ABO'; }
function tagOferta(r){ const n=r.name||''; const d=(n.match(/(\d{2}\.\d{2})/)||[])[1]||'s/data'; const c=(n.match(/VSL\s*37\s*(QUIZ|LP)/i)||[])[1]; return d+(c?(' '+c.toUpperCase()):''); }
function tagEstrutura(r){ const m=(r.name||'').match(/1-(\d)-X/i); return m?('1-'+m[1]):'—'; }
function shortName(n){
  n=String(n||'');
  const ca=(n.match(/\[CA\s*0*(\d+)\s*\]/i)||[])[0]||'';
  const of=tagOferta({name:n});
  const la=tagLance({name:n});
  const es=tagEstrutura({name:n});
  let s=[of,la,es].filter(x=>x&&x!=='—').join(' ');
  if(ca) s=ca.replace(/[\[\]]/g,'')+' · '+s;
  return s||n.slice(0,60);
}

// ── Motor de análise ────────────────────────────────────────────────────────
function analyze(){
  const days=periodDays(S.period);
  // converte gasto USD→BRL em todas as campanhas
  const usdRate = parseFloat(S.usdBrl)>0 ? parseFloat(S.usdBrl) : 5.40;
  (S.data||[]).forEach(r=>{
    r._spendBRL = ((r._currency||'BRL')==='USD') ? (r.spend||0)*usdRate : (r.spend||0);
    r._roas = (r._spendBRL>0) ? ((r._receita||0)/r._spendBRL) : null;
    r._cpa  = (r._vendasFront>0) ? (r._spendBRL/r._vendasFront) : null;
  });
  // universo do funil: com gasto no período, batendo o funil (+ refino). Inclui pausadas/desativadas e contas USD.
  const inFunil = r => (r._spendBRL||0)>0 && matchFunnel(r.name);
  const rowsAll = (S.data||[]).filter(inFunil);
  // decisão (bom/ruim, escalar/cortar, botões): só o que está ATIVO agora
  let rows = rowsAll.filter(r=>(r.effective_status||'')==='ACTIVE');
  const pausadasCount = rowsAll.length - rows.length;
  // TOTAIS do período: tudo que gastou (ativas + pausadas/desativadas) → análise correta do dia
  const T={spend:0,receita:0,front:0,total:0,imp:0,clicks:0,ic:0,lpv:0};
  rowsAll.forEach(r=>{ T.spend+=r._spendBRL||0; T.receita+=r._receita||0; T.front+=r._vendasFront||0; T.total+=r._vendasTotal||0; T.imp+=r.impressions||0; T.clicks+=r.clicks||0; T.ic+=r.initiate_checkout||0; T.lpv+=r.landing_page_views||0; });
  const pausadasGasto = rowsAll.filter(r=>(r.effective_status||'')!=='ACTIVE').reduce((s,r)=>s+(r._spendBRL||0),0);
  const blendedCPA = T.front>0 ? T.spend/T.front : 0;
  const off=(S._rev&&S._rev.offsite)||{front:0,total:0,receita:0};
  const funnelTotal=(S._rev&&S._rev.funnelTotal)||{front:0,total:0,receita:0};

  // config
  const cpaAlvo = (parseFloat(S.cpaAlvo)>0) ? parseFloat(S.cpaAlvo) : (blendedCPA||9999);
  const roasAlvo = (parseFloat(S.roasAlvo)>0) ? parseFloat(S.roasAlvo) : 1.0;
  const defMin = ({1:60,3:150,7:250,14:450,30:800})[days] || 250;
  const minSpend = (parseFloat(S.minSpend)>=0 && S.minSpend!=='') ? parseFloat(S.minSpend) : defMin;

  // classifica — critério baseado SÓ no ROAS vs ROAS alvo (breakeven)
  rows.forEach(r=>{
    const spend=r._spendBRL||0, roas=r._roas;
    let v,reason;
    if(spend<minSpend){ v='novo'; reason='gasto abaixo do mínimo para julgar ('+fmtMoney0(spend)+')'; }
    else if(roas==null){ v='novo'; reason='sem dado de receita'; }
    else if(roas>=roasAlvo){ v='bom'; reason='ROAS '+fmtRoas(roas)+' ≥ alvo '+fmtRoas(roasAlvo)+' — no lucro'; }
    else if(roas>=roasAlvo*0.85){ v='observar'; reason='ROAS '+fmtRoas(roas)+' — no limite do breakeven (alvo '+fmtRoas(roasAlvo)+')'; }
    else { v='ruim'; reason='ROAS '+fmtRoas(roas)+' < alvo '+fmtRoas(roasAlvo)+' — no prejuízo'; }
    r._verdict=v; r._reason=reason;
    r._breaches=alvoBreaches(r);
  });
  const foraAlvo=rows.filter(r=>r._breaches.length).length;

  const good=rows.filter(r=>r._verdict==='bom').sort((a,b)=>(b._roas||0)-(a._roas||0));
  const bad =rows.filter(r=>r._verdict==='ruim').sort((a,b)=>(b._spendBRL||0)-(a._spendBRL||0));
  const watch=rows.filter(r=>r._verdict==='observar').sort((a,b)=>(b._spendBRL||0)-(a._spendBRL||0));
  const gastoRuim=bad.reduce((s,r)=>s+(r._spendBRL||0),0);

  // agregações
  const aggBy=(keyFn)=>{
    const m={};
    rows.forEach(r=>{ const k=keyFn(r); if(k==null) return; if(!m[k]) m[k]={key:k,spend:0,receita:0,front:0,total:0,imp:0,clicks:0,ic:0,n:0}; const a=m[k]; a.spend+=r._spendBRL||0; a.receita+=r._receita||0; a.front+=r._vendasFront||0; a.total+=r._vendasTotal||0; a.imp+=r.impressions||0; a.clicks+=r.clicks||0; a.ic+=r.initiate_checkout||0; a.n++; });
    return Object.values(m).map(a=>({...a, roas:a.spend>0?a.receita/a.spend:null, cpa:a.front>0?a.spend/a.front:null, ctr:a.imp>0?a.clicks/a.imp*100:0, cpm:a.imp>0?a.spend/a.imp*1000:0, cpc:a.clicks>0?a.spend/a.clicks:0, cic:a.ic>0?a.spend/a.ic:0, ticket:a.front>0?a.receita/a.front:0})).sort((x,y)=>y.spend-x.spend);
  };
  const byConta=aggBy(tagCA);
  const byLance=aggBy(tagLance);
  const byOferta=aggBy(tagOferta);
  const byAccount=aggBy(r=>r._accountName||'(sem conta)');

  // fragmentação: grupos (conta+lance+oferta+estrutura) com >2 campanhas
  const fragMap={};
  rows.forEach(r=>{ const k=tagCA(r)+' | '+tagLance(r)+' | '+tagOferta(r)+' | '+tagEstrutura(r); if(!fragMap[k]) fragMap[k]={key:k,n:0,spend:0}; fragMap[k].n++; fragMap[k].spend+=r._spendBRL||0; });
  const frag=Object.values(fragMap).filter(g=>g.n>=3).sort((a,b)=>b.n-a.n);

  // ações recomendadas
  const actions=[];
  if(bad.length){ actions.push(`<b>Pausar ${bad.length} campanha(s) ruim(ns)</b>, liberando ${fmtMoney0(gastoRuim)} no período (${fmtMoney0(gastoRuim/days)}/dia) para realocar nas vencedoras.`); }
  if(good.length){ actions.push(`<b>Escalar as ${good.length} melhores</b> (subir orçamento 20% a 30% aos poucos): ${good.slice(0,4).map(r=>esc(shortName(r.name))).join('; ')}.`); }
  // comparação de dimensões: aponta vencedor claro por CPA
  const cmp=(arr,rot)=>{
    const val=arr.filter(a=>a.roas!=null && a.front>=3);
    if(val.length<2) return;
    val.sort((a,b)=>b.roas-a.roas);
    const best=val[0], worst=val[val.length-1];
    if(best.roas >= worst.roas*1.5 && worst.roas < roasAlvo){
      actions.push(`Em <b>${rot}</b>: <span class="winner">${esc(best.key)}</span> (ROAS ${fmtRoas(best.roas)}) dá muito mais lucro que <span class="loser">${esc(worst.key)}</span> (ROAS ${fmtRoas(worst.roas)}). Migrar verba para ${esc(best.key)}.`);
    }
  };
  cmp(byConta,'conta');
  cmp(byLance,'estratégia de lance');
  cmp(byOferta,'oferta/criativo');
  if(frag.length){ const g=frag[0]; actions.push(`<b>Desfragmentar:</b> há grupos com muitas campanhas quase idênticas competindo entre si (ex: "${esc(g.key)}" com ${g.n} campanhas, ${fmtMoney0(g.spend)}). CBO rende mais com menos campanhas e mais orçamento por campanha.`); }

  return {rows, T, blendedCPA, cpaAlvo, roasAlvo, minSpend, days, good, bad, watch, gastoRuim, byConta, byLance, byOferta, byAccount, frag, actions, off, funnelTotal, foraAlvo, pausadasCount, pausadasGasto};
}

  if(!S.connected){ root.innerHTML=renderConnect(); return; }

}

// ── Views da planilha (Sessão / Direct) — completo ──────────────────────────
let _sheetCharts={};
function _inWin(d,w){ return d && d>=w.since && d<=w.until; }
function mS(v){ return 'R$ '+(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
/**
 * Abas de sub-funil. Os funis que rodam hoje aparecem sempre, mesmo zerados,
 * para você ver que estão zerados. Os antigos (Carta, FLP, Nath no Direct) só
 * aparecem quando têm dado no período, para não poluir a barra nem sumir com o
 * histórico de julho.
 */
function _comDado(chaves,linhas,campo){
  const tem={}; (linhas||[]).forEach(r=>{ if(r[campo]) tem[r[campo]]=1; });
  return chaves.filter(k=>tem[k]);
}
function sheetTabs(){
  const s=currentFunnel().sheet, base=[['geral','Visão Geral']];
  if(s==='sessao'){
    const {inv,lds}=sheetScope();
    const legado=_comDado(FUNIS_SESSAO.filter(k=>!SE_ATUAIS.includes(k)),[...(inv||[]),...(lds||[])],'funnel');
    return base.concat(SE_ATUAIS.concat(legado).map(k=>[k,NOME_SE[k]]));
  }
  if(s==='roiclub') return base.concat(FUNIS_ROICLUB.map(k=>[k,NOME_RC[k]]));
  const {dir}=sheetScope();
  const extras=_comDado(['Nath','Outros'],dir,'expert');
  return base.concat(EXPERTS_ATUAIS.concat(extras).map(k=>[k,k]));
}
function setSheetTab(k){ S.sheetTab=k; S.sheetLevel='campanha'; S._sheetDrillCamp=null; S._sheetDrillAdset=null; saveState(); render(); }
function setSheetLevel(k){ S.sheetLevel=k; if(k==='campanha'){S._sheetDrillCamp=null;S._sheetDrillAdset=null;} if(k==='conjunto')S._sheetDrillAdset=null; render(); }
function sheetDrill(from,id,name){ if(from==='campanha'){S._sheetDrillCamp=id;S._sheetDrillCampName=name;S.sheetLevel='conjunto';} else if(from==='conjunto'){S._sheetDrillAdset=id;S._sheetDrillAdsetName=name;S.sheetLevel='anuncio';} render(); }
function sheetClearDrill(){ S._sheetDrillCamp=null;S._sheetDrillAdset=null;S.sheetLevel='campanha'; render(); }
function sheetUpTo(lvl){ if(lvl==='conjunto'){S._sheetDrillAdset=null;S.sheetLevel='conjunto';} render(); }
function sheetScope(){
  const w=sheetWindow(), sec=currentFunnel().sheet, t=S.sheetTab==='geral'?null:S.sheetTab;

  if(sec==='roiclub'){
    // Investimento do Meta; lead e oportunidade da aba "paginas", identificados
    // pelo slug. O pixel também conta lead, mas está muito abaixo do real
    // (4 contra 88 em agosto), então serve só de conferência, não de fonte.
    const src=(S._rcApi&&S._rcApi.rows)||[];
    const inv=src.filter(r=>_inWin(r.date,w)&&(!t||r.funnel===t));
    // Duas fontes de lead, uma por caminho:
    //   página de captura → aba "paginas" (slug roi-club-captura)
    //   Typeform          → aba "typeform_leads", alimentada pelo Apps Script
    const capt=(!t||t==='CAPTURA')
      ? ((S._sheet&&S._sheet.leads)||[]).filter(r=>r.iniciativa==='roiclub'&&_inWin(r.date,w))
      : [];
    const tfs=(!t||RC_EH_TYPEFORM(t)) ? tfLeads('roiclub', t||null, w) : [];
    return {w, inv, lds:capt.concat(tfs), metaLeads:inv.reduce((s,r)=>s+(r.metaLeads||0),0)};
  }

  if(sec==='sessao'){
    // Investimento vem do Meta (tempo real e já com o padrão novo de nome);
    // a planilha só entra se o Meta não tiver trazido nada, para não zerar a tela.
    const api=(S._sessaoApi&&S._sessaoApi.rows)||[];
    const invFonte=api.length?api:((S._sheet&&S._sheet.invest)||[]);
    const inv=invFonte.filter(r=>_inWin(r.date,w)&&(!t||r.funnel===t));
    // exclui o que é ROI CLUB: são leads de outra iniciativa e inflavam a Sessão.
    // O Plano de Negócio vive no Typeform, então entra pela ponte.
    const daPlanilha=((S._sheet&&S._sheet.leads)||[]).filter(r=>r.iniciativa!=='roiclub'&&_inWin(r.date,w)&&(!t||r.funnel===t));
    const lds=daPlanilha.concat(tfLeads('sessao', t||null, w));
    return {w, inv, lds, metaLeads:inv.reduce((s,r)=>s+(r.metaLeads||0),0), invDoMeta:api.length>0};
  }
  const fonteDir=(S._directApi&&S._directApi.rows)?S._directApi.rows:((S._sheet&&S._sheet.direct)||[]);
  return {w, dir:fonteDir.filter(r=>_inWin(r.date,w)&&(!t||r.expert===t))};
}
function sh_sum(a,k){ return a.reduce((s,r)=>s+(r[k]||0),0); }
function sh_aggS(inv,lds,idKey,nameKey){
  const m={},g=(k,n)=>m[k]||(m[k]={key:k,id:'',name:n||'(sem nome)',spend:0,impr:0,clicks:0,pv:0,leads:0,opp:0,funnel:''});
  inv.forEach(r=>{const id=r[idKey]||'';const k=id||('n:'+r[nameKey]);const x=g(k,r[nameKey]);if(id&&!x.id)x.id=id;if(!x.funnel)x.funnel=r.funnel;x.spend+=r.spend;x.impr+=r.impr;x.clicks+=r.clicks;x.pv+=r.pv;});
  lds.forEach(r=>{const id=r[idKey]||'';const k=id||('n:'+r[nameKey]);const x=g(k,r[nameKey]);if(id&&!x.id)x.id=id;if(!x.funnel)x.funnel=r.funnel;x.leads++;if(r.opp)x.opp++;});
  return Object.values(m).map(x=>({...x,cpo:x.opp?x.spend/x.opp:null,cpl:x.leads?x.spend/x.leads:null,ctr:x.impr?x.clicks/x.impr*100:0,cpc:x.clicks?x.spend/x.clicks:0}));
}
function sh_aggD(dir,idKey,nameKey){
  const m={},g=(k,n)=>m[k]||(m[k]={key:k,id:'',name:n||'(sem nome)',spend:0,impr:0,clicks:0,conv:0,expert:''});
  dir.forEach(r=>{const id=r[idKey]||'';const k=id||('n:'+r[nameKey]);const x=g(k,r[nameKey]);if(id&&!x.id)x.id=id;if(!x.expert)x.expert=r.expert;x.spend+=r.spend;x.impr+=r.impr;x.clicks+=r.clicks;x.conv+=r.conv;});
  return Object.values(m).map(x=>({...x,cc:x.conv?x.spend/x.conv:null,ctr:x.impr?x.clicks/x.impr*100:0,cpc:x.clicks?x.spend/x.clicks:0}));
}
const SHEET_META={
  sessao:  {sub:'funil de lead · Oportunidade & CPO', botao:"reloadSheet();reloadFunilApi('SESSAO');S._tfLeads=null;fetchTypeformLeads()"},
  direct:  {sub:'funil de mensagem · Conversas & Custo · API do Meta (tempo real)', botao:'reloadDirectApi()'},
  roiclub: {sub:'funil de lead · gasto no Meta, lead na planilha e no Typeform', botao:"reloadFunilApi('ROICLUB');S._tfLeads=null;fetchTypeformLeads()"}
};
function renderSheetView(){
  const f=currentFunnel(), sec=f.sheet, meta=SHEET_META[sec]||SHEET_META.sessao;
  // A sub-aba fica salva no localStorage. Se a nomenclatura mudou (a chave 'LP'
  // virou 'PLANO', por exemplo), a chave velha filtraria tudo e a tela ficaria
  // vazia sem explicação. Volta para Visão Geral quando a aba não existe mais.
  const abas=sheetTabs();
  if(!abas.some(([k])=>k===S.sheetTab)) S.sheetTab='geral';
  const maxDate = sec==='direct'  ? (S._directApi&&S._directApi.maxDate)
                : sec==='roiclub' ? (S._rcApi&&S._rcApi.maxDate)
                : (S._sheet&&S._sheet.maxDate);
  const head=`<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start">
    <div><h2 style="margin:0">${f.emoji} ${esc(f.label)} <span class="mini" style="text-transform:none;font-weight:400">${meta.sub}</span></h2>
    ${maxDate?`<div class="mini" style="margin-top:4px">Dados até <b>${esc(maxDate)}</b> · período: ${(()=>{const w=sheetWindow();return w.since===w.until?w.since:w.since+' a '+w.until;})()}</div>`:''}</div>
    <button class="btn btn-gray btn-sm" style="padding:4px 10px" onclick="${meta.botao}">↻ Atualizar</button></div>
    <div class="row" style="margin-top:10px;gap:6px">${abas.map(([k,l])=>`<button class="subtab ${S.sheetTab===k?'on':''}" onclick="setSheetTab('${k}')">${l}</button>`).join('')}</div>`;

  if(sec==='direct'){
    // Direct vem da API do Meta (tempo real). A planilha ficava horas atrasada.
    if(S._directApi&&!S._directLoading&&!_mesmaJanela(S._directApi.janela,janelaMeta())){ S._directApi=null; }
    if(S._directApi==null&&!S._directLoading) setTimeout(()=>fetchDirectApi(),30);
    if(S._directLoading||S._directApi==null) return head+`<div class="empty" style="margin-top:12px"><span class="loading"></span> Buscando conversas no Meta…</div></div>`;
    return head+`</div>`+renderDirectFull();
  }

  if(sec==='roiclub'){
    // Precisa das duas fontes: gasto no Meta, lead e oportunidade na planilha.
    garantirJanela('ROICLUB');
    if(S._rcApi==null&&!S._rcLoading) setTimeout(()=>fetchFunilApi('ROICLUB'),30);
    if(S._sheet==null&&!S._sheetLoading) setTimeout(()=>fetchSheetData(),30);
    if(S._tfLeads==null&&!S._tfLoading) setTimeout(()=>fetchTypeformLeads(),30);
    if(S._rcLoading||S._rcApi==null) return head+`<div class="empty" style="margin-top:12px"><span class="loading"></span> Buscando ROI CLUB no Meta…</div></div>`;
    if(S._tfLoading) return head+`<div class="empty" style="margin-top:12px"><span class="loading"></span> Lendo leads do Typeform…</div></div>`;
    if(S._sheetLoading||S._sheet==null) return head+`<div class="empty" style="margin-top:12px"><span class="loading"></span> Carregando leads da planilha…</div></div>`;
    return head+`</div>`+renderRoiClubFull();
  }

  // Sessão: leads da planilha, investimento do Meta. Espera as duas fontes.
  garantirJanela('SESSAO');
  if(S._sessaoApi==null&&!S._sessaoLoading) setTimeout(()=>fetchFunilApi('SESSAO'),30);
  if(S._tfLeads==null&&!S._tfLoading) setTimeout(()=>fetchTypeformLeads(),30);
  if(S._sheetLoading||S._sheet==null){ if(S._sheet==null&&!S._sheetLoading) setTimeout(()=>fetchSheetData(),30); return head+`<div class="empty" style="margin-top:12px"><span class="loading"></span> Carregando planilha…</div></div>`; }
  if(S._sheet.error){ return head+`<div class="empty" style="margin-top:12px">Erro ao carregar a planilha: ${esc(S._sheet.error)}</div></div>`; }
  if(S._sessaoLoading||S._sessaoApi==null) return head+`<div class="empty" style="margin-top:12px"><span class="loading"></span> Buscando investimento no Meta…</div></div>`;
  return head+`</div>`+renderSessaoFull();
}

/**
 * ROI CLUB.
 *   Investimento, pageview e impressão .... API do Meta
 *   Lead e oportunidade ................... aba "paginas", pelo slug_pagina
 *
 * O pixel também conta lead, mas conta muito menos que o real: em agosto marcou
 * 4 enquanto a planilha registrou 88. Por isso ele fica como conferência, não
 * como fonte. Oportunidade só existe porque a planilha traz a resposta de verba.
 */
/** Leads do caminho Typeform no período. Só o pixel os enxerga. */
function _rcLeadsTypeform(){
  const w=sheetWindow();
  return ((S._rcApi&&S._rcApi.rows)||[])
    .filter(r=>RC_EH_TYPEFORM(r.funnel)&&_inWin(r.date,w))
    .reduce((s,r)=>s+(r.metaLeads||0),0);
}

function renderRoiClubFull(){
  const {inv,lds,metaLeads}=sheetScope();
  const aba=S.sheetTab==='geral'?null:S.sheetTab;
  const w=sheetWindow();
  const spend=sh_sum(inv,'spend'),impr=sh_sum(inv,'impr'),clicks=sh_sum(inv,'clicks'),pv=sh_sum(inv,'pv');

  // Com a ponte do Typeform funcionando, todo caminho tem lead identificado e
  // resposta de verba, então todos têm oportunidade e CPO. Sem ela, o Typeform
  // cai para o contador do pixel, que subconta muito, e fica sem CPO.
  const ponte = !!(S._tfLeads && !S._tfLeads.erro && (S._tfLeads.rows||[]).length);
  const soTypeform = RC_EH_TYPEFORM(aba);
  const leads = ponte ? lds.length
                      : (soTypeform ? metaLeads : lds.length + (aba?0:_rcLeadsTypeform()));
  const opp   = lds.filter(r=>r.opp).length;
  const temOpp = ponte || !soTypeform;
  const cpl=leads?spend/leads:0, cpo=opp?spend/opp:0, ctr=impr?clicks/impr*100:0, cpc=clicks?spend/clicks:0;
  const fonteLead = ponte ? (soTypeform?'Typeform, pela ponte':(aba?'planilha, pelo slug':'planilha + Typeform'))
                          : (soTypeform?'pixel do Meta':(aba?'planilha, pelo slug':'planilha + pixel'));
  const kpi=(l,v,s,g)=>`<div class="kpi ${g?'good':''}"><div class="k-l">${l}</div><div class="k-v">${v}</div><div class="k-s">${s||'&nbsp;'}</div></div>`;

  const kpis=`<div class="card"><div class="kpis">
    ${kpi('Investimento',mS(spend),'gasto em mídia')}
    ${kpi('Leads',fmtNum(leads),fonteLead)}
    ${kpi('CPL',leads?mS(cpl):'—','custo por lead')}
    ${kpi('Oportunidades',temOpp?fmtNum(opp):'—',temOpp&&leads?(100*opp/leads).toFixed(0)+'% dos leads':'ponte do Typeform desligada',temOpp&&opp>0)}
    ${kpi('CPO',temOpp&&opp?mS(cpo):'—','custo por oport.')}
    ${kpi('Pageviews',fmtNum(pv),'')}
    ${kpi('Tx. conv LP',pv&&leads?(leads/pv*100).toFixed(1)+'%':'—','lead / pageview')}
    ${kpi('CTR',ctr.toFixed(2)+'%','')}${kpi('CPC',mS(cpc),'')}${kpi('Impressões',fmtNum(impr),'')}
  </div></div>`;

  // Aviso quando a ponte não respondeu: sem ele, o Typeform apareceria com o
  // número do pixel e passaria por real.
  const semPonte = ponte?'':`<div class="card" style="border-left:4px solid #b08900">
    <h3 style="margin:0 0 6px">⚠️ Ponte do Typeform sem dados</h3>
    <div style="font-size:13px;line-height:1.6">A aba <code>${TF_ABA}</code> não respondeu ou está vazia${S._tfLeads&&S._tfLeads.erro?` (<code>${esc(S._tfLeads.erro)}</code>)`:''}.
    Os caminhos de Typeform estão mostrando o que o pixel viu, que costuma ser uma fração do real, e ficam sem oportunidade.
    <div class="mini" style="margin-top:6px">Rode <code>sincronizarTypeform</code> no Apps Script e confira se a planilha
    está compartilhada como "qualquer pessoa com o link · leitor".</div></div></div>`;

  // Tabela comparativa: sempre mostra os três caminhos, independente da aba.
  const porSub={};FUNIS_ROICLUB.forEach(k=>porSub[k]={k,spend:0,impr:0,clicks:0,pv:0,pixel:0,plan:0,opp:0});
  ((S._rcApi&&S._rcApi.rows)||[]).filter(r=>_inWin(r.date,w)).forEach(r=>{
    const g=porSub[r.funnel]; if(!g) return;
    g.spend+=r.spend; g.impr+=r.impr; g.clicks+=r.clicks; g.pv+=r.pv; g.pixel+=(r.metaLeads||0);
  });
  const todosLeads=((S._sheet&&S._sheet.leads)||[])
      .filter(r=>r.iniciativa==='roiclub'&&_inWin(r.date,w))
      .map(r=>({opp:r.opp,funnel:'CAPTURA'}))
    .concat(tfLeads('roiclub',null,w).map(r=>({opp:r.opp,funnel:r.funnel})));
  todosLeads.forEach(r=>{ const g=porSub[r.funnel]; if(!g) return; g.plan++; if(r.opp) g.opp++; });

  const linhaSub=g=>{
    const temFonte=g.plan>0;                      // fonte que identifica o lead
    const n=temFonte?g.plan:g.pixel;
    const fonte=temFonte?(g.k==='CAPTURA'?'planilha':'Typeform'):(g.pixel?'pixel':'—');
    return `<tr><td style="font-weight:600">${NOME_RC[g.k]}</td><td class="num">${mS(g.spend)}</td>
    <td class="num">${fmtNum(g.impr)}</td><td class="num">${fmtNum(g.clicks)}</td>
    <td class="num">${g.impr?(g.clicks/g.impr*100).toFixed(2)+'%':'—'}</td><td class="num">${fmtNum(g.pv)}</td>
    <td class="num" style="font-weight:700">${n?fmtNum(n):'—'}</td>
    <td class="num">${n?mS(g.spend/n):'—'}</td>
    <td class="num" style="font-weight:700">${temFonte?fmtNum(g.opp):'—'}</td>
    <td class="num" style="color:#137333;font-weight:700">${temFonte&&g.opp?mS(g.spend/g.opp):'—'}</td>
    <td class="mini" style="${fonte==='pixel'?'color:#b08900':''}">${fonte}</td></tr>`;
  };
  const tblSub=`<div class="card"><h3 style="margin:0 0 8px">Por caminho</h3><div style="overflow-x:auto">
    <table class="dim-tbl" style="font-size:12px"><thead><tr><th style="text-align:left">Caminho</th><th class="num">Invest.</th><th class="num">Impr.</th><th class="num">Cliques</th><th class="num">CTR</th><th class="num">Pageviews</th><th class="num">Leads</th><th class="num">CPL</th><th class="num">Oport.</th><th class="num">CPO</th><th>Fonte</th></tr></thead>
    <tbody>${FUNIS_ROICLUB.map(k=>linhaSub(porSub[k])).join('')}</tbody></table></div>
    <div class="mini" style="margin-top:6px">Lead e oportunidade vêm da fonte que identifica a pessoa:
    a aba <code>paginas</code> para a página de captura, a aba <code>${TF_ABA}</code> para os dois Typeform.
    Onde aparecer <b>pixel</b> na coluna Fonte, o número é o do evento do Meta, que subconta.</div></div>`;

  // O pixel subcontando é um problema de mensuração que vale avisar: quem otimiza
  // campanha por evento de lead está entregando o algoritmo com sinal errado.
  let divergencia='';
  const cap=porSub.CAPTURA;
  if(cap.plan>0 && cap.pixel < cap.plan*0.5){
    divergencia=`<div class="card" style="border-left:4px solid #b08900">
      <h3 style="margin:0 0 6px">⚠️ O pixel está vendo muito menos lead que a planilha</h3>
      <div style="font-size:13px;line-height:1.6">A planilha registrou <b>${fmtNum(cap.plan)}</b> leads na página de captura
      e o pixel marcou <b>${fmtNum(cap.pixel)}</b>. Os números da tela usam a planilha, então estão certos.
      O problema é do outro lado: <b>o Meta está otimizando a entrega com um sinal quase mudo</b>, porque só enxerga
      ${cap.plan?(cap.pixel/cap.plan*100).toFixed(0):0}% das conversões. Enquanto isso não for corrigido, a campanha
      aprende devagar e o custo por lead tende a ficar acima do que poderia.</div></div>`;
  }

  // Alerta só para a página de captura, que é a que a planilha mede. No Typeform
  // não dá para saber a conversão real, então alarmar ali seria ruído.
  let alerta='';
  if(cap && cap.spend>0 && cap.plan===0){
    alerta=`<div class="card" style="border-left:4px solid #c5221f">
      <h3 style="margin:0 0 6px">🚨 Gasto sem captura na página</h3>
      <div style="font-size:13px;line-height:1.6">
        <b>${mS(cap.spend)}</b> investidos na página de captura e <b>zero</b> leads${cap.pv?`, mesmo com <b>${fmtNum(cap.pv)}</b> pageviews`:''}.
        Destino: <code>roieducacao.com.br/roi-club-captura/</code>. Com visita entrando e lead não saindo, o problema está na captura, não na mídia.
        <div class="mini" style="margin-top:8px">Conferir, nesta ordem: 1) o formulário da LP está enviando; 2) o pixel dispara o evento de Lead na conversão;
        3) as UTMs estão sendo repassadas para dar para atribuir por campanha.</div>
      </div></div>`;
  } else if(cap && cap.pv>0 && cap.plan>0 && (cap.plan/cap.pv)<0.15){
    alerta=`<div class="card" style="border-left:4px solid #b08900">
      <h3 style="margin:0 0 6px">⚠️ Conversão da página muito baixa</h3>
      <div style="font-size:13px;line-height:1.6">A página de captura converteu <b>${(cap.plan/cap.pv*100).toFixed(1)}%</b>
      dos pageviews em lead (${fmtNum(cap.plan)} de ${fmtNum(cap.pv)}). Página de captura simples costuma ficar acima de 20%.
      Com <b>${mS(cap.spend)}</b> investidos, cada ponto percentual aqui vale mais do que qualquer ajuste de mídia.</div></div>`;
  }

  const camps=sh_aggS(inv,[],'campaign_id','campaign').sort((a,b)=>b.spend-a.spend);
  const linha=c=>`<tr><td style="font-weight:600">${esc(c.name)}</td><td class="num">${mS(c.spend)}</td><td class="num">${fmtNum(c.impr)}</td><td class="num">${fmtNum(c.clicks)}</td><td class="num">${c.impr?(c.clicks/c.impr*100).toFixed(2)+'%':'—'}</td><td class="num">${fmtNum(c.pv)}</td></tr>`;
  const tbl=camps.length?`<div class="card"><h3 style="margin:0 0 8px">Campanhas</h3><div style="overflow-x:auto">
    <table class="dim-tbl" style="font-size:12px"><thead><tr><th style="text-align:left">Campanha</th><th class="num">Invest.</th><th class="num">Impr.</th><th class="num">Cliques</th><th class="num">CTR</th><th class="num">Pageviews</th></tr></thead>
    <tbody>${camps.map(linha).join('')}</tbody></table></div></div>`
    : `<div class="card"><div class="empty">Nenhuma campanha de ROI CLUB com gasto no período.</div></div>`;

  const nota=`<div class="card"><h3 style="margin:0 0 6px">De onde vem cada número</h3>
    <div style="font-size:13px;line-height:1.6">
      <b>Investimento, pageviews, impressões e cliques</b> vêm da API do Meta, em tempo real.<br>
      <b>Leads e oportunidades</b> vêm da aba <code>paginas</code> da planilha, identificados pelo <code>slug_pagina</code>
      igual a <code>roi-club-captura</code>. É a única fonte que sabe o que a pessoa respondeu.<br>
      <b>Oportunidade</b> segue a mesma régua da Sessão: respondeu quanto planeja investir e não marcou
      "não tenho nada disponível" nem "até R$ 3.000".
      <div class="mini" style="margin-top:8px">Atribuir lead por campanha ainda não é confiável: a maior parte dos leads
      chega sem <code>utm_campaing</code> preenchida, então os totais estão certos mas a quebra por campanha não.</div>
    </div></div>`;

  return kpis+semPonte+alerta+divergencia+tblSub+tbl+nota;
}

// ── Diagnóstico de funil + ideias (Sessão e Direct) ─────────────────────────
const _pctS=(x,d=1)=>(x==null||!isFinite(x))?'—':x.toFixed(d)+'%';
function _etapaHtml(nome, valor, mediana, dica){
  const r = (mediana>0)? valor/mediana : 1;
  const cor = r>=1.15?'#137333' : (r<=0.85?'#c5221f':'#666');
  const sinal = r>=1.15?'acima' : (r<=0.85?'abaixo':'na média');
  return {nome, valor, mediana, r, cor, sinal, dica,
    html:`<tr><td style="text-align:left;font-weight:600">${nome}</td>
      <td class="num" style="color:${cor};font-weight:700">${_pctS(valor,2)}</td>
      <td class="num">${_pctS(mediana,2)}</td>
      <td class="mini" style="color:${cor}">${sinal}</td></tr>`};
}
// Sessão: impressão → clique → pageview → lead → oportunidade
function sessaoDiagnostico(inv, lds){
  const porFunil={};
  FUNIS_SESSAO.forEach(f=>porFunil[f]={f,imp:0,clicks:0,pv:0,leads:0,opp:0,spend:0});
  inv.forEach(r=>{const g=porFunil[r.funnel]||porFunil.NATIVO;g.imp+=r.impr;g.clicks+=r.clicks;g.pv+=r.pv;g.spend+=r.spend;});
  lds.forEach(r=>{const g=porFunil[r.funnel]||porFunil.NATIVO;g.leads++;if(r.opp)g.opp++;});
  const ativos=Object.values(porFunil).filter(g=>g.imp>0||g.leads>0);
  if(!ativos.length) return '';

  const T=ativos.reduce((a,g)=>({imp:a.imp+g.imp,clicks:a.clicks+g.clicks,pv:a.pv+g.pv,leads:a.leads+g.leads,opp:a.opp+g.opp,spend:a.spend+g.spend}),{imp:0,clicks:0,pv:0,leads:0,opp:0,spend:0});
  const med=(arr)=>{const a=arr.filter(x=>x>0&&isFinite(x)).sort((x,y)=>x-y);return a.length?a[Math.floor(a.length/2)]:0;};
  const ctrs=ativos.map(g=>g.imp?g.clicks/g.imp*100:0);
  const lps =ativos.filter(g=>g.f!=='NATIVO').map(g=>g.pv?g.leads/g.pv*100:0);
  const mqls=ativos.map(g=>g.leads?g.opp/g.leads*100:0);

  // As etapas de LP só existem em Carta/FLP — o Nativo é formulário dentro do Meta
  // e tem pageview zerado. Misturar as duas bases dá número sem sentido, então
  // essas duas etapas somam apenas os funis que realmente têm pageview.
  const comLP=ativos.filter(g=>g.pv>0);
  const L=comLP.reduce((a,g)=>({clicks:a.clicks+g.clicks,pv:a.pv+g.pv,leads:a.leads+g.leads}),{clicks:0,pv:0,leads:0});

  const et=[];
  et.push(_etapaHtml('Impressão → clique (CTR)', T.imp?T.clicks/T.imp*100:0, med(ctrs), 'criativo não está chamando atenção — testar novos ganchos'));
  if(L.pv>0){
    et.push(_etapaHtml('Clique → pageview', L.clicks?L.pv/L.clicks*100:0, 90, 'gente clica mas não carrega a página — velocidade/link da LP'));
    et.push(_etapaHtml('Pageview → lead (conv LP)', L.pv?L.leads/L.pv*100:0, med(lps), 'a página não converte — headline, formulário ou promessa desalinhada'));
  }
  et.push(_etapaHtml('Lead → oportunidade (MQL)', T.leads?T.opp/T.leads*100:0, med(mqls), 'lead entra mas sem caixa — o criativo/público está atraindo perfil errado'));

  const pior=et.slice().sort((a,b)=>a.r-b.r)[0];
  const gargalo = pior && pior.r<0.85

// Ideias de teste — Sessão
function sessaoIdeias(inv, lds){
  const I=[];
  const agg=(keyFn)=>{const m={};
    inv.forEach(r=>{const k=keyFn(r);if(!k)return;(m[k]=m[k]||{k,spend:0,leads:0,opp:0,imp:0,clicks:0}).spend+=r.spend;m[k].imp+=r.impr;m[k].clicks+=r.clicks;});
    lds.forEach(r=>{const k=keyFn(r);if(!k)return;const g=(m[k]=m[k]||{k,spend:0,leads:0,opp:0,imp:0,clicks:0});g.leads++;if(r.opp)g.opp++;});
    return Object.values(m).map(g=>({...g,cpo:g.opp?g.spend/g.opp:null,cpl:g.leads?g.spend/g.leads:null,mql:g.leads?g.opp/g.leads*100:0}));};

  const funis=agg(r=>r.funnel).filter(g=>g.spend>=200);
  const comOpp=funis.filter(g=>g.opp>=2);
  if(comOpp.length>=2){
    const o=comOpp.slice().sort((a,b)=>a.cpo-b.cpo), best=o[0], worst=o[o.length-1];
    const nm=NOME_SE;
    I.push(`<b>Migre verba do funil mais caro para o mais barato.</b> <b>${nm[best.k]||best.k}</b> entrega oportunidade a ${fmtMoney0(best.cpo)} contra ${fmtMoney0(worst.cpo)} do <b>${nm[worst.k]||worst.k}</b> — ${((worst.cpo/best.cpo-1)*100).toFixed(0)}% mais caro. Só o ${nm[worst.k]||worst.k} está levando ${fmtMoney0(worst.spend)}.`);
  }
  const pubs=agg(r=>r.adset).filter(g=>g.spend>=200&&g.opp>=1).sort((a,b)=>a.cpo-b.cpo);
  if(pubs.length>=2){
    const b=pubs[0], w=pubs[pubs.length-1];
    if(w.cpo>b.cpo*1.5) I.push(`<b>O público muda mais o CPO que o criativo.</b> <b>${esc(b.k)}</b> traz oportunidade a ${fmtMoney0(b.cpo)}, enquanto <b>${esc(w.k)}</b> custa ${fmtMoney0(w.cpo)}. Concentre no primeiro e teste variações dele (lookalike, faixa etária) antes de criar criativo novo.`);
  }
  const ads=agg(r=>r.ad).filter(g=>g.spend>=200);
  const adsOpp=ads.filter(g=>g.opp>=1).sort((a,b)=>a.cpo-b.cpo);
  if(adsOpp.length){ const b=adsOpp[0];
    I.push(`<b>Clone o anúncio vencedor.</b> <b>${esc(b.k)}</b> tem o melhor CPO (${fmtMoney0(b.cpo)}, ${b.opp} oport.). Produza 3 variações trocando um elemento por vez (gancho / prova / CTA) para descobrir o que sustenta o resultado.`);
  }
  const semOpp=ads.filter(g=>g.opp===0&&g.spend>=300).sort((a,b)=>b.spend-a.spend).slice(0,2);
  if(semOpp.length) I.push(`<b>Corte o que gasta sem qualificar.</b> ${semOpp.map(g=>`<b>${esc(g.k)}</b> (${fmtMoney0(g.spend)}, ${g.leads} leads, 0 oport.)`).join(' e ')}. Gera lead mas nenhum com caixa — ou o criativo promete fácil demais, ou o público é errado.`);
  const baixoMql=ads.filter(g=>g.leads>=10).sort((a,b)=>a.mql-b.mql)[0];
  const altoMql=ads.filter(g=>g.leads>=10).sort((a,b)=>b.mql-a.mql)[0];
  if(baixoMql&&altoMql&&altoMql.mql>baixoMql.mql*1.8)
    I.push(`<b>Copie a qualificação do melhor anúncio.</b> <b>${esc(altoMql.k)}</b> converte ${_pctS(altoMql.mql,0)} dos leads em oportunidade, contra ${_pctS(baixoMql.mql,0)} de <b>${esc(baixoMql.k)}</b>. Veja o que o primeiro diz sobre investimento/perfil e leve para o segundo.`);

  if(!I.length) return '';
  return `<div class="card"><h3 style="margin:0 0 10px">🧪 Ideias de teste <span class="mini" style="text-transform:none;font-weight:400">geradas dos seus próprios dados no período</span></h3>${I.map(x=>`<div class="act">${x}</div>`).join('')}</div>`;
}
// Direct: impressão → clique → conversa
function directDiagnostico(dir){
  const T=dir.reduce((a,r)=>({imp:a.imp+r.impr,clicks:a.clicks+r.clicks,conv:a.conv+r.conv,spend:a.spend+r.spend}),{imp:0,clicks:0,conv:0,spend:0});
  if(!T.imp) return '';
  const porExp={}; dir.forEach(r=>{const g=(porExp[r.expert]=porExp[r.expert]||{imp:0,clicks:0,conv:0});g.imp+=r.impr;g.clicks+=r.clicks;g.conv+=r.conv;});
  const med=(arr)=>{const a=arr.filter(x=>x>0&&isFinite(x)).sort((x,y)=>x-y);return a.length?a[Math.floor(a.length/2)]:0;};
  const ctrs=Object.values(porExp).map(g=>g.imp?g.clicks/g.imp*100:0);
  const cvs =Object.values(porExp).map(g=>g.clicks?g.conv/g.clicks*100:0);
  const et=[
    _etapaHtml('Impressão → clique (CTR)', T.imp?T.clicks/T.imp*100:0, med(ctrs), 'criativo não para o dedo — testar novos ganchos'),
    _etapaHtml('Clique → conversa', T.clicks?T.conv/T.clicks*100:0, med(cvs), 'clica mas não puxa assunto — a primeira mensagem automática não engaja')
  ];
  const pior=et.slice().sort((a,b)=>a.r-b.r)[0];
  const gargalo = pior && pior.r<0.85
    ? `<div class="ins-row" style="border-color:#f3c2c0"><span class="rk-tag rk-cut">Gargalo</span> <b>${esc(pior.nome)}</b>: ${_pctS(pior.valor,2)} contra mediana ${_pctS(pior.mediana,2)} — ${pior.dica}.</div>`
    : `<div class="ins-row" style="border-color:#cfeed6"><span class="rk-tag rk-esc">Sem gargalo claro</span> As etapas estão equilibradas entre os experts.</div>`;
  return `<div class="card"><h3 style="margin:0 0 8px">🔎 Diagnóstico do funil <span class="mini" style="text-transform:none;font-weight:400">impressão → clique → conversa</span></h3>
    <div class="mini" style="margin-bottom:8px">${fmtNum(T.imp)} impressões → ${fmtNum(T.clicks)} cliques → <b>${fmtNum(T.conv)} conversas</b></div>
    ${gargalo}
    <div style="overflow-x:auto;margin-top:8px"><table class="dim-tbl" style="font-size:12px"><thead><tr>
      <th style="text-align:left">Etapa</th><th class="num">Atual</th><th class="num">Mediana entre experts</th><th>Situação</th>
    </tr></thead><tbody>${et.map(x=>x.html).join('')}</tbody></table></div>
  </div>`;
}
function directIdeias(dir){
  const I=[];
  const agg=(keyFn)=>{const m={};dir.forEach(r=>{const k=keyFn(r);if(!k)return;const g=(m[k]=m[k]||{k,spend:0,conv:0,imp:0,clicks:0});g.spend+=r.spend;g.conv+=r.conv;g.imp+=r.impr;g.clicks+=r.clicks;});
    return Object.values(m).map(g=>({...g,cc:g.conv?g.spend/g.conv:null,ctr:g.imp?g.clicks/g.imp*100:0}));};
  const exp=agg(r=>r.expert).filter(g=>g.spend>=200&&g.conv>=3).sort((a,b)=>a.cc-b.cc);
  if(exp.length>=2){const b=exp[0],w=exp[exp.length-1];
    if(w.cc>b.cc*1.3) I.push(`<b>Realoque entre experts.</b> <b>${esc(b.k)}</b> traz conversa a ${fmtMoney(b.cc)} contra ${fmtMoney(w.cc)} de <b>${esc(w.k)}</b>. Mesmo produto, custo ${((w.cc/b.cc-1)*100).toFixed(0)}% maior — vale migrar verba e investigar o que muda na comunicação do primeiro.`);}
  const ads=agg(r=>r.ad).filter(g=>g.spend>=200);
  const bons=ads.filter(g=>g.conv>=3).sort((a,b)=>a.cc-b.cc);
  if(bons.length) I.push(`<b>Clone o anúncio mais barato em conversa.</b> <b>${esc(bons[0].k)}</b> a ${fmtMoney(bons[0].cc)} por conversa (${bons[0].conv} conversas). Faça variações trocando só a abertura da mensagem.`);
  const caros=ads.filter(g=>g.conv===0&&g.spend>=300).sort((a,b)=>b.spend-a.spend).slice(0,2);
  if(caros.length) I.push(`<b>Corte o que não gera conversa.</b> ${caros.map(g=>`<b>${esc(g.k)}</b> (${fmtMoney0(g.spend)}, 0 conversas)`).join(' e ')}.`);
  const pubs=agg(r=>r.adset).filter(g=>g.spend>=200&&g.conv>=2).sort((a,b)=>a.cc-b.cc);
  if(pubs.length>=2){const b=pubs[0],w=pubs[pubs.length-1];
    if(w.cc>b.cc*1.5) I.push(`<b>O público está pesando mais que o criativo.</b> <b>${esc(b.k)}</b> a ${fmtMoney(b.cc)}/conversa contra ${fmtMoney(w.cc)} de <b>${esc(w.k)}</b>. Concentre no primeiro antes de produzir criativo novo.`);}
  if(!I.length) return '';
  return `<div class="card"><h3 style="margin:0 0 10px">🧪 Ideias de teste <span class="mini" style="text-transform:none;font-weight:400">geradas dos seus próprios dados no período</span></h3>${I.map(x=>`<div class="act">${x}</div>`).join('')}</div>`;
}

    <div class="card" style="flex:1;min-width:220px"><h3 style="margin:0 0 8px">Oportunidades por funil</h3><div style="height:260px"><canvas id="shDonut"></canvas></div></div></div>`;

  const fontes=`<div class="card"><h3 style="margin:0 0 6px">Onde mora o lead de cada funil</h3>
    <div style="font-size:13px;line-height:1.7">

      <b>Tomé + Nath</b>: inativo.
      <div class="mini" style="margin-top:8px">Investimento, pageviews e cliques vêm sempre da API do Meta, com a data já
      convertida para o horário de Brasília.</div>
    </div></div>`;

  const ins=sheetInsightsSessao(inv,lds,spend,opp,leads,cpo,cpl);
  const pubs=sh_rankName(inv,lds,'adset'),ads=sh_rankName(inv,lds,'ad');

  return kpis+alerta+charts+tblF+sessaoDiagnostico(inv,lds)+ins+sessaoIdeias(inv,lds)+ranks+fontes+sheetDetailCard();
}
function sheetInsightsSessao(inv,lds,spend,opp,leads,cpo,cpl){
  const rows=[`<div class="ins-row"><span class="rk-tag rk-res">Resumo</span> Investimento de <b>${mS(spend)}</b> gerou <b>${fmtNum(opp)}</b> oportunidades${opp?` · CPO médio <b>${mS(cpo)}</b>`:''} · ${fmtNum(leads)} leads (CPL ${mS(cpl)}).</div>`];
  const bf={};FUNIS_SESSAO.forEach(f=>bf[f]={f,spend:0,opp:0});
  inv.forEach(r=>{(bf[r.funnel]||bf.NATIVO).spend+=r.spend;});
  lds.forEach(r=>{if(r.opp)(bf[r.funnel]||bf.NATIVO).opp++;});
  const fv=Object.values(bf).filter(x=>x.opp>=1&&x.spend>0).map(x=>({...x,cpo:x.spend/x.opp}));
  const nm={NATIVO:'Nativo',CARTA:'Carta/Consultoria',FLP:'FLP (VSL)'};
  if(fv.length){const best=fv.slice().sort((a,b)=>a.cpo-b.cpo)[0],worst=fv.slice().sort((a,b)=>b.cpo-a.cpo)[0];
    rows.push(`<div class="ins-row"><span class="rk-tag rk-res">Insight</span> Funil mais eficiente: <b>${nm[best.f]}</b> — CPO ${mS(best.cpo)} com ${best.opp} oport.</div>`);
    if(worst.f!==best.f)rows.push(`<div class="ins-row"><span class="rk-tag rk-res">Insight</span> Funil mais caro: <b>${nm[worst.f]}</b> — CPO ${mS(worst.cpo)}.</div>`);}
  const camps=sh_aggS(inv,lds,'campaign_id','campaign').filter(c=>c.spend>=20),wo=camps.filter(c=>c.opp>=1);
  wo.filter(c=>c.opp>=2&&c.cpo<cpo).sort((a,b)=>a.cpo-b.cpo).slice(0,3).forEach(c=>rows.push(`<div class="ins-row"><span class="rk-tag rk-esc">Escalar</span> <b>${esc(c.name)}</b> — CPO ${mS(c.cpo)} (${mS(cpo-c.cpo)} abaixo da média), ${c.opp} oport. (${mS(c.spend)}).</div>`));
  wo.filter(c=>c.cpo>cpo*2).sort((a,b)=>b.cpo-a.cpo).slice(0,2).forEach(c=>rows.push(`<div class="ins-row"><span class="rk-tag rk-at">Atenção</span> <b>${esc(c.name)}</b> — CPO ${mS(c.cpo)} (${(c.cpo/cpo).toFixed(1)}x a média).</div>`));
  camps.filter(c=>c.opp===0&&c.spend>=100).sort((a,b)=>b.spend-a.spend).slice(0,3).forEach(c=>rows.push(`<div class="ins-row"><span class="rk-tag rk-cut">Cortar</span> <b>${esc(c.name)}</b> gastou ${mS(c.spend)} sem gerar oportunidade (${c.leads} leads).</div>`));
  return `<div class="card"><h3 style="margin:0 0 8px">🧠 Análise & Insights · Growth</h3>${rows.join('')}</div>`;
}
function sh_rankName(inv,lds,dim){
  const m={},g=n=>m[n]||(m[n]={name:n,spend:0,leads:0,opp:0});
  inv.forEach(r=>{g(r[dim]||'(sem nome)').spend+=r.spend;});
  lds.forEach(r=>{const x=g(r[dim]||'(sem nome)');x.leads++;if(r.opp)x.opp++;});
  return Object.values(m).filter(x=>x.opp>=1&&x.spend>=20).map(x=>({...x,cpo:x.spend/x.opp,cpl:x.leads?x.spend/x.leads:0})).sort((a,b)=>a.cpo-b.cpo).slice(0,7);

  const T=A.T;

  return { alunos:T.front||0, investimento:T.spend||0, faturamento:fat };

const _colIdx=L=>{let n=0;for(const ch of String(L).toUpperCase())n=n*26+(ch.charCodeAt(0)-64);return n-1;};

function _csvParseLinhas(t){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else { if(c==='"')q=true; else if(c===','){row.push(f);f='';} else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';} else if(c!=='\r')f+=c; }
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows;
}
// Lê a planilha e devolve o que está gravado naquela data/bloco.
async function lerLinhaPlanilha(data, bloco){
  const r=await fetch(`https://docs.google.com/spreadsheets/d/${GS_PLANILHA_ID}/export?format=csv&gid=${GS_GID}&t=${Date.now()}`);
  if(!r.ok) throw new Error('não consegui ler a planilha (HTTP '+r.status+')');
  const rows=_csvParseLinhas(await r.text());
  const ci=_colIdx(COL_POR_BLOCO[bloco]||'AX');
  const dd=String(data).trim();
  for(const row of rows){
    const b=(row[1]||'').trim();                      // coluna B = Data
    if(b && b.replace(/^(\d)\//,'0$1/')===dd){
      const n=v=>parseFloat(String(v||'').replace(/[R$\s.]/g,'').replace(',','.'))||0;
      return {achou:true, alunos:n(row[ci]), investimento:n(row[ci+1]), faturamento:n(row[ci+2])};
    }
  }
  return {achou:false};
}
