// ── Funis de checkout + produtos (conversão / take rate) ────────────────────
async function fetchFunis(){
  if(S._funisLoading) return; S._funisLoading=true; render();
  try{
    const {since,until}=periodRange(S.period);
    const res=await fetch(`${S.sbUrl}/rest/v1/rpc/funnel_products`,{method:'POST',headers:{'Content-Type':'application/json','apikey':S.sbKey,'Authorization':'Bearer '+S.sbKey},body:JSON.stringify({p_since:since,p_until:until,p_org:currentFunnel().match||''})});
    const rows=res.ok?await res.json():[];
    const m={};
    rows.forEach(r=>{ const f=r.funil_id; if(!m[f]) m[f]={id:f,nome:r.funil_nome||'',produtos:[]}; m[f].produtos.push({nome:r.produto_nome,tipo:r.tipo_oferta,compradores:parseInt(r.compradores)||0,receita:parseFloat(r.receita)||0}); });
    S._funis=Object.values(m);
  }catch(e){ S._funis=[]; }
  S._funisLoading=false; render();
}
function reloadFunis(){ S._funis=null; fetchFunis(); }
// Ordem fixa dos produtos no card de funis: Front, OB1, OB2, OB3, UP1, DW1, DW2, UP2, UP3
const PROD_ORDER=['ENTRY','OB1','OB2','OB3','UP1','DW1','DW2','UP2','UP3'];
function prodRank(p){
  if(p.tipo==='ENTRY') return 0;
  const nome=p.nome||'';
  // overrides para produtos sem número no nome mas com posição conhecida
  if(/c[oó]digo\s*de\s*r\$?\s*500/i.test(nome)) return PROD_ORDER.indexOf('OB3');
  if(/call\s*com\s*s[oó]cio/i.test(nome)) return PROD_ORDER.indexOf('OB3'); // OB3 alternativo, já rodou nessa posição
  if(/loja pronta/i.test(nome)){
    if(p.tipo==='UPSELL') return PROD_ORDER.indexOf('UP1');
    if(p.tipo==='DOWNSELL') return PROD_ORDER.indexOf('DW1');
  }
  if(/mentoria\s*1x1/i.test(nome)) return PROD_ORDER.indexOf('UP3'); // 3º upsell da esteira, confirmado nos dois funis principais
  const m=nome.match(/\b(OB|UP|DW)\s*#?\s*(\d)/i);
  if(m){ const idx=PROD_ORDER.indexOf(m[1].toUpperCase()+m[2]); if(idx>=0) return idx; }
  const fallback={ORDERBUMP:1.5, UPSELL:4.5, DOWNSELL:5.5}; // produto sem número no nome: agrupa perto do tipo
  return 50+(fallback[p.tipo]||9);
}
function nomeFunil(prods){
  const t=(prods||[]).map(p=>p.nome||'').join(' ');
  if(/loja pronta/i.test(t)) return 'Front + Loja Pronta';
  if(/mentoria|up#/i.test(t)) return 'Quiz + Mentoria/Upsell';
  return 'Front + Order Bumps';
}
function renderFunis(A){
  const head=`<h2>🗂️ Funis e produtos · conversão <span class="mini" style="text-transform:none">take rate = % dos compradores front que levaram cada item</span><button class="btn btn-gray btn-sm" style="float:right;padding:4px 10px" onclick="reloadFunis()">↻ Atualizar</button></h2>`;
  if(S._funisLoading || S._funis==null){ if(!S._funisLoading && S.connected) setTimeout(()=>fetchFunis(),40); return `<div class="card">${head}<div class="empty"><span class="loading"></span> Carregando funis e produtos…</div></div>`; }
  if(!S._funis.length) return `<div class="card">${head}<div class="empty">Sem vendas no período para a organização ${esc(currentFunnel().label)}.</div></div>`;
  const funis=S._funis.map(f=>{
    const front=f.produtos.filter(p=>p.tipo==='ENTRY').reduce((s,p)=>s+p.compradores,0);
    const receita=f.produtos.reduce((s,p)=>s+p.receita,0);
    const rate=t=>{ const c=f.produtos.filter(p=>p.tipo===t).reduce((s,p)=>s+p.compradores,0); return front?c/front*100:0; };
    return {...f, front, receita, ticket:front?receita/front:0, bump:rate('ORDERBUMP'), up:rate('UPSELL'), dw:rate('DOWNSELL'), nome:(f.nome||nomeFunil(f.produtos))};
  }).filter(f=>f.front>0 || f.receita>0).sort((a,b)=>b.front-a.front);
  const tBadge=t=>`<span class="badge b-${t==='ENTRY'?'bom':t==='UPSELL'?'observar':t==='DOWNSELL'?'ruim':'novo'}">${t}</span>`;
  const SLOT_TAGS=PROD_ORDER.slice(1); // ['OB1','OB2','OB3','UP1','DW1','DW2','UP2','UP3']
  const slotType=tag=>tag.startsWith('OB')?'ORDERBUMP':tag.startsWith('UP')?'UPSELL':'DOWNSELL';
  const body=funis.map(f=>{
    const frontProd=f.produtos.find(p=>p.tipo==='ENTRY');
    const bySlot={};
    f.produtos.filter(p=>p.tipo!=='ENTRY').forEach(p=>{ const r=prodRank(p); (bySlot[r]=bySlot[r]||[]).push(p); });
    const frontRow=`<tr><td>Front${frontProd?` <span class="mini">${esc(frontProd.nome)}</span>`:''}</td><td>${tBadge('ENTRY')}</td><td class="num">${f.front}</td><td class="num">base</td><td class="num">${fmtMoney0(frontProd?frontProd.receita:0)}</td></tr>`;
    // sempre mostra os 8 slots (OB1,OB2,OB3,UP1,DW1,DW2,UP2,UP3); zera quando não houve venda no período
    const slotRows=SLOT_TAGS.map(tag=>{
      const rank=PROD_ORDER.indexOf(tag);
      const list=(bySlot[rank]||[]).sort((a,b)=>b.compradores-a.compradores);
      if(list.length){
        return list.map(p=>`<tr><td>${tag} <span class="mini">${esc(p.nome)}</span></td><td>${tBadge(p.tipo)}</td><td class="num">${p.compradores}</td><td class="num">${f.front?(p.compradores/f.front*100).toFixed(1)+'%':'—'}</td><td class="num">${fmtMoney0(p.receita)}</td></tr>`).join('');
      }
      return `<tr style="opacity:.4"><td>${tag}</td><td>${tBadge(slotType(tag))}</td><td class="num">0</td><td class="num">0.0%</td><td class="num">R$ 0</td></tr>`;
    }).join('');
    return `<div style="border:1px solid #eee;border-radius:10px;padding:12px;margin-bottom:12px">
      <div class="row" style="justify-content:space-between;align-items:baseline">
        <div><b style="font-size:15px">${esc(f.nome)}</b> <span class="mini" style="font-family:monospace">${esc(String(f.id).slice(0,8))}</span></div>
        <div class="mini">${f.front} front · receita ${fmtMoney0(f.receita)} · ticket ${fmtMoney0(f.ticket)}</div>
      </div>
      <div class="row" style="gap:16px;margin:8px 0">
        <span class="mini">🛒 Order bump: <b style="color:#137333">${f.bump.toFixed(1)}%</b></span>
        <span class="mini">⬆️ Upsell: <b style="color:#137333">${f.up.toFixed(1)}%</b></span>
        <span class="mini">⬇️ Downsell: <b>${f.dw.toFixed(1)}%</b></span>
      </div>
      <div class="tbl-wrap" style="max-height:none"><table><thead><tr><th>Produto</th><th>Tipo</th><th class="num">Compradores</th><th class="num">Conversão</th><th class="num">Receita</th></tr></thead><tbody>
      ${frontRow}${slotRows}
      </tbody></table></div>
    </div>`;
  }).join('');
  return `<div class="card">${head}${body}
    <div class="mini" style="margin-top:4px">Conversão do produto = compradores do produto ÷ compradores do front do mesmo funil. As taxas de bump/upsell/downsell no topo são agregadas por tipo (igual ao painel da Assiny). Vendas reais do Supabase, por funil de checkout.</div>
  </div>`;
}

// ── Cruzamento IniciAmazon (front) → Backend (Mentoria e Consultorias) ───────
// Card fixo: sempre visível, não depende da Organização selecionada no topo.
function renderCrossover(A){
  const head=`<h2>🔗 IniciAmazon → Backend <span class="mini" style="text-transform:none">cruza compradores do front com a organização de mentoria/consultoria pelo e-mail, sem janela de tempo</span><button class="btn btn-gray btn-sm" style="float:right;padding:4px 10px" onclick="reloadCrossover()">↻ Atualizar</button></h2>`;
  const kwField='';
  if(S._crossoverLoading || S._crossover==null){
    if(!S._crossoverLoading && S.connected) setTimeout(()=>fetchCrossover(),40);
    return `<div class="card">${head}${kwField}<div class="empty"><span class="loading"></span> Cruzando compradores…</div></div>`;
  }
  const rate=S._crossoverRate||{total_front_buyers:0,total_backend_buyers:0,convertidos:0,taxa_conversao:0};
  // taxa com precisão real (não arredonda a esconder o número): dígitos significativos p/ taxas pequenas
  const fmtTaxa=(conv,tot)=>{
    if(!tot) return '0%';
    const p=100*conv/tot;
    if(p===0) return '0%';
    let s = p>=1 ? p.toFixed(2) : p.toPrecision(3); // ex.: 2/2098 -> "0.0953%"
    s = s.replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,''); // tira zeros à direita
    return s+'%';
  };
  if(!rate.total_backend_buyers){
    return `<div class="card">${head}${kwField}
      <div class="empty" style="font-style:normal">Nenhuma venda encontrada ainda para a organização "<b>${esc(S.backendKeyword)}</b>". Assim que o webhook da Mentoria e Consultorias for criado e começar a vender, essa análise já aparece pronta aqui — sem precisar mexer em nada. Base atual: <b>${fmtNum(rate.total_front_buyers)}</b> compradores do front no histórico.</div>
    </div>`;
  }
  const rows=S._crossover||[];
  const comFront=rows.filter(r=>r.front_data);
  const receitaBackend=rows.reduce((s,r)=>s+(+r.backend_valor||0),0);
  const receitaFrontDosConvertidos=comFront.reduce((s,r)=>s+(+r.front_valor||0),0);
  const ticketBackend=rows.length?receitaBackend/rows.length:0;
  const ltvMedio=comFront.length?(receitaBackend+receitaFrontDosConvertidos)/comFront.length:0;
  // agrega por campanha de origem
  const byCamp={};
  comFront.forEach(r=>{
    const k=r.front_meta_campaign_id||r.front_campanha||'(sem UTM)';
    if(!byCamp[k]) byCamp[k]={key:k, nome:r.front_campanha||k, n:0, receitaBackend:0, campId:r.front_meta_campaign_id};
    byCamp[k].n++; byCamp[k].receitaBackend+=(+r.backend_valor||0);
  });
  const campArr=Object.values(byCamp).sort((a,b)=>b.receitaBackend-a.receitaBackend);
  const cac=S._crossoverCAC;
  const cacBtn = cac ? '' : `<button class="btn btn-purple btn-sm" onclick="fetchCrossoverCAC()" ${S._crossoverCACLoading?'disabled':''}>${S._crossoverCACLoading?'<span class="loading"></span> Carregando…':'💰 Carregar CAC real (gasto Meta)'}</button>`;
  // ── breakdown por tipo (Mentoria x Consultoria) ──
  const tipos = S._crossoverTipos||[];
  const linha=(l,v)=>`<div style="display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;gap:12px"><span class="mini">${l}</span><b style="white-space:nowrap">${v}</b></div>`;
  const tipoBlock=(t)=>{
    const isCons = t.tipo==='Consultoria';
    const origens = comFront.filter(r=>(r.backend_tipo||'Mentoria')===t.tipo);
    const campIds = [...new Set(origens.map(r=>r.front_meta_campaign_id).filter(Boolean))];
    let cacTipo=null;
    if(cac){ const gasto=campIds.reduce((s,id)=>s+(cac[id]!=null?+cac[id]:0),0); cacTipo=origens.length?gasto/origens.length:null; }
    const cor=isCons?'#7c3aed':'#0891b2';
    const custoVal = cac ? (cacTipo!=null?fmtMoney0(cacTipo):'—')
                         : (origens.length?'<span class="mini" style="font-weight:400">clique “Carregar CAC”</span>':'<span class="mini" style="font-weight:400">sem origem Meta rastreada</span>');
    return `<div style="flex:1;min-width:250px;border:1px solid #e9e9ef;border-left:4px solid ${cor};border-radius:10px;padding:14px 16px;background:#fff">
      <div style="font-weight:800;font-size:15px;margin-bottom:10px">${isCons?'🏛️ Consultoria':'🎓 Mentoria'}</div>
      ${linha('Receita bruta (período)', fmtMoney0(t.receita_bruta))}
      ${linha('Receita líquida', fmtMoney0(t.receita_liquida))}
      ${linha('Vendas / compradores', fmtNum(t.vendas)+' / '+fmtNum(t.compradores))}
      ${linha('Ticket médio', fmtMoney0(t.ticket_medio))}
      ${linha('Taxa front→backend', fmtTaxa(t.convertidos_hist,rate.total_front_buyers)+' <span class="mini" style="font-weight:400">('+fmtNum(t.convertidos_hist)+' conv. no histórico)</span>')}
      ${linha('Custo (CAC atribuído)', custoVal)}
    </div>`;

function crossCriaPub(adCodeFn){
  const pubById={}; (S._topPub||[]).forEach(x=>{ if(x.id&&x.publico) pubById[String(x.id)]=x.publico; });
  if(!Object.keys(pubById).length||!(S._topAds||[]).length) return [];
  const byAd=(S._rev&&S._rev.byAd)||{};
  const usd=parseFloat(S.usdBrl)>0?parseFloat(S.usdBrl):5.40;
  const m={};
  (S._topAds||[]).forEach(o=>{
    const pub=pubById[String(o.adset_id)]; if(!pub) return;
    const cre=adCodeFn(o.name); if(!cre) return;
    const k=cre+'||'+pub;
    const g=m[k]||(m[k]={cre,pub,spend:0,receita:0,front:0});
    g.spend+=((o._currency||'BRL')==='USD')?(o.spend||0)*usd:(o.spend||0);
    const hit=byAd[String(o.id)];
    if(hit){ g.receita+=(hit.receita||0); g.front+=(hit.front||0); }
  });

// ── Análise cruzada de criativos ─────────────────────────────────────────────
function renderCreativeAnalysis(ads){
  if(!ads||!ads.length) return '';
  const _tag=(nm,re)=>{const m=String(nm).match(re);return m?m[1]||m[0]:null;};
  const extractTags=(name)=>{
    const t={};
    const hm=name.match(/\bH(?:o[ck]+\s*)?(\d)\b/i); if(hm) t.hook='H'+hm[1];
    const cm=name.match(/\bCTA\s*(\d)\b/i); if(cm) t.cta='CTA'+cm[1];
    const rm=name.match(/\bRM(\d+)\b/); if(rm) t.roteiro='RM'+rm[1].padStart(2,'0');
    if(/Casa[_\s-]?Nath/i.test(name)) t.cenario='Casa Nath';
    else if(/IA[_-]Nath/i.test(name)) t.cenario='IA Nath';
    else if(/ROI[_\s]?MANSION/i.test(name)) t.cenario='ROI Mansion';
    else if(/CASA[_\s]?TOM[EÉ]/i.test(name)) t.cenario='Casa Tome';
    if(/comente/i.test(name)) t.tipo='Comente';
    else if(/Remessa/i.test(name)) t.tipo='Remessa';
    else if(/\bNath\s+V\d/i.test(name)) t.tipo='Nath V';
    else if(/Cri[a]?tivo/i.test(name)) t.tipo='Criativo LG';
    else if(/\bAD\s*\d+/i.test(name)) t.tipo='AD';
    else t.tipo='Outros';
    return t;
  };
  const tagged=ads.filter(a=>a.front>=1).map(a=>({...a,_t:extractTags(a.name)}));
  if(!tagged.length) return '';
  const aggBy=(keyFn)=>{
    const m={};
    tagged.forEach(a=>{const k=keyFn(a);if(!k)return;if(!m[k])m[k]={key:k,spend:0,receita:0,front:0,total:0,n:0,fa:0,fb:0,fc:0,fsem:0,fresp0:0};const d=m[k];d.spend+=a.spend;d.receita+=a.receita;d.front+=a.front;d.total+=a.total||0;d.n++;d.fa+=a.fa||0;d.fb+=a.fb||0;d.fc+=a.fc||0;d.fsem+=a.fsem||0;d.fresp0+=a.fresp0||0;});
    return Object.values(m).map(d=>({...d,roas:d.spend>0?d.receita/d.spend:null,cpa:d.front>0?d.spend/d.front:null,ticket:d.front>0?d.receita/d.front:0,pctAB:((d.fa+d.fb)/(d.fa+d.fb+d.fc+d.fsem||1)*100)})).sort((a,b)=>b.spend-a.spend);
  };
  const tbl=(title,rows,extraCol)=>{
    if(!rows.length) return '';
    const best=rows.reduce((b,r)=>(r.roas!=null&&(b==null||r.roas>b.roas))?r:b,null);
    const bestCPA=rows.filter(r=>r.cpa!=null&&r.front>=10).reduce((b,r)=>(b==null||r.cpa<b.cpa)?r:b,null);
    return `<div style="margin-top:12px"><b>${title}</b>
    <div style="overflow-x:auto"><table class="dim-tbl" style="margin-top:4px;font-size:12px"><thead><tr>
      <th style="text-align:left">${extraCol||'Dimensao'}</th><th>Gasto</th><th>Receita</th><th>ROAS</th><th>CPA</th><th>Front</th><th>Ticket</th><th>%A+B</th><th>Criativos</th>
    </tr></thead><tbody>
    ${rows.map(r=>{const isBest=best&&r.key===best.key;const isBestCPA=bestCPA&&r.key===bestCPA.key;return `<tr${isBest?' style="background:#e8f5e9"':''}>
      <td style="text-align:left;font-weight:600">${esc(r.key)}${isBest?' <span style="color:#137333;font-size:10px">melhor ROAS</span>':''}${isBestCPA&&!isBest?' <span style="color:#0891b2;font-size:10px">melhor CPA</span>':''}</td>
      <td class="num">${fmtMoney0(r.spend)}</td><td class="num">${fmtMoney0(r.receita)}</td>
      <td class="num" style="color:${roasColor(r.roas)};font-weight:700">${r.roas!=null?fmtRoas(r.roas):'--'}</td>
      <td class="num">${r.cpa!=null?fmtMoney0(r.cpa):'--'}</td>
      <td class="num">${fmtNum(r.front)}</td><td class="num">${fmtMoney0(r.ticket)}</td>
      <td class="num">${r.fa+r.fb+r.fc+r.fsem?r.pctAB.toFixed(0)+'%':'--'}</td>
      <td class="num">${r.n}</td>
    </tr>`;}).join('')}
    </tbody></table></div></div>`;
  };
  const byTipo=aggBy(a=>a._t.tipo);
  const byRoteiro=aggBy(a=>a._t.roteiro);
  const byCenario=aggBy(a=>a._t.cenario);
  // Recommendations
  const recs=[];
  if(byTipo.length>=2){
    const worst=byTipo.filter(r=>r.front>=20).sort((a,b)=>(a.roas||0)-(b.roas||0))[0];
    const best=byTipo.filter(r=>r.front>=20).sort((a,b)=>(b.roas||0)-(a.roas||0))[0];
    if(worst&&worst.roas!=null&&worst.roas<0.7) recs.push(`Criativos tipo <b>${esc(worst.key)}</b> tem o pior ROAS (${fmtRoas(worst.roas)}) com CPA ${fmtMoney0(worst.cpa)}. Considere reduzir o volume nesse formato.`);
    if(best&&best.roas!=null&&best.roas>0.8&&best.spend<byTipo[0].spend*0.5) recs.push(`<b>${esc(best.key)}</b> tem ROAS ${fmtRoas(best.roas)} mas ainda com pouco gasto (${fmtMoney0(best.spend)}). Tem espaco para escalar.`);
  }
  const escalaveis=ads.filter(a=>a.roas!=null&&a.roas>=0.95&&a.front>=50&&a.spend<200000).sort((a,b)=>(b.roas||0)-(a.roas||0)).slice(0,3);
  if(escalaveis.length) recs.push(`Criativos com ROAS alto e espaco para escalar: ${escalaveis.map(a=>`<b>${esc(a.name)}</b> (ROAS ${fmtRoas(a.roas)}, gasto ${fmtMoney0(a.spend)})`).join(', ')}.`);
  const gastando=ads.filter(a=>a.spend>=100000&&a.roas!=null&&a.roas<0.65).sort((a,b)=>b.spend-a.spend).slice(0,3);
  if(gastando.length) recs.push(`Alto gasto com ROAS fraco: ${gastando.map(a=>`<b>${esc(a.name)}</b> (${fmtMoney0(a.spend)}, ROAS ${fmtRoas(a.roas)})`).join(', ')}. Avaliar se compensa manter.`);
  const recsHtml=recs.length?`<div style="margin-top:12px;padding:10px 14px;background:#f0f4ff;border-radius:8px;border-left:3px solid #5046e5">
    <b style="color:#5046e5">Recomendacoes para novos testes</b>
    <ul style="margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.6">${recs.map(r=>`<li>${r}</li>`).join('')}</ul>
  </div>`:'';
  return `<hr style="margin:16px 0">
    <details open><summary style="cursor:pointer;font-weight:700;font-size:15px;color:#5046e5">🔬 Analise cruzada de criativos <span class="mini" style="font-weight:400;color:#888">(${tagged.length} criativos com venda)</span></summary>
    ${recsHtml}
    ${tbl('Por tipo de criativo',byTipo,'Tipo')}
    ${tbl('Por roteiro',byRoteiro,'Roteiro')}
    ${tbl('Por cenario/estilo',byCenario,'Cenario')}
    <div class="mini" style="margin-top:10px">Tags extraidas automaticamente dos nomes dos criativos — agrupamento de conteudo, nao analise causal. Para saber POR QUE um criativo performa (hook, retencao, CTA), use a secao "Funil de video" acima, que usa metricas reais de visualizacao. <b>%A+B</b> = percentual de compradores Faixa A+B entre os que responderam a pesquisa. <b>Ticket</b> = receita media por comprador front.</div>
    </details>`;
}

    const q=(S._adSearch||'').toLowerCase();
    const top=ads.filter(a=>a.front>=1 && a.spend>=minG && (!q||a.name.toLowerCase().includes(q))).slice(0,30);
    const pctExato=(n,tot)=>{ if(!tot||!n) return '0%'; const p=100*n/tot; let s=p>=1?p.toFixed(1):p.toPrecision(2); s=s.replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,''); return s+'%'; };
    const fBadge=(lbl,n,tot,cor)=> `<span style="color:${n>0?cor:'#ccc'};margin-right:10px">${lbl} <b>${n}</b> <span style="font-weight:400">(${pctExato(n,tot)})</span></span>`;
    const faixaLine=(g)=>{ const tot=g.fa+g.fb+g.fc+g.fsem+g.fresp0; if(!tot) return '';
      const conhecidos=g.fa+g.fb+g.fc+g.fsem;
      return `<div class="i-sub" style="margin-top:2px">Faixas (de ${tot} compradores): ${fBadge('A',g.fa,tot,'#137333')}${fBadge('B',g.fb,tot,'#0891b2')}${fBadge('C',g.fc,tot,'#b26a00')}${fBadge('Sem faixa',g.fsem,tot,'#8a8a8a')}<span style="color:#bbb">Não respondeu <b>${g.fresp0}</b> (${pctExato(g.fresp0,tot)})</span>${conhecidos?` <span class="mini">· A+B = ${pctExato(g.fa+g.fb,conhecidos)} entre os que responderam</span>`:''}</div>`;
    };
    const variantLine=(g)=>{
      const varArr=Object.values(g.vars).sort((a,b)=>b.spend-a.spend);
      if(varArr.length<=1) return '';
      return `<details style="margin-top:4px"><summary class="mini" style="cursor:pointer;color:#7b2ff7;font-weight:600">${varArr.length} variantes</summary><div style="padding:6px 0 2px 14px;border-left:2px solid #e8e0f5">${varArr.map(v=>{
        const vRoas=v.spend>0?v.receita/v.spend:null;
        return `<div class="mini" style="margin-bottom:4px"><b>${esc(v.name)}</b> <span style="color:#999">(${v.n})</span> · ${fmtMoney0(v.spend)} gasto · <b>${fmtMoney0(v.receita)} receita</b> · ${v.front} front / ${v.total} tot · ROAS <span style="color:${roasColor(vRoas)}">${vRoas!=null?fmtRoas(vRoas):'—'}</span></div>`;
      }).join('')}</div></details>`;
    };
    const accLine=(g)=>{
      const aa=Object.values(g.accs).sort((a,b)=>b.brl-a.brl);
      if(aa.length<=1) return '';
      return `<details style="margin-top:2px"><summary class="mini" style="cursor:pointer;color:#888">diagnostico por conta (${aa.length})</summary><div style="padding:4px 0 2px 14px;border-left:2px solid #e0e0e0">${aa.map(a=>
        `<div class="mini" style="margin-bottom:2px">${esc(a.name)} <span style="color:#999">[${a.cur}]</span> · ${a.n} ads · raw ${a.cur==='USD'?'US$':'R$'}${fmtNum(Math.round(a.raw))} · conv R$ ${fmtNum(Math.round(a.brl))}</div>`
      ).join('')}</div></details>`;
    };
    // ── Benchmarks da própria conta (para gerar sugestões comparativas) ──
    const _vm=_vidMap(adCode);
    const _vmVals=Object.values(_vm).filter(g=>g.v3>=100);
    const BM={
      hook:_med(_vmVals.map(g=>g.hook)), hold:_med(_vmVals.map(g=>g.hold)),
      ctrView:_med(_vmVals.map(g=>g.ctrView)), r75:_med(_vmVals.map(g=>g.r75)),
      ab:_med(ads.map(x=>{const r=(x.fa||0)+(x.fb||0)+(x.fc||0)+(x.fsem||0);return r>0?((x.fa||0)+(x.fb||0))/r*100:0;}))
    };
    // ROAS por ângulo e por tipo de CTA (calculado ao vivo)
    const _byAng={}, _byCta={};
    ads.forEach(x=>{ const ca=(S._critAnalise||{})[x.name]||{};
      if(ca.angle){ const g=_byAng[ca.angle]||(_byAng[ca.angle]={s:0,r:0}); g.s+=x.spend; g.r+=x.receita; }
      if(ca.cta){ const g=_byCta[ca.cta]||(_byCta[ca.cta]={s:0,r:0}); g.s+=x.spend; g.r+=x.receita; }
    });
    const angRank=Object.entries(_byAng).filter(([,g])=>g.s>=5000).map(([k,g])=>({k,roas:g.r/g.s})).sort((a,b)=>b.roas-a.roas);
    const bestAng=angRank[0]||null;
    const ctaRank=Object.entries(_byCta).filter(([,g])=>g.s>=5000).map(([k,g])=>({k,roas:g.r/g.s})).sort((a,b)=>b.roas-a.roas);
    const bestCta=ctaRank[0]||null, worstCta=ctaRank.length>1?ctaRank[ctaRank.length-1]:null;

    // ── Diagnóstico profundo por criativo ────────────────────────────────
    const _pct=(x,d=1)=>x==null?'—':x.toFixed(d)+'%';
    const deepDiag=(a,ca)=>{
      ca=ca||{}; const v=_vm[a.name];
      const be=parseFloat(A.roasAlvo)||1;
      const conv=a.clicks>0?a.front/a.clicks*100:null;
      const ticket=a.front>0?a.receita/a.front:0;
      const resp=(a.fa||0)+(a.fb||0)+(a.fc||0)+(a.fsem||0);
      const ab=resp>0?((a.fa||0)+(a.fb||0))/resp*100:null;
      const S_=[];

      // 1) Funil do criativo
      let funil='';
      if(v&&v.v3>=100){
        funil=`<b>${fmtNum(a.imp)}</b> impressões → <b>${_pct(v.hook)}</b> pararam (3s) → <b>${_pct(v.hold,0)}</b> seguraram até o fim → <b>${_pct(v.r75,0)}</b> chegaram a 75% (proxy do CTA) → <b>${_pct(v.ctrView)}</b> clicaram → <b>${fmtNum(a.front)}</b> vendas`;
      } else {
        funil=`<b>${fmtNum(a.imp)}</b> impressões → <b>${_pct(a.ctr,2)}</b> CTR (${fmtNum(a.clicks)} cliques) → <b>${fmtNum(a.front)}</b> vendas${conv!=null?` (<b>${_pct(conv)}</b> dos cliques viram venda)`:''}`;
      }
      S_.push(`<div style="font-weight:700;margin:6px 0 2px;color:#5a2ca0">📊 Funil do criativo</div><div>${funil}</div>
        <div class="mini" style="margin-top:2px">CPA ${a.cpa!=null?fmtMoney0(a.cpa):'—'} · ticket ${fmtMoney0(ticket)} · ROAS ${fmtRoas(a.roas)} (breakeven ${fmtRoas(be)}) · ${fmtMoney0(a.spend)} investidos em ${a.n} anúncio(s)</div>`);

      // 2) Gargalo: compara cada etapa com a mediana da conta
      const st=[];
      if(v&&v.v3>=100){
        if(BM.hook) st.push({k:'Gancho (3s)',r:v.hook/BM.hook,v:_pct(v.hook),b:_pct(BM.hook),fix:'os 3 primeiros segundos não estão parando o dedo — reescreva só a abertura e mantenha o resto'});
        if(BM.hold) st.push({k:'Retenção',r:v.hold/BM.hold,v:_pct(v.hold,0),b:_pct(BM.hold,0),fix:'o corpo perde quem já tinha parado — encurte o meio e adiante a promessa'});
        if(BM.ctrView) st.push({k:'CTA (clique/view)',r:v.ctrView/BM.ctrView,v:_pct(v.ctrView),b:_pct(BM.ctrView),fix:'quem assiste não clica — o fechamento está fraco ou a oferta não fica clara no fim'});
      }
      if(BM.conv&&conv!=null) st.push({k:'Página/checkout',r:conv/BM.conv,v:_pct(conv),b:_pct(BM.conv),fix:'clica mas não compra — tráfego pouco qualificado ou promessa desalinhada com a página'});
      if(st.length){
        const ord=st.slice().sort((x,y)=>x.r-y.r), pior=ord[0], melhor=ord[ord.length-1];
        if(pior.r<0.85) S_.push(`<div style="font-weight:700;margin:8px 0 2px;color:#c5221f">🔴 Gargalo: ${pior.k}</div><div>${pior.v} contra mediana ${pior.b} da conta — <b>${pior.fix}</b>.${melhor.r>1.1?` O ponto forte é <b>${melhor.k}</b> (${melhor.v} vs ${melhor.b}), então preserve essa parte.`:''}</div>`);
        else S_.push(`<div style="font-weight:700;margin:8px 0 2px;color:#137333">✅ Sem gargalo evidente</div><div>Todas as etapas estão dentro ou acima da mediana. O ponto mais forte é <b>${melhor.k}</b> (${melhor.v} vs ${melhor.b}).${a.roas!=null&&a.roas<be?' O ROAS abaixo do breakeven aqui é questão de <b>custo de mídia/leilão</b>, não do criativo.':''}</div>`);
      }

      // 3) Conteúdo x resultado (hook e CTA reais)
      if(ca.hook){
        let leitura='';
        if(v&&v.v3>=100&&BM.hook){ leitura = v.hook>=BM.hook*1.15?'esse gancho <b>prende acima da média</b> — vale reaproveitar em novos roteiros':(v.hook<=BM.hook*0.85?'esse gancho <b>está abaixo da média</b> em parar o dedo — é o primeiro item a trocar':'esse gancho performa na média'); }
        S_.push(`<div style="font-weight:700;margin:8px 0 2px;color:#5a2ca0">🎙️ Conteúdo × resultado</div>
          <div><b>Gancho:</b> "${esc(ca.hook)}"${leitura?` — ${leitura}.`:''}</div>
          ${ca.ctaTxt?`<div style="margin-top:2px"><b>CTA:</b> "${esc(ca.ctaTxt)}"${ca.cta?` <span class="mini">(tipo: ${esc(ca.cta)})</span>`:''}</div>`:''}`);
      }

      // 4) Variantes: vencedora vs perdedora
      const vars=Object.values(a.vars||{}).filter(x=>x.spend>=500);
      if(vars.length>1){
        const vv=vars.map(x=>({...x,roas:x.spend>0?x.receita/x.spend:0,cpa:x.front>0?x.spend/x.front:null})).sort((x,y)=>y.roas-x.roas);
        const bestV=vv[0], worstV=vv[vv.length-1];
        if(bestV.roas>0&&worstV.roas<bestV.roas*0.75){
          const econ=worstV.spend;
          S_.push(`<div style="font-weight:700;margin:8px 0 2px;color:#5a2ca0">🧪 Variantes (${vars.length})</div>
            <div>Melhor: <b>${esc(bestV.name)}</b> — ROAS ${fmtRoas(bestV.roas)} (${fmtMoney0(bestV.spend)}, CPA ${bestV.cpa!=null?fmtMoney0(bestV.cpa):'—'}).<br>
            Pior: <b>${esc(worstV.name)}</b> — ROAS ${fmtRoas(worstV.roas)} (${fmtMoney0(econ)}, CPA ${worstV.cpa!=null?fmtMoney0(worstV.cpa):'—'}).<br>
            <b>Ação:</b> pausar a pior e realocar os ${fmtMoney0(econ)} na vencedora — mesma peça, ${((bestV.roas/(worstV.roas||0.01)-1)*100).toFixed(0)}% mais eficiente.</div>`);
        }
      }

      // 5) Qualidade do lead
      if(resp>=20&&ab!=null){
        const diff=BM.ab?ab-BM.ab:0;
        const sem=(a.fsem||0)/resp*100;
        S_.push(`<div style="font-weight:700;margin:8px 0 2px;color:#5a2ca0">👥 Qualidade do lead</div>
          <div>${_pct(ab,0)} dos compradores são <b>Faixa A+B</b> (mediana da conta ${_pct(BM.ab||0,0)}) e ${_pct(sem,0)} declararam <b>não ter caixa</b>.
          ${diff>=2?' Traz comprador com mais dinheiro que a média — <b>é o tipo de lead que alimenta o backend</b>.':(diff<=-2?' Traz comprador com menos caixa que a média — converte no front, mas <b>dificilmente sobe para o alto ticket</b>.':' Perfil de comprador na média da conta.')}
          Ticket ${fmtMoney0(ticket)}.</div>`);
      }

      // 6) Comparação com o próprio ângulo + ações
      const acoes=[];
      if(ca.angle&&bestAng){
        const pares=ads.filter(x=>((S._critAnalise||{})[x.name]||{}).angle===ca.angle&&x.spend>=1000);
        const rank=pares.slice().sort((x,y)=>(y.roas||0)-(x.roas||0)).findIndex(x=>x.name===a.name)+1;
        if(pares.length>1&&rank>0) acoes.push(`Dentro do ângulo "<b>${esc(ca.angle)}</b>" este é o <b>${rank}º de ${pares.length}</b> em ROAS.${rank===1?' É a referência do ângulo — clone a estrutura dele.':(rank>=pares.length?' É o pior do ângulo — o problema é a execução, não o ângulo.':'')}`);
        if(ca.angle!==bestAng.k) acoes.push(`O ângulo campeão da conta é "<b>${esc(bestAng.k)}</b>" (ROAS ${fmtRoas(bestAng.roas)}) vs ${fmtRoas((_byAng[ca.angle].r/_byAng[ca.angle].s))} deste. Testar esta peça reescrita nesse ângulo.`);
      }
      if(ca.cta&&bestCta&&worstCta&&bestCta.k!==worstCta.k&&ca.cta===worstCta.k)
        acoes.push(`CTA de <b>${esc(worstCta.k)}</b> rende ROAS ${fmtRoas(worstCta.roas)} na conta contra ${fmtRoas(bestCta.roas)} do <b>${esc(bestCta.k)}</b>. Regravar só o fechamento com CTA de ${esc(bestCta.k)}.`);
      if(a.n>=500) acoes.push(`<b>${fmtNum(a.n)} anúncios</b> agrupados sob a mesma peça: há duplicação competindo no leilão. Consolidar em menos anúncios costuma baixar CPM.`);
      if(a.roas!=null&&a.roas>=be&&a.spend<50000) acoes.push(`Está no lucro com pouco investido (${fmtMoney0(a.spend)}) — <b>tem espaço para escalar</b>.`);
      if(a.roas!=null&&a.roas<be*0.7&&a.spend>=100000) acoes.push(`Já consumiu ${fmtMoney0(a.spend)} com ROAS ${fmtRoas(a.roas)} — <b>cortar ou reduzir</b> e realocar nos vencedores.`);
      if(acoes.length) S_.push(`<div style="font-weight:700;margin:8px 0 2px;color:#137333">💡 Ações recomendadas</div><ul style="margin:2px 0 0 16px;padding:0">${acoes.map(x=>`<li style="margin-bottom:3px">${x}</li>`).join('')}</ul>`);

      return `<div class="diag-box">${S_.join('')}</div>`;
    };
    const metricasLine=(a)=>{
      const v=_vm[a.name];
      const cpm=a.imp>0?a.spend/a.imp*1000:0, cpc=a.clicks>0?a.spend/a.clicks:0;
      const ticket=a.front>0?a.receita/a.front:0;
      const conv=a.clicks>0?a.front/a.clicks*100:0;
      const extra=a.front>0?(a.total-a.front)/a.front*100:0;   // upsell/bump por venda front
      const cell=(l,val,t)=>`<div style="padding:6px 8px"><div class="mini" style="text-transform:uppercase;letter-spacing:.3px"${t?` title="${esc(t)}"`:''}>${l}</div><div style="font-weight:700;font-variant-numeric:tabular-nums">${val}</div></div>`;
      const grid=(titulo,cells)=>`<div style="margin-top:8px"><div style="font-weight:700;font-size:11px;color:#5a2ca0;text-transform:uppercase;letter-spacing:.4px">${titulo}</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:2px;margin-top:2px">${cells.join('')}</div></div>`;

      let html = grid('Entrega', [
        cell('Impressões', fmtNum(a.imp)),
        cell('CPM', fmtMoney(cpm), 'custo por mil impressões'),
        cell('Cliques', fmtNum(a.clicks)),
        cell('CTR', fmtPct(a.ctr), 'cliques ÷ impressões'),
        cell('CPC', fmtMoney(cpc), 'custo por clique'),
        cell('Anúncios', fmtNum(a.n), 'quantos anúncios estão agrupados sob este nome')
      ]);
      html += grid('Conversão', [
        cell('Gasto', fmtMoney0(a.spend)),
        cell('Receita', fmtMoney0(a.receita)),
        cell('ROAS', fmtRoas(a.roas)),
        cell('Vendas front', fmtNum(a.front)),
        cell('CPA', a.cpa!=null?fmtMoney(a.cpa):'—', 'gasto ÷ vendas front'),
        cell('Ticket', fmtMoney(ticket), 'receita ÷ vendas front'),
        cell('Clique→venda', conv?fmtPct(conv):'—', 'vendas front ÷ cliques'),
        cell('Vendas totais', fmtNum(a.total)),
        cell('Extra/venda', a.front?extra.toFixed(0)+'%':'—', 'quanto de order bump/upsell vem por venda front')
      ]);
      if(v&&v.v3>=100){
        html += grid('Vídeo', [
          cell('Views 3s', fmtNum(v.v3)),
          cell('Hook', v.hook.toFixed(1)+'%', 'views de 3s ÷ impressões — quantos pararam o dedo'),
          cell('Hold', v.hold.toFixed(0)+'%', 'ThruPlay ÷ views de 3s — quantos seguraram'),
          cell('Até 75%', v.r75.toFixed(0)+'%', 'proxy de quem chegou ao CTA'),
          cell('Tempo médio', v.avgT?v.avgT.toFixed(0)+'s':'—'),
          cell('CTR/views', v.ctrView.toFixed(1)+'%', 'cliques ÷ views de 3s')
        ]);
      }
      const resp=(a.fa||0)+(a.fb||0)+(a.fc||0)+(a.fsem||0);
      if(resp>0){
        html += grid('Qualidade do comprador', [
          cell('Faixa A', fmtNum(a.fa||0), 'investe ≥ R$3k'),
          cell('Faixa B', fmtNum(a.fb||0), 'investe R$1–3k'),
          cell('Faixa C', fmtNum(a.fc||0), '< R$1k mas renda ≥ R$3k'),
          cell('Sem caixa', fmtNum(a.fsem||0)),
          cell('A+B', (((a.fa||0)+(a.fb||0))/resp*100).toFixed(0)+'%', 'entre os que responderam a pesquisa'),
          cell('Não respondeu', fmtNum(a.fresp0||0))
        ]);
      }
      return `<details style="margin-top:2px"><summary class="mini" style="cursor:pointer;color:#0891b2;font-weight:600">📊 métricas do ad</summary><div style="padding:4px 6px 6px 10px;border-left:2px solid #cfe8ef;margin-top:4px">${html}</div></details>`;
    };
    const analiseLine=(a)=>{
      const ca=(S._critAnalise||{})[a.name];
      const ic=ca?(ca.kind==='image'?'🖼️':'🎬'):'📊';
      const badge=ca?(ca.kind==='image'?'<span class="mini" style="color:#7b2ff7">imagem</span>':'<span class="mini" style="color:#0891b2">vídeo</span>'):'';
      const lbl=ca?'análise do criativo (diagnóstico + áudio/visual)':'diagnóstico de performance';
      return `<details style="margin-top:2px"><summary class="mini" style="cursor:pointer;color:#7b2ff7;font-weight:600">${ic} ${lbl} ${badge}</summary><div style="padding:8px 10px 4px 12px;border-left:2px solid #d8c9f5;margin-top:4px;font-size:12px;line-height:1.5;max-height:520px;overflow:auto">${deepDiag(a,ca)}${ca?`<div style="font-weight:700;margin:12px 0 4px;color:#5a2ca0">🎬 Análise de áudio & visual (completa)</div>${ca.html}`:''}</div></details>`;
    };
    // ── Ideias de teste de comunicação (hipóteses de criativo) ──────────
    (()=>{
      const CA=(nm)=>(S._critAnalise||{})[nm]||{};
      const I=[]; const rel=ads.filter(x=>x.spend>=3000);
      const withV=rel.filter(x=>_vm[x.name]&&_vm[x.name].v3>=100);
      // 1. Gancho vencedor + corpo vencedor
      if(withV.length>=2){
        const bh=withV.slice().sort((x,y)=>_vm[y.name].hook-_vm[x.name].hook)[0];
        const bd=withV.slice().sort((x,y)=>_vm[y.name].hold-_vm[x.name].hold)[0];
        if(bh.name!==bd.name){
          const hk=CA(bh.name).hook;
          I.push(`<b>Junte o melhor gancho com o melhor corpo.</b> "${esc(bh.name)}" tem o maior hook (${_pct(_vm[bh.name].hook)} param o dedo) e "${esc(bd.name)}" a maior retenção (${_pct(_vm[bd.name].hold,0)} seguram). Grave uma peça com a <b>abertura do primeiro</b> e o <b>desenvolvimento do segundo</b>.${hk?` Abertura a reaproveitar: <i>"${esc(hk.slice(0,110))}…"</i>`:''}`);
        }
      }
      // 2. Trocar CTA perdedor pelo vencedor
      if(bestCta&&worstCta&&bestCta.k!==worstCta.k){
        const alvos=rel.filter(x=>CA(x.name).cta===worstCta.k).sort((x,y)=>y.spend-x.spend).slice(0,3);
        if(alvos.length){
          const verba=alvos.reduce((t,x)=>t+x.spend,0);
          const ganho=((bestCta.roas/worstCta.roas-1)*100).toFixed(0);
          I.push(`<b>Regrave só o fechamento trocando o CTA.</b> CTA de <b>${esc(bestCta.k)}</b> rende ROAS ${fmtRoas(bestCta.roas)} contra ${fmtRoas(worstCta.roas)} do <b>${esc(worstCta.k)}</b> (${ganho}% melhor). Comece por: ${alvos.map(x=>'<b>'+esc(x.name)+'</b>').join(', ')} — juntos ${fmtMoney0(verba)} rodando no CTA pior.`);
        }
      }
      // 3. Levar ângulo vencedor para outro formato
      const imgs=rel.filter(x=>CA(x.name).kind==='image');
      if(imgs.length&&angRank.length){
        const angImg=new Set(imgs.map(x=>CA(x.name).angle).filter(Boolean));
        const falta=angRank.filter(x=>!angImg.has(x.k)).slice(0,2);
        if(falta.length) I.push(`<b>Teste os ângulos vencedores em imagem estática.</b> Suas imagens hoje só exploram ${[...angImg].map(x=>'"'+esc(x)+'"').join(' e ')||'um ângulo só'}. Os ângulos ${falta.map(x=>`<b>"${esc(x.k)}"</b> (ROAS ${fmtRoas(x.roas)})`).join(' e ')} <b>nunca foram testados em estático</b>. Crie 2 estáticos de cada.`);
      }
      // 4. Clonar a estrutura do vencedor
      const win=rel.filter(x=>x.front>=30&&x.roas!=null).sort((x,y)=>y.roas-x.roas)[0];
      if(win) I.push(`<b>Clone a estrutura do vencedor.</b> "${esc(win.name)}" é o melhor ROAS com volume (${fmtRoas(win.roas)}, ${fmtNum(win.front)} vendas, CPA ${win.cpa!=null?fmtMoney0(win.cpa):'—'}). Produza <b>3 variações trocando um elemento por vez</b> (só o gancho / só a prova / só o CTA) para isolar o que sustenta o resultado.`);
      // 5. Oportunidade x desconto (achado das imagens)
      I.push(`<b>Liderar com oportunidade, não com desconto.</b> Entre as imagens, as que colocam a <b>oportunidade/alinhamento</b> como herói ("a Amazon está me pagando", "bolsa empresarial") batem as que colocam o <b>preço</b> como herói ("de R$1.147 por R$37"). Pegue os criativos que gritam desconto e refaça a headline vendendo a <b>vaga/oportunidade</b>, deixando o preço como selo pequeno.`);
      // 6. Qualificar o lead (faixa)

// ── Comparativo temporal 1D / 2D / 3D / 5D ──────────────────────────────────
async function fetchComparativo(){
  S._compLoading=true; render();
  try{
    const today=brToday();
    const daysAgo = d => Math.round((new Date(today+'T00:00:00Z') - new Date(d+'T00:00:00Z'))/864e5);
    const accs=(S.accounts||[]);
    const usdRate=parseFloat(S.usdBrl)>0?parseFloat(S.usdBrl):5.40;
    const since=addDaysStr(today,-4), until=today;
    const camp={};
    // gasto diário (últimos 5 dias) por campanha
    for(const a of accs){
      const tok=getTokenById(a._tokenId); if(!tok) continue;
      let url=`${GQL}/${a.id}/insights?level=campaign&limit=500&time_increment=1&time_range=${encodeURIComponent(JSON.stringify({since,until}))}&fields=campaign_id,campaign_name,spend&access_token=${encodeURIComponent(tok)}`;
      let pages=0;
      try{
        while(url && pages<15){
          pages++;
          const j=await (await fetch(url)).json();
          if(j.error) break;
          for(const r of (j.data||[])){
            const id=r.campaign_id; if(!id) continue;
            const dA=daysAgo(r.date_start); if(dA<0||dA>4) continue;
            if(!camp[id]) camp[id]={name:r.campaign_name||id, s1:0,s2:0,s3:0,s5:0, r1:0,r2:0,r3:0,r5:0};
            const raw=parseFloat(r.spend)||0, sp=(a.currency==='USD'?raw*usdRate:raw), c=camp[id];
            if(dA<1)c.s1+=sp; if(dA<2)c.s2+=sp; if(dA<3)c.s3+=sp; if(dA<5)c.s5+=sp;
          }
          url=(j.paging&&j.paging.next)?j.paging.next:null;
        }
      }catch(e){}
    }
    // faturamento (Supabase) por janela móvel — 4 chamadas
    const at=s=>`${s}T00:00:00-03:00`;
    for(const [n,key] of [[1,'r1'],[2,'r2'],[3,'r3'],[5,'r5']]){
      try{
        const res=await fetch(`${S.sbUrl}/rest/v1/rpc/meta_revenue_by_ad`,{method:'POST',headers:{'Content-Type':'application/json','apikey':S.sbKey,'Authorization':'Bearer '+S.sbKey},body:JSON.stringify({p_since:at(addDaysStr(today,-(n-1))), p_until:at(addDaysStr(today,1))})});
        if(res.ok){ for(const r of (await res.json())){ const id=r.campaign_id; if(!id||!camp[id]) continue; camp[id][key]+=parseFloat(r.receita_bruta)||0; } }
      }catch(e){}
    }
    S._comp=camp;
  }catch(e){ alert('Erro no comparativo: '+e.message); }
  S._compLoading=false; render();
}
// Critério de corte/escala baseado SÓ no ROAS por janela (árvore definida com o Arthur)
// Escala olha só HOJE; corte/redução usa a cascata hoje → 3D → 5D.
function acaoSugerida(c, B, cpaAlvo){
  const roas=(s,r)=> s>0 ? r/s : null;
  const r1=roas(c.s1,c.r1), r3=roas(c.s3,c.r3), r5=roas(c.s5,c.r5);
  // ESCALA: olha só hoje. ROAS de hoje ≥ breakeven → +30%. Exige gasto mínimo hoje (evita ruído).
  if(r1!=null && r1>=B){
    if(c.s1 >= 0.5*cpaAlvo) return {a:'ESCALAR', cls:'bom', pct:1.3, why:'ROAS hoje '+fmtRoas(r1)+' ≥ '+fmtRoas(B)+' (escala olha só hoje)'};
    return {a:'AGUARDA', cls:'novo', why:'positiva hoje ('+fmtRoas(r1)+') mas gasto de hoje ainda baixo ('+fmtMoney0(c.s1)+')'};
  }
  // hoje negativa (ou sem gasto hoje)
  if(r3==null) return {a:'AGUARDA', cls:'novo', why:'sem dado no 3D para decidir'};
  if(r3>=B) return {a:'REDUZIR', cls:'observar', pct:0.7, why:'negativa hoje ('+fmtRoas(r1)+'), 3D no lucro ('+fmtRoas(r3)+') → reduzir 30%'};
  // hoje neg + 3D neg
  if(r5==null) return {a:'AGUARDA', cls:'novo', why:'sem dado no 5D para decidir'};
  if(r5>=B) return {a:'REDUZIR', cls:'observar', pct:0.7, why:'negativa hoje e 3D, mas 5D no lucro ('+fmtRoas(r5)+') → reduzir 30%'};
  return {a:'DESATIVAR', cls:'ruim', why:'negativa em hoje, 3D e 5D → desativar'};
}

async function apiPost(id, body, tok){
  const p=new URLSearchParams(body);
  const res=await fetch(`${GQL}/${id}?${p.toString()}&access_token=${encodeURIComponent(tok)}`, {method:'POST'});
  const j=await res.json();
  if(j.error) throw new Error('('+j.error.code+') '+j.error.message);
  return j;
}

// confirmada do CPM subir 16% depois de escalar a mesma campanha 4x em poucas horas)
const COOLDOWN_H = 6;
function lastActionFor(campaignId){
  if(!S._otim || !S._otim.length) return null;
  const evs=S._otim.filter(e=>String(e.campaign_id)===String(campaignId));
  if(!evs.length) return null;
  return evs.reduce((a,b)=> new Date(a.created_at) > new Date(b.created_at) ? a : b);
}
const hoursSince=iso=>(Date.now()-new Date(iso).getTime())/36e5;
const fmtHoras=h=> h<1 ? Math.round(h*60)+'min' : Math.round(h)+'h';
function jaFeitoRecente(id){ if(S._exec&&S._exec[id]) return true; const l=lastActionFor(id); return !!(l && hoursSince(l.created_at) < COOLDOWN_H); }
function acaoBody(id){
  const c=S._comp&&S._comp[id]; const d=(S.data||[]).find(r=>r.id===id);
  if(!c||!d) return null;
  const A=analyze(); const act=acaoSugerida({id,...c}, parseFloat(A.roasAlvo)||1, A.cpaAlvo||80);
  const daily=+(d.daily_budget||0), tok=getTokenById(d._tokenId);
  if(act.a==='DESATIVAR') return {act, body:{status:'PAUSED'}, resumo:'PAUSAR a campanha', tok, name:d.name, orcAntes:+(daily/100).toFixed(2), orcDepois:0};
  if((act.a==='ESCALAR'||act.a==='REDUZIR') && daily>0){ const novo=Math.round(daily*act.pct);
    return {act, body:{daily_budget:String(novo)}, resumo:(act.a==='ESCALAR'?'AUMENTAR':'REDUZIR')+' orçamento de R$ '+(daily/100).toFixed(2)+' para R$ '+(novo/100).toFixed(2), tok, name:d.name, orcAntes:+(daily/100).toFixed(2), orcDepois:+(novo/100).toFixed(2)}; }
  return null;
}
async function execAcao(id){
  const info=acaoBody(id);
  if(!info){ alert('Sem ação executável (campanha ABO com orçamento no conjunto, ou dado insuficiente).'); return; }
  if(!info.tok){ alert('Token da conta não encontrado.'); return; }
  if(!confirm('Confirmar: '+info.resumo+'?\n\n'+info.name)) return;
  try{ await apiPost(id, info.body, info.tok); S._exec=S._exec||{}; S._exec[id]=info.act.a; await logOtim(id, info.act.a, info.orcAntes, info.orcDepois); await refreshOtim(); render(); }
  catch(e){ alert('Erro ao executar: '+e.message); }
}
// Executa com percentual escolhido manualmente (seletor +30/+50/+100% no escalar, ou "manter reduzida" no lugar de pausar)
async function execCustom(id, tipoLabel, pct){
  const d=(S.data||[]).find(r=>r.id===id);
  if(!d){ alert('Campanha não encontrada.'); return; }
  const daily=+(d.daily_budget||0), tok=getTokenById(d._tokenId);
  if(!daily){ alert('Campanha ABO (orçamento no conjunto), não dá para ajustar por aqui.'); return; }
  if(!tok){ alert('Token da conta não encontrado.'); return; }
  const novo=Math.round(daily*pct);
  const pctTxt=(pct>=1?'+':'')+Math.round((pct-1)*100)+'%';
  const resumo=(pct>1?'AUMENTAR':'REDUZIR')+' orçamento de R$ '+(daily/100).toFixed(2)+' para R$ '+(novo/100).toFixed(2)+' ('+pctTxt+')';
  if(!confirm('Confirmar: '+resumo+'?\n\n'+d.name)) return;
  try{
    await apiPost(id, {daily_budget:String(novo)}, tok);
    S._exec=S._exec||{}; S._exec[id]=tipoLabel;
    await logOtim(id, tipoLabel, +(daily/100).toFixed(2), +(novo/100).toFixed(2));
    await refreshOtim(); render();

}
// ── Duplicar campanha (Graph API /copies) ───────────────────────────────────
// deep_copy=true leva conjuntos + anúncios juntos. A cópia nasce PAUSADA por padrão
// (status_option), para você revisar antes de subir — evita gastar sem querer.
async function duplicarCampanha(id, pct, ativar){
  const d=(S.data||[]).find(r=>r.id===id);
  if(!d) throw new Error('Campanha não encontrada.');
  const tok=getTokenById(d._tokenId);
  if(!tok) throw new Error('Token da conta não encontrado.');
  const hoje=new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  const body={ deep_copy:'true', status_option: ativar?'ACTIVE':'PAUSED',
               rename_options: JSON.stringify({rename_suffix:' - Cópia '+hoje}) };
  const r=await apiPost(id+'/copies', body, tok);
  const novoId=r.copied_campaign_id||r.id||null;
  const daily=+(d.daily_budget||0);
  let orcNovo=null;
  if(novoId && daily>0 && pct && pct!==1){
    orcNovo=Math.round(daily*pct);
    try{ await apiPost(novoId, {daily_budget:String(orcNovo)}, tok); }
    catch(e){ console.warn('cópia criada mas falhou ajustar orçamento', e.message); orcNovo=null; }
  }
  return {novoId, name:d.name, daily, orcNovo, ativar};
}
async function execDuplicar(id, pct, ativar){
  const d=(S.data||[]).find(r=>r.id===id);
  if(!d){ alert('Campanha não encontrada.'); return; }
  const daily=+(d.daily_budget||0);
  const pctTxt=(pct&&pct!==1)?((pct>1?'+':'')+Math.round((pct-1)*100)+'%'):'mesmo orçamento';
  const orcTxt=(daily>0&&pct&&pct!==1)?` — orçamento da cópia: R$ ${(daily/100).toFixed(2)} → R$ ${(Math.round(daily*pct)/100).toFixed(2)} (${pctTxt})`:(daily>0?` — orçamento da cópia: R$ ${(daily/100).toFixed(2)}`:'');
  if(!confirm(`Duplicar a campanha (com conjuntos e anúncios)?\n\n${d.name}\n\nA cópia vai nascer ${ativar?'ATIVA e já gastando':'PAUSADA (você revisa e sobe depois)'}${orcTxt}`)) return;
  try{
    const r=await duplicarCampanha(id, pct, ativar);
    S._exec=S._exec||{}; S._exec[id]='DUPLICAR';
    await logOtim(id, 'DUPLICAR', +(r.daily/100).toFixed(2), r.orcNovo!=null?+(r.orcNovo/100).toFixed(2):+(r.daily/100).toFixed(2));
    await refreshData();
    alert(`Cópia criada${r.ativar?' e ATIVA':' (PAUSADA)'}.\n\nID da nova campanha: ${r.novoId||'—'}\n\n${r.ativar?'':'Lembre de ativar no Meta quando quiser subir.'}`);
  }catch(e){ alert('Erro ao duplicar: '+e.message); }
}
async function execLote(tipo){
  const B=parseFloat(S.roasAlvo)||1; const A=analyze(); const cpaAlvo=A.cpaAlvo||80;
  const byId={}; (S.data||[]).forEach(r=>byId[r.id]=r);
  const ids=Object.entries(S._comp).map(([id,c])=>({id,...c})).filter(c=>matchFunnel(c.name)&&c.s5>0 && ((byId[c.id]||{}).effective_status==='ACTIVE'))
    .filter(c=>acaoSugerida(c,B,cpaAlvo).a===tipo && !jaFeitoRecente(c.id)).map(c=>c.id);
  if(!ids.length){ alert('Nada para executar.'); return; }
  const rot=tipo==='ESCALAR'?'ESCALAR +30%':tipo==='REDUZIR'?'REDUZIR −30%':'DESATIVAR';
  if(!confirm('Confirmar '+rot+' em '+ids.length+' campanha(s)? Isso aplica direto na conta.')) return;
  let ok=0, fail=0; const erros=[];
  for(const id of ids){
    const info=acaoBody(id); if(!info){ fail++; continue; }
    try{ await apiPost(id, info.body, info.tok); S._exec=S._exec||{}; S._exec[id]=info.act.a; await logOtim(id, info.act.a, info.orcAntes, info.orcDepois); ok++; }
    catch(e){ fail++; erros.push(id+': '+e.message); }
  }
  await refreshOtim();
  alert('Lote '+rot+': '+ok+' aplicada(s), '+fail+' falha(s).'+(erros.length?'\n\n'+erros.slice(0,6).join('\n'):''));
  render();
}

function intradayDate(){ const t=brToday(); if(S.period==='today') return t; if(S.period==='custom') return customRange().until; return addDaysStr(t,-1); }
async function fetchIntraday(){
  if(S._intradayLoading) return; S._intradayLoading=true; render();
  try{
    const today=intradayDate();
    const accs=(S.accounts||[]);
    const usdRate=parseFloat(S.usdBrl)>0?parseFloat(S.usdBrl):5.40;
    const spendH=new Array(24).fill(0);
    const since=addDaysStr(today,-1);
    for(const a of accs){
      const tok=getTokenById(a._tokenId); if(!tok) continue;
      const shift=BR_OFFSET-(a._tzOffset!=null?Number(a._tzOffset):BR_OFFSET);
      let url=`${GQL}/${a.id}/insights?`+[
        'level=campaign','limit=500',
        'breakdowns=hourly_stats_aggregated_by_advertiser_time_zone',
        'time_increment=1',
        'time_range='+encodeURIComponent(JSON.stringify({since, until:today})),
        'fields='+encodeURIComponent('spend,campaign_name,campaign_id'),
        'access_token='+encodeURIComponent(tok)
      ].join('&');
      let pages=0;
      while(url && pages<20){ pages++;
        const j=await (await fetch(url)).json(); if(j.error) break;
        for(const r of (j.data||[])){
          if(!matchFunnel(r.campaign_name)) continue;
          if(S.selCampaign && String(r.campaign_id)!==String(S.selCampaign)) continue;
          const hStr=r.hourly_stats_aggregated_by_advertiser_time_zone||'00';
          const hr=parseInt(hStr.slice(0,2),10)||0;
          const base=new Date(r.date_start+'T00:00:00Z'); base.setUTCHours(hr+shift);
          if(base.toISOString().slice(0,10)!==today) continue;
          const raw=parseFloat(r.spend)||0;
          spendH[base.getUTCHours()]+=(a.currency==='USD'?raw*usdRate:raw);
        }
        url=(j.paging&&j.paging.next)?j.paging.next:null;
      }
    }
    const revH=new Array(24).fill(0);
    try{
      const at=s=>`${s}T00:00:00-03:00`;
      const res=await fetch(`${S.sbUrl}/rest/v1/rpc/revenue_hourly`,{method:'POST',headers:{'Content-Type':'application/json','apikey':S.sbKey,'Authorization':'Bearer '+S.sbKey},body:JSON.stringify({p_since:at(today), p_until:at(addDaysStr(today,1)), p_funil: currentFunnel().match||'', p_campaign: S.selCampaign||null})});
      if(res.ok){ for(const row of await res.json()){ const h=+row.hora; if(h>=0&&h<24) revH[h]=parseFloat(row.receita)||0; } }
    }catch(e){}
    S._intraday={date:today, spendH, revH};
  }catch(e){ S._intraday={date:brToday(), spendH:new Array(24).fill(0), revH:new Array(24).fill(0), _error:e.message}; }
  S._intradayLoading=false; render();
}

function svgIntraday(sp, rv, events, fullDay){

  const x=h=> padL+(h/23)*plotW, y=v=> padT+plotH-(Math.max(0,v)/maxV)*plotH;
  const line=arr=>{ let d=''; for(let h=0;h<=lastH;h++){ d+=(h===0?'M':'L')+x(h).toFixed(1)+' '+y(arr[h]).toFixed(1); } return d; };
  let area='M'+x(0)+' '+y(0); for(let h=0;h<=lastH;h++) area+=' L'+x(h).toFixed(1)+' '+y(cr[h]).toFixed(1); area+=' L'+x(lastH).toFixed(1)+' '+y(0)+' Z';
  let grid=''; for(let i=0;i<=3;i++){ const v=maxV*i/3, yy=y(v); grid+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="#eee"/><text x="${padL-6}" y="${(yy+3).toFixed(1)}" font-size="9" text-anchor="end" fill="#aaa">${fmtMoney0(v)}</text>`; }
  let xl=''; for(let h=0;h<=23;h+=3) xl+=`<text x="${x(h).toFixed(1)}" y="${H-padB+16}" font-size="9" text-anchor="middle" fill="#aaa">${String(h).padStart(2,'0')}h</text>`;
  let slots=''; [9,12,15,18,21].forEach(s=>{ slots+=`<line x1="${x(s).toFixed(1)}" y1="${padT}" x2="${x(s).toFixed(1)}" y2="${padT+plotH}" stroke="#efeaff"/>`; });
  // ROAS acumulado anotado nos horários de análise
  let ann=''; [9,12,15,18,21].forEach(s=>{ if(s<=lastH && cs[s]>0){ const ro=cr[s]/cs[s]; ann+=`<text x="${x(s).toFixed(1)}" y="${(y(cr[s])-6).toFixed(1)}" font-size="9" text-anchor="middle" fill="${ro>=1?'#137333':'#c5221f'}" font-weight="700">${ro.toFixed(2)}x</text>`; } });
  // Marca as otimizações exatas: agrupa eventos a menos de 5min de distância num só marcador
  // (tooltip nativo no hover mostra hora, campanha, ação e orçamento antes→depois de cada uma)
  let marks='';
  const evSorted=[...(events||[])].map(e=>({...e, hf:Math.min(23.98,Math.max(0,e.hour+(e.minute||0)/60))})).sort((a,b)=>a.hf-b.hf);
  const groups=[];
  evSorted.forEach(e=>{ const last=groups[groups.length-1]; if(last && (e.hf-last.hf)*60<5) last.items.push(e); else groups.push({hf:e.hf, items:[e]}); });
  groups.forEach(g=>{
    const acoes=new Set(g.items.map(i=>i.acao));
    const dom = acoes.size===1 ? g.items[0].acao : 'MISTO';
    const col = dom==='ESCALAR'?'#137333':dom==='DESATIVAR'?'#c5221f':dom==='REDUZIR'?'#b08900':'#7b2ff7';
    const xx=x(g.hf).toFixed(1);
    const tip=g.items.map(i=>{
      const camp=i.campanha?shortName(i.campanha):'';
      if(i.acao==='DESATIVAR') return `${i.hhmm} PAUSAR ${camp} (R$ ${Math.round(i.orcAntes||0)} → 0)`;
      if(i.orcAntes!=null && i.orcDepois!=null) return `${i.hhmm} ${i.acao} ${camp} (R$ ${Math.round(i.orcAntes)} → R$ ${Math.round(i.orcDepois)})`;
      return `${i.hhmm} ${i.acao} ${camp}`;
    }).join('\n');
    const lbl = g.items.length>1 ? String(g.items.length) : (dom==='ESCALAR'?'↑':dom==='DESATIVAR'?'✕':dom==='REDUZIR'?'↓':'•');
    marks+=`<g style="cursor:default"><title>${esc(tip)}</title>
      <line x1="${xx}" y1="${padT}" x2="${xx}" y2="${padT+plotH}" stroke="${col}" stroke-width="1.5" stroke-dasharray="3 2" opacity=".6"/>
      <circle cx="${xx}" cy="${padT+7}" r="7" fill="${col}"/>
      <text x="${xx}" y="${padT+10.5}" font-size="9" text-anchor="middle" fill="#fff" font-weight="800">${lbl}</text>
    </g>`;
  });
  const roasNow=cs[lastH]>0?cr[lastH]/cs[lastH]:0;
  return `<svg viewBox="0 0 ${W} ${H}" style="max-width:100%;height:auto">
    ${grid}${slots}
    <path d="${area}" fill="#7b2ff7" opacity=".08"/>
    <path d="${line(cs)}" fill="none" stroke="#9aa0aa" stroke-width="2"/>
    <path d="${line(cr)}" fill="none" stroke="#7b2ff7" stroke-width="2.5"/>
    ${marks}${ann}${xl}
    <text x="${padL}" y="${padT+10}" font-size="12" fill="#7b2ff7" font-weight="700">Receita ${fmtMoney0(cr[lastH])}</text>
    <text x="${padL}" y="${padT+26}" font-size="12" fill="#9aa0aa" font-weight="700">Gasto ${fmtMoney0(cs[lastH])}</text>
    <text x="${W-padR}" y="${padT+10}" font-size="13" text-anchor="end" fill="${roasNow>=1?'#137333':'#c5221f'}" font-weight="800">ROAS do dia ${roasNow.toFixed(2)}x</text>
  </svg>`;
}
function renderAcompanhamento(A){
  const slotBar=`<div class="row" style="gap:6px;margin-bottom:10px"><span class="mini" style="font-weight:700">Horários de análise:</span>${SLOTS_ANALISE.map(s=>`<span class="chip ${nearestSlot()===s?'active':''}" style="cursor:default">${s}</span>`).join('')}</div>`;
  const activeCamps=(S.data||[]).filter(r=>(r.effective_status||'')==='ACTIVE' && (r._spendBRL||r.spend||0)>0 && matchFunnel(r.name)).sort((a,b)=>(b._spendBRL||b.spend||0)-(a._spendBRL||a.spend||0));
  // universo completo do funil, unindo S.data (período atual) + S._comp (comparativo 5d) — para achar por nome ou ID qualquer campanha que apareça em qualquer lugar
  const _uni={};
  (S.data||[]).forEach(r=>{ if(matchFunnel(r.name)) _uni[String(r.id)]={id:String(r.id),name:r.name,effective_status:r.effective_status,_spendBRL:(r._spendBRL||r.spend||0)}; });
  Object.entries(S._comp||{}).forEach(([id,c])=>{ if(!matchFunnel(c.name)) return; const k=String(id); const d=(S.data||[]).find(r=>String(r.id)===k)||{}; if(!_uni[k]) _uni[k]={id:k,name:c.name,effective_status:d.effective_status||'',_spendBRL:(d._spendBRL||d.spend||c.s1||0)}; });
  const allCamps=Object.values(_uni).sort((a,b)=>(b._spendBRL||0)-(a._spendBRL||0));
  const selName=(allCamps.find(c=>String(c.id)===S.selCampaign)||{}).name||'';
  const cq=(S._campSearch||'').toLowerCase();
  const campsFiltered=cq?allCamps.filter(c=>String(c.name).toLowerCase().includes(cq)||String(c.id).includes(cq)):allCamps;
  const statusTag=(c)=>{ return (c.effective_status||'')==='ACTIVE'||!c.effective_status?'':' [pausada]'; };
  const campSel=`<div class="row" style="gap:8px;margin-bottom:12px;flex-wrap:wrap"><span class="mini" style="font-weight:700">Campanha:</span>
    <input type="text" data-campsearch placeholder="Pesquisar por nome ou ID..." value="${esc(S._campSearch||'')}" oninput="setCampSearch(this.value)" style="padding:6px 8px;font-size:13px;border-radius:6px;border:1px solid #ddd;width:220px">
    <select onchange="setSelCampaign(this.value)" style="max-width:680px;flex:1;padding:6px 8px">
    <option value="">Todas do funil (${allCamps.length})</option>
    ${campsFiltered.map(c=>`<option value="${esc(String(c.id))}" ${S.selCampaign===String(c.id)?'selected':''}>${esc(c.name)}${statusTag(c)}</option>`).join('')}
  </select>${cq?`<span class="mini" style="color:#888">${campsFiltered.length} de ${allCamps.length}</span>`:''}${S.selCampaign||cq?`<button class="btn btn-gray btn-sm" onclick="S._campSearch='';setSelCampaign('')">limpar</button>`:''}</div>`;
  const head=`<h2>📈 Acompanhamento das otimizações <button class="btn btn-gray btn-sm" style="float:right;padding:4px 10px" onclick="reloadIntraday();reloadOtim()">↻ Atualizar</button></h2>`;
  // ── Gráfico do dia (sempre visível, auto-carregado) ──
  let intradayHtml='';
  if(S._intradayLoading || S._intraday==null){
    if(!S._intradayLoading && S.connected) setTimeout(()=>fetchIntraday(),40);
    intradayHtml=`<div class="empty"><span class="loading"></span> Montando o gráfico do dia…</div>`;
  } else {
    const evT=(S._otim||[]).filter(e=>{
        if(S.selCampaign) return String(e.campaign_id)===String(S.selCampaign); // curva de 1 campanha → só as otimizações dela
        return (!S.funnel||S.funnel==='ALL'||norm(e.funil||'')===norm(S.funnel));
      })
      .filter(e=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo'}).format(new Date(e.created_at))===S._intraday.date)
      .map(e=>{ const d=new Date(e.created_at);
        return { acao:e.acao,
          hour:+new Intl.DateTimeFormat('en-GB',{timeZone:'America/Sao_Paulo',hour:'2-digit',hour12:false}).format(d),
          minute:+new Intl.DateTimeFormat('en-GB',{timeZone:'America/Sao_Paulo',minute:'2-digit'}).format(d),
          hhmm:new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'}).format(d),
          orcAntes:e.orc_antes, orcDepois:e.orc_depois, campanha:e.campaign_name };
      });
    const has=S._intraday.spendH.some(v=>v>0)||S._intraday.revH.some(v=>v>0);
    const dLabel=S._intraday.date.split('-').reverse().slice(0,2).join('/');
    const fullDay=S._intraday.date!==brToday();
    const alvo = S.selCampaign ? esc(selName) : esc(currentFunnel().label);
    intradayHtml = has
      ? `<h3 style="margin:0 0 6px">Curva do dia (${dLabel}${fullDay?'':' · parcial, em andamento'}) · ${S.selCampaign?'📢 '+alvo:'funil '+alvo} <span class="mini" style="text-transform:none">gasto (cinza) vs receita (roxo) acumulados · ROAS anotado nos horários · 🟢 ↑ escalou · 🟡 ↓ reduziu · 🔴 ✕ desativou (passe o mouse para ver a ação exata)</span></h3>${svgIntraday(S._intraday.spendH,S._intraday.revH,evT,fullDay)}`
      : `<div class="empty">Ainda sem gasto/receita no período para ${S.selCampaign?'esta campanha':'o funil '+esc(currentFunnel().label)}.</div>`;
  }
  // ── Log das otimizações ──
  let logHtml='';
  const ev = (S._otim==null)? null : S._otim.filter(e=>!S.funnel||S.funnel==='ALL'||norm(e.funil||'')===norm(S.funnel));
  if(ev==null){ logHtml=`<hr><div class="mini" style="color:#888">Carregando log…</div>`; }
  else if(!ev.length){ logHtml=`<hr><div class="mini" style="color:#888">Nenhuma otimização registrada ainda neste funil. Cada clique em Executar entra aqui com o antes/depois.</div>`; }
  else {
    const rows=ev.map(e=>{ const c=(S._comp||{})[e.campaign_id]; const agora=(c&&c.s1>0)?+(c.r1/c.s1).toFixed(2):null; return {...e, agora}; });
    const grp=t=>{ const g=rows.filter(r=>r.acao===t && r.roas1!=null); const ga=g.filter(r=>r.agora!=null);
      return {n:g.length, antes:g.length?g.reduce((s,r)=>s+(+r.roas1||0),0)/g.length:0, agora:ga.length?ga.reduce((s,r)=>s+r.agora,0)/ga.length:0}; };
    const gEsc=grp('ESCALAR'), gRed=grp('REDUZIR'); const des=rows.filter(r=>r.acao==='DESATIVAR');
    const economia=des.reduce((s,r)=>s+(+r.orc_antes||0),0);
    const chart=(gEsc.n||gRed.n)? svgAntesDepois([{label:'Escaladas',n:gEsc.n,antes:gEsc.antes,agora:gEsc.agora,color:'#137333'},{label:'Reduzidas',n:gRed.n,antes:gRed.antes,agora:gRed.agora,color:'#b08900'}]) : '<div class="mini">Sem escalas/reduções ainda para o gráfico antes/depois.</div>';
    const fmtH=t=> new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    const badge=a=>`<span class="badge b-${a==='ESCALAR'?'bom':a==='DESATIVAR'?'ruim':'observar'}">${a}</span>`;
    const vd=r=>{ if(r.acao==='DESATIVAR') return '<span class="mini">pausada · economia R$ '+(+r.orc_antes||0).toFixed(0)+'/dia</span>';
      if(r.agora==null) return '<span class="mini">sem dado atual</span>';
      const d=r.agora-(+r.roas1||0); return d>=-0.001?`<span class="verdict-good">▲ +${d.toFixed(2)}</span>`:`<span class="verdict-bad">▼ ${d.toFixed(2)}</span>`; };
    logHtml=`<hr><h3 style="margin:2px 0 10px">Otimizações registradas · antes vs depois</h3>
      <div class="row" style="gap:12px;margin-bottom:12px">
        <div class="kpi" style="flex:1"><div class="k-l">Escaladas</div><div class="k-v">${gEsc.n}</div><div class="k-s">ROAS hoje ${gEsc.antes.toFixed(2)} → ${gEsc.agora.toFixed(2)}</div></div>
        <div class="kpi" style="flex:1"><div class="k-l">Reduzidas</div><div class="k-v">${gRed.n}</div><div class="k-s">ROAS hoje ${gRed.antes.toFixed(2)} → ${gRed.agora.toFixed(2)}</div></div>
        <div class="kpi danger" style="flex:1"><div class="k-l">Desativadas</div><div class="k-v">${des.length}</div><div class="k-s">economia R$ ${economia.toFixed(0)}/dia</div></div>
      </div>
      <div style="margin-bottom:14px">${chart}</div>
      <div class="tbl-wrap" style="max-height:340px"><table><thead><tr><th>Quando</th><th>Slot</th><th>Campanha</th><th>Ação</th><th class="num">Orç.</th><th class="num">ROAS hoje no ato</th><th class="num">ROAS hoje agora</th><th>Resultado</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td class="mini">${fmtH(r.created_at)}</td><td>${esc(r.slot||'')}</td><td>${esc(r.campaign_name)}</td><td>${badge(r.acao)}</td><td class="num">${r.acao==='DESATIVAR'?'R$ '+(+r.orc_antes||0).toFixed(0)+'→0':(r.orc_antes!=null?'R$ '+(+r.orc_antes).toFixed(0)+'→'+(+r.orc_depois).toFixed(0):'—')}</td><td class="num">${r.roas1!=null?(+r.roas1).toFixed(2)+'x':'—'}</td><td class="num">${r.agora!=null?r.agora.toFixed(2)+'x':'—'}</td><td>${vd(r)}</td></tr>`).join('')}
      </tbody></table></div>
      <div class="mini" style="margin-top:8px">Mostra o <b>ROAS do dia</b> (não mais 3 dias) para medir o impacto da otimização dentro do próprio dia. "No ato" = ROAS do dia no clique; "agora" = ROAS do dia atual (do comparativo). ▲ melhorou / ▼ piorou. Como o dia é parcial, o ROAS de hoje sobe ao longo do dia conforme as vendas caem.</div>`;
  }
  return `<div class="card">${head}${slotBar}${campSel}${intradayHtml}${logHtml}</div>`;
}

// ── Ações de UI ─────────────────────────────────────────────────────────────
function setPeriod(p){ S.period=p; S._directApi=null; S._sessaoApi=null; S._rcApi=null; S._intraday=null; S._funis=null; S._topAds=null; S._topPub=null; S._crossover=null; S._crossoverRate=null; S._crossoverTipos=null; S._crossoverCAC=null; S._pesquisa=null; saveState(); if(S.view!=='criativos'&&currentFunnel().sheet){ render(); } else { refreshData(); } }
function setCustomDate(which, value){
  if(!value) return;
  if(which==='since') S.customSince=value; else S.customUntil=value;
  if(!S.customSince) S.customSince=value;
  if(!S.customUntil) S.customUntil=value;
  if(S.customSince>S.customUntil){ const t=S.customSince; S.customSince=S.customUntil; S.customUntil=t; }
  S.period='custom'; S._intraday=null; S._funis=null; S._topAds=null; S._topPub=null; S._crossover=null; S._crossoverRate=null; S._crossoverTipos=null; S._crossoverCAC=null; S._pesquisa=null; saveState(); refreshData();
}
function setCfg(k,v){ S[k]=v; saveState(); render(); }

if(S.darkMode) document.body.classList.add('dark');
render();
</script>
