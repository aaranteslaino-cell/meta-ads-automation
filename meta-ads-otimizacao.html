<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Meta Ads — Otimização</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1c1e21;min-height:100vh}
.wrap{max-width:1400px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h1{color:#7b2ff7;font-size:22px;margin-bottom:2px}
h2{font-size:17px;margin-bottom:14px}
h3{font-size:14px;margin-bottom:10px;color:#444}
.sub{color:#888;font-size:13px}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-purple{background:#7b2ff7;color:#fff}.btn-purple:not(:disabled):hover{background:#6822d8}
.btn-gray{background:#e4e6eb;color:#1c1e21}.btn-gray:not(:disabled):hover{background:#d0d2d8}
label{display:block;font-size:12px;font-weight:700;color:#65676b;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
input,select{width:100%;padding:8px 11px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;background:#fff}
input:focus,select:focus{outline:none;border-color:#7b2ff7}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row > *{flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:#f0f2f5;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border:none;color:#1c1e21}
.chip:hover{background:#e4e6eb}
.chip.active{background:#7b2ff7;color:#fff}
.connected{display:flex;align-items:center;gap:6px;font-size:13px;color:#42b72a;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#42b72a;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid #eee;font-size:13px}
th{font-weight:700;font-size:11px;color:#65676b;text-transform:uppercase;letter-spacing:.3px;background:#f7f8fa;cursor:pointer;user-select:none;position:sticky;top:0}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.total{background:#f3eefe;font-weight:700}
.loading{display:inline-block;width:14px;height:14px;border:2px solid #ddd;border-top-color:#7b2ff7;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:40px;text-align:center;color:#888;font-style:italic}
.tbl-wrap{max-height:560px;overflow:auto;border-radius:8px;border:1px solid #eee}
.info-box{background:#e7f0fd;border-radius:8px;padding:10px 14px;font-size:13px;color:#1877f2}
.warn-box{background:#fef3e2;border-radius:8px;padding:10px 14px;font-size:13px;color:#c47a00}
.err-box{background:#fce8e6;border-radius:8px;padding:10px 14px;font-size:13px;color:#c5221f}
.token-item{display:flex;gap:8px;align-items:center;margin-bottom:6px;padding:6px 10px;background:#f7f8fa;border-radius:6px;font-size:13px}
.token-item .lbl{font-weight:600;color:#7b2ff7}
.token-item .id{color:#888;font-family:monospace;font-size:11px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:#faf9ff;border:1px solid #efeaff;border-radius:10px;padding:14px}
.kpi .k-l{font-size:11px;font-weight:700;color:#7a7a8c;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.kpi .k-v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:12px;color:#888;margin-top:3px}
.kpi.danger{background:#fff5f5;border-color:#ffdada}
.kpi.danger .k-v{color:#d32f2f}
.kpi.good{background:#f2fbf4;border-color:#cfeed6}
/* Colunas bom/ruim */
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.cols2{grid-template-columns:1fr}}
.lane h3{display:flex;align-items:center;gap:8px;font-size:15px}
.item{border-radius:10px;padding:11px 13px;margin-bottom:8px;border:1px solid #eee}
.item.bom{background:#f2fbf4;border-color:#cfeed6}
.item.ruim{background:#fff5f5;border-color:#ffdada}
.item.observar{background:#fffdf3;border-color:#f2eccf}
.item .i-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.item .i-name{font-weight:700;font-size:10.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.item .i-metric{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .i-reason{font-size:12px;color:#555;margin-top:4px}
.item .i-sub{font-size:11px;color:#8a8a8a;margin-top:3px;font-family:monospace}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.b-bom{background:#e6f4ea;color:#137333}
.b-ruim{background:#fce8e6;color:#c5221f}
.b-observar{background:#fef7e0;color:#a86b00}
.b-novo{background:#eef0f3;color:#65676b}
.verdict-good{color:#137333}.verdict-bad{color:#c5221f}
.act{background:#faf9ff;border-left:3px solid #7b2ff7;border-radius:6px;padding:10px 13px;margin-bottom:8px;font-size:13.5px;line-height:1.45}
.act b{color:#7b2ff7}
.mini{font-size:11px;color:#8a8a8a}
.pill{display:inline-block;padding:1px 7px;border-radius:8px;font-size:10px;font-weight:700;background:#eef0f3;color:#555;margin-left:5px}
.winner{color:#137333;font-weight:800}
.loser{color:#c5221f;font-weight:800}
details{margin-top:6px}
summary{cursor:pointer;font-weight:600;color:#7b2ff7;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Meta Ads — Otimização</h1>
    <p class="sub">Diagnóstico automático: o que escalar, o que cortar e leituras por conta, lance e oferta. Cruza gasto do Meta com receita real do Supabase.</p>
  </div>
  <div id="root"></div>
</div>

<script>
const GQL = 'https://graph.facebook.com/v21.0';
const SB_URL_DEFAULT = 'https://mnrnnmfaupvmjfgpzkou.supabase.co';
const SB_KEY_DEFAULT = 'sb_publishable_KraV-pqYINerxc0nCgdHaA_xHj7ew87';

// Funis do negócio — o match no nome da campanha ignora acento (TOMÉ = TOME)
const FUNNELS = [
  {key:'NATH',   label:'Nathalia', match:'NATH',   emoji:'👩'},
  {key:'TOME',   label:'Tomé',     match:'TOME',   emoji:'👨'},
  {key:'COELHO', label:'Coelho',   match:'COELHO', emoji:'🐰'},
  {key:'ALL',    label:'Todos',    match:'',       emoji:'🌐'}
];

// ── Estado ──────────────────────────────────────────────────────────────────
let S = loadState() || {};
S.tokens = Array.isArray(S.tokens) ? S.tokens : [];
S.connected = false;
S.accounts = [];
S.data = [];
S.refreshing = false;
S.lastRefresh = null;
if(!S.period) S.period = 'last_7d';
if(typeof S.nameContains !== 'string') S.nameContains = '';
// Funil selecionado (seletor no topo). Migra o filtro antigo (nameContains='NATH') para funil.
if(!S.funnel){
  const nc0=(S.nameContains||'').trim().toUpperCase().replace('É','E');
  S.funnel = (nc0==='TOME')?'TOME' : (nc0==='COELHO')?'COELHO' : 'NATH';
  if(['NATH','TOME','COELHO'].includes(nc0)) S.nameContains='';
}
if(typeof S.sbUrl !== 'string' || !S.sbUrl) S.sbUrl = SB_URL_DEFAULT;
if(typeof S.sbKey !== 'string' || !S.sbKey) S.sbKey = SB_KEY_DEFAULT;
if(S.cpaAlvo == null) S.cpaAlvo = '';       // vazio = usa CPA médio da carteira
if(S.roasAlvo == null || S.roasAlvo === '') S.roasAlvo = 1.0;
if(S.minSpend == null) S.minSpend = '';     // vazio = default por período
// Custo alvo por métrica (referência nov/2025–jan/2026, métricas de pixel do Meta). Editáveis e persistidos.
S.alvos = Object.assign({cpm:40, cpc:1.5, ctr:2.7, cpl:5, cic:22, tkm:100, cvt:60, ppc:1.5}, S.alvos||{});
S._rev = null;
S._comp = null;        // cache do comparativo 1D/2D/3D/5D
S._compLoading = false;

function loadState(){ try{ return JSON.parse(localStorage.getItem('mao_state')); }catch(e){ return null; } }
function saveState(){ try{ localStorage.setItem('mao_state', JSON.stringify({...S, data:[], accounts:[], _rev:null, refreshing:false})); }catch(e){} }

// Reaproveita tokens do monitor (mam_state) e da automação (maa_state)
function loadSharedTokens(){
  ['mam_state','maa_state'].forEach(key=>{
    try{
      const src = JSON.parse(localStorage.getItem(key));
      (src?.tokens||[]).forEach(t=>{
        if(t.token && !S.tokens.find(x=>x.token===t.token)) S.tokens.push({...t, id:t.id||Date.now()+Math.random()});
      });
    }catch(e){}
  });
  saveState();
}
loadSharedTokens();

// ── Helpers ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtMoney = (v)=> 'R$ '+(parseFloat(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtMoney0 = (v)=> 'R$ '+(parseFloat(v)||0).toLocaleString('pt-BR',{maximumFractionDigits:0});
const fmtNum = v => Math.round(parseFloat(v)||0).toLocaleString('pt-BR');
const fmtPct = v => (parseFloat(v)||0).toFixed(2)+'%';
const fmtRoas = r => (r==null) ? '—' : (parseFloat(r)||0).toFixed(2)+'x';
const roasColor = r => (r==null) ? '#888' : (r>=1.5?'#137333':r>=1?'#2e7d32':r>=0.7?'#b08900':'#d32f2f');
function getTokenById(id){ return S.tokens.find(t=>t.id===id)?.token || ''; }
// Funil: normaliza (sem acento, minúsculo) e casa nome da campanha com o funil + refino opcional
function norm(s){ return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function currentFunnel(){ return FUNNELS.find(f=>f.key===S.funnel) || FUNNELS[0]; }
function matchFunnel(name){
  const f=currentFunnel(), n=norm(name);
  if(f.match && !n.includes(norm(f.match))) return false;
  const refine=norm(S.nameContains).trim();
  if(refine && !n.includes(refine)) return false;
  return true;
}
function setFunnel(k){ S.funnel=k; saveState(); render(); }
// Métricas de eficiência acima (ou CTR abaixo) do custo alvo
function alvoBreaches(r){
  const a=S.alvos, out=[];
  if((r.cpm||0)>a.cpm) out.push('CPM '+fmtMoney0(r.cpm));
  if((r.cpc||0)>a.cpc) out.push('CPC '+fmtMoney(r.cpc));
  if((r.impressions||0)>0 && (r.ctr||0)<a.ctr) out.push('CTR '+fmtPct(r.ctr));
  if((r.cost_per_landing_page_view||0)>a.cpl) out.push('c/PV '+fmtMoney(r.cost_per_landing_page_view));
  if((r.cost_per_initiate_checkout||0)>a.cic) out.push('c/checkout '+fmtMoney(r.cost_per_initiate_checkout));
  return out;
}

// ── API ─────────────────────────────────────────────────────────────────────
async function api(path, params={}, token=null){
  let url = path.startsWith('http') ? path : GQL+path;
  const sep = url.includes('?') ? '&' : '?';
  url += sep+'access_token='+encodeURIComponent(token);
  Object.entries(params).forEach(([k,v])=>{ url += '&'+encodeURIComponent(k)+'='+encodeURIComponent(typeof v==='object'?JSON.stringify(v):v); });
  const res = await fetch(url);
  const json = await res.json();
  if(json.error){ const e=json.error; throw new Error(`(${e.code}${e.error_subcode?'/'+e.error_subcode:''}) ${e.message}`); }
  return json;
}

// ── Conectar ────────────────────────────────────────────────────────────────
async function connect(){
  if(!S.tokens.length){ alert('Nenhum token encontrado. Conecte no monitor/automação primeiro (os tokens são compartilhados).'); return; }
  const btn = $('btn-connect'); if(btn){ btn.disabled=true; btn.textContent='Conectando…'; }
  S.accounts = []; const errs=[];
  for(const tk of S.tokens){
    if(!tk.token) continue;
    try{
      const r = await api('/me/adaccounts',{fields:'id,name,account_id,currency,account_status,timezone_name,timezone_offset_hours_utc',limit:500}, tk.token);
      const accs = (r.data||[]).map(a=>({...a, _tokenId:tk.id, _tokenLabel:tk.label,
        _tzOffset:(a.timezone_offset_hours_utc!=null?Number(a.timezone_offset_hours_utc):null), _tzName:a.timezone_name}));
      S.accounts.push(...accs);
    }catch(e){ errs.push(`[${tk.label}] ${e.message}`); }
  }
  const seen=new Set(); S.accounts = S.accounts.filter(a=>{ if(seen.has(a.id)) return false; seen.add(a.id); return true; });
  if(!S.accounts.length){ if(btn){ btn.disabled=false; btn.textContent='Conectar'; } alert('Nenhuma conta encontrada.'+(errs.length?'\n\n'+errs.join('\n'):'')); return; }
  S.connected = true; render(); await refreshData();
}
function disconnect(){ S.connected=false; S.accounts=[]; S.data=[]; saveState(); render(); }

// ── Insights ────────────────────────────────────────────────────────────────
const INSIGHT_FIELDS = 'spend,impressions,clicks,ctr,cpc,cpm,reach,frequency,actions,cost_per_action_type';
function getActionValue(actions, type){ if(!Array.isArray(actions)) return 0; const a=actions.find(x=>x.action_type===type); return a?parseFloat(a.value)||0:0; }
const BR_OFFSET = -3;
const brToday = () => new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const addDaysStr = (s,days)=>{ const d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+days); return d.toISOString().slice(0,10); };
function brWindow(period){
  const today=brToday();
  if(period==='today') return {since:today,until:today};
  if(period==='yesterday'){ const y=addDaysStr(today,-1); return {since:y,until:y}; }
  const n=period==='last_3d'?3:period==='last_7d'?7:period==='last_14d'?14:period==='last_30d'?30:7;
  return {since:addDaysStr(today,-n),until:addDaysStr(today,-1)};
}
function periodDays(period){ return period==='today'||period==='yesterday'?1:(period==='last_3d'?3:period==='last_7d'?7:period==='last_14d'?14:period==='last_30d'?30:7); }

async function fetchInsights(parentId, level, tokenId, tzOffset){
  if(tzOffset!=null && Number(tzOffset)!==BR_OFFSET) return await fetchInsightsHourlyBRT(parentId, level, tokenId, Number(tzOffset));
  const tok=getTokenById(tokenId); if(!tok) throw new Error('Token não encontrado');
  const r = await api(`/${parentId}/insights`, {level, fields:`${INSIGHT_FIELDS},campaign_id,campaign_name`, date_preset:S.period, limit:500}, tok);
  return r.data||[];
}
async function fetchInsightsHourlyBRT(parentId, level, tokenId, tzOffset){
  const tok=getTokenById(tokenId); if(!tok) throw new Error('Token não encontrado');
  const win=brWindow(S.period); const shift=BR_OFFSET-tzOffset;
  const accSince=addDaysStr(win.since,-1), accUntil=addDaysStr(win.until,1);
  let url=`${GQL}/${parentId}/insights?`+[
    'level='+level,
    'fields='+encodeURIComponent('spend,impressions,clicks,actions,campaign_id,campaign_name'),
    'breakdowns=hourly_stats_aggregated_by_advertiser_time_zone',
    'time_increment=1',
    'time_range='+encodeURIComponent(JSON.stringify({since:accSince,until:accUntil})),
    'limit=500','access_token='+encodeURIComponent(tok)
  ].join('&');
  const acc={}; let pages=0;
  while(url && pages<60){
    pages++;
    const json=await (await fetch(url)).json();
    if(json.error) throw new Error(`(${json.error.code}) ${json.error.message}`);
    (json.data||[]).forEach(row=>{
      const hStr=row.hourly_stats_aggregated_by_advertiser_time_zone||'00';
      const hr=parseInt(hStr.slice(0,2),10)||0;
      const base=new Date(row.date_start+'T00:00:00Z'); base.setUTCHours(hr+shift);
      const brDate=base.toISOString().slice(0,10);
      if(brDate<win.since||brDate>win.until) return;
      const id=row.campaign_id; if(!id) return;
      if(!acc[id]) acc[id]={id,name:row.campaign_name||id,spend:0,impressions:0,clicks:0,lpv:0,ic:0};
      const a=acc[id];
      a.spend+=parseFloat(row.spend)||0; a.impressions+=parseInt(row.impressions)||0; a.clicks+=parseInt(row.clicks)||0;
      a.lpv+=getActionValue(row.actions,'landing_page_view');
      a.ic +=getActionValue(row.actions,'initiate_checkout')||getActionValue(row.actions,'offsite_conversion.fb_pixel_initiate_checkout');
    });
    url=(json.paging&&json.paging.next)?json.paging.next:null;
  }
  return Object.values(acc).map(a=>({
    spend:a.spend, impressions:a.impressions, clicks:a.clicks,
    ctr:a.impressions?(a.clicks/a.impressions*100):0, cpc:a.clicks?(a.spend/a.clicks):0, cpm:a.impressions?(a.spend/a.impressions*1000):0,
    actions:[{action_type:'landing_page_view',value:a.lpv},{action_type:'initiate_checkout',value:a.ic}],
    cost_per_action_type:[{action_type:'landing_page_view',value:a.lpv?a.spend/a.lpv:0},{action_type:'initiate_checkout',value:a.ic?a.spend/a.ic:0}],
    campaign_id:a.id, campaign_name:a.name
  }));
}
async function fetchEntityList(parentId, tokenId){
  const tok=getTokenById(tokenId);
  const r=await api(`/${parentId}/campaigns`, {fields:'id,name,status,effective_status,objective,bid_strategy,daily_budget,lifetime_budget,updated_time', limit:500}, tok);
  return r.data||[];
}
function mergeInsightsAndEntities(insights, entities){
  const byId={};
  entities.forEach(e=>{ byId[e.id]={...e, spend:0,impressions:0,clicks:0,ctr:0,cpc:0,cpm:0,landing_page_views:0,cost_per_landing_page_view:0,initiate_checkout:0,cost_per_initiate_checkout:0}; });
  insights.forEach(ins=>{
    const id=ins.campaign_id; if(!id) return;
    if(!byId[id]) byId[id]={id, name:ins.campaign_name||id, status:'?', effective_status:'?'};
    Object.assign(byId[id], {
      spend:parseFloat(ins.spend)||0, impressions:parseInt(ins.impressions)||0, clicks:parseInt(ins.clicks)||0,
      ctr:parseFloat(ins.ctr)||0, cpc:parseFloat(ins.cpc)||0, cpm:parseFloat(ins.cpm)||0,
      landing_page_views:getActionValue(ins.actions,'landing_page_view'),
      cost_per_landing_page_view:getActionValue(ins.cost_per_action_type,'landing_page_view'),
      initiate_checkout:getActionValue(ins.actions,'initiate_checkout')||getActionValue(ins.actions,'offsite_conversion.fb_pixel_initiate_checkout'),
      cost_per_initiate_checkout:getActionValue(ins.cost_per_action_type,'initiate_checkout')||getActionValue(ins.cost_per_action_type,'offsite_conversion.fb_pixel_initiate_checkout')
    });
  });
  return Object.values(byId);
}
async function fetchAllCampaigns(){
  const promises = S.accounts.map(async acc=>{
    try{
      const insights = await fetchInsights(acc.id,'campaign',acc._tokenId,acc._tzOffset);
      let entities=[]; try{ entities=await fetchEntityList(acc.id,acc._tokenId); }catch(e){}
      const merged = mergeInsightsAndEntities(insights, entities);
      merged.forEach(m=>{ m._accountId=acc.id; m._accountName=acc.name; m._currency=acc.currency; m._tokenId=acc._tokenId; });
      return merged;
    }catch(e){ return []; }
  });
  return (await Promise.all(promises)).flat();
}

// ── Receita (Supabase) ──────────────────────────────────────────────────────
function periodRange(period){
  const today=brToday(); const at=s=>`${s}T00:00:00-03:00`;
  if(period==='today') return {since:at(today),until:at(addDaysStr(today,1))};
  if(period==='yesterday') return {since:at(addDaysStr(today,-1)),until:at(today)};
  const n=periodDays(period);
  return {since:at(addDaysStr(today,-n)),until:at(today)};
}
async function fetchRevenue(){
  const {since,until}=periodRange(S.period);
  try{
    const res=await fetch(`${S.sbUrl}/rest/v1/rpc/meta_revenue_by_ad`,{method:'POST',headers:{'Content-Type':'application/json','apikey':S.sbKey,'Authorization':'Bearer '+S.sbKey},body:JSON.stringify({p_since:since,p_until:until})});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const rows=await res.json(); const byCampaign={};
    const add=(m,k,v)=>{ if(!k) return; if(!m[k]) m[k]={front:0,total:0,receita:0}; m[k].front+=v.front; m[k].total+=v.total; m[k].receita+=v.receita; };
    (rows||[]).forEach(r=>{ add(byCampaign, r.campaign_id, {front:parseInt(r.vendas_front)||0,total:parseInt(r.vendas_total)||0,receita:parseFloat(r.receita_bruta)||0}); });
    let offsite={front:0,total:0,receita:0};
    try{ const r2=await fetch(`${S.sbUrl}/rest/v1/rpc/meta_revenue_offsite`,{method:'POST',headers:{'Content-Type':'application/json','apikey':S.sbKey,'Authorization':'Bearer '+S.sbKey},body:JSON.stringify({p_since:since,p_until:until})}); if(r2.ok){ const o=(await r2.json())[0]||{}; offsite={front:parseInt(o.vendas_front)||0,total:parseInt(o.vendas_total)||0,receita:parseFloat(o.receita_bruta)||0}; } }catch(_){}
    return {byCampaign, offsite};
  }catch(e){ console.warn('receita falhou',e.message); return {byCampaign:{}, offsite:{front:0,total:0,receita:0}, _error:e.message}; }
}
function attachRevenue(rows){
  const map=(S._rev&&S._rev.byCampaign)||{};
  rows.forEach(r=>{
    const hit=map[String(r.id)];
    r._receita=hit?hit.receita:0; r._vendasFront=hit?hit.front:0; r._vendasTotal=hit?hit.total:0;
    const cur=r._currency||'BRL';
    r._roas=(cur==='BRL'&&r.spend>0)?(r._receita/r.spend):null;
    r._cpa=(r._vendasFront>0)?(r.spend/r._vendasFront):null;
    r._ticket=(r._vendasFront>0)?(r._receita/r._vendasFront):null;
  });
}

async function refreshData(){
  if(S.refreshing) return;
  S.refreshing=true; render();
  try{
    S._rev=await fetchRevenue();
    S.data=await fetchAllCampaigns();
    attachRevenue(S.data);
    S.lastRefresh=new Date();
  }catch(e){ alert('Erro: '+e.message); }
  finally{ S.refreshing=false; render(); }
}

// ── Tags derivadas do nome ──────────────────────────────────────────────────
function tagCA(r){ const m=(r.name||'').match(/\[CA\s*0*(\d+)\s*\]/i); return m?('CA '+String(m[1]).padStart(2,'0')):(r._accountName||'Outra'); }
function tagLance(r){ const m=(r.name||'').match(/CBO\s*(TRAD|CPA)/i); if(m) return 'CBO '+m[1].toUpperCase(); if(/\bABO\b/i.test(r.name||'')) return 'ABO'; if(r.daily_budget>0||r.lifetime_budget>0) return 'CBO'; return 'ABO'; }
function tagOferta(r){ const n=r.name||''; const d=(n.match(/(\d{2}\.\d{2})/)||[])[1]||'s/data'; const c=(n.match(/VSL\s*37\s*(QUIZ|LP)/i)||[])[1]; return d+(c?(' '+c.toUpperCase()):''); }
function tagEstrutura(r){ const m=(r.name||'').match(/1-(\d)-X/i); return m?('1-'+m[1]):'—'; }
function shortName(n){
  n=String(n||'');
  const ca=(n.match(/\[CA\s*0*(\d+)\s*\]/i)||[])[0]||'';
  const of=tagOferta({name:n});
  const la=tagLance({name:n});
  const es=tagEstrutura({name:n});
  let s=[of,la,es].filter(x=>x&&x!=='—').join(' ');
  if(ca) s=ca.replace(/[\[\]]/g,'')+' · '+s;
  return s||n.slice(0,60);
}

// ── Motor de análise ────────────────────────────────────────────────────────
function analyze(){
  const days=periodDays(S.period);
  // universo: BRL, ativa, com gasto, batendo o funil selecionado (+ refino opcional)
  let rows=(S.data||[]).filter(r=>{
    if((r._currency||'BRL')!=='BRL') return false;
    if((r.effective_status||'')!=='ACTIVE') return false;
    if((r.spend||0)<=0) return false;
    if(!matchFunnel(r.name)) return false;
    return true;
  });
  // totais
  const T={spend:0,receita:0,front:0,total:0,imp:0,clicks:0,ic:0,lpv:0};
  rows.forEach(r=>{ T.spend+=r.spend||0; T.receita+=r._receita||0; T.front+=r._vendasFront||0; T.total+=r._vendasTotal||0; T.imp+=r.impressions||0; T.clicks+=r.clicks||0; T.ic+=r.initiate_checkout||0; T.lpv+=r.landing_page_views||0; });
  const blendedCPA = T.front>0 ? T.spend/T.front : 0;
  const off=(S._rev&&S._rev.offsite)||{front:0,total:0,receita:0};

  // config
  const cpaAlvo = (parseFloat(S.cpaAlvo)>0) ? parseFloat(S.cpaAlvo) : (blendedCPA||9999);
  const roasAlvo = (parseFloat(S.roasAlvo)>0) ? parseFloat(S.roasAlvo) : 1.0;
  const defMin = ({1:60,3:150,7:250,14:450,30:800})[days] || 250;
  const minSpend = (parseFloat(S.minSpend)>=0 && S.minSpend!=='') ? parseFloat(S.minSpend) : defMin;

  // classifica — critério baseado SÓ no ROAS vs ROAS alvo (breakeven)
  rows.forEach(r=>{
    const spend=r.spend||0, roas=r._roas;
    let v,reason;
    if(spend<minSpend){ v='novo'; reason='gasto abaixo do mínimo para julgar ('+fmtMoney0(spend)+')'; }
    else if(roas==null){ v='novo'; reason='sem dado de receita'; }
    else if(roas>=roasAlvo){ v='bom'; reason='ROAS '+fmtRoas(roas)+' ≥ alvo '+fmtRoas(roasAlvo)+' — no lucro'; }
    else if(roas>=roasAlvo*0.85){ v='observar'; reason='ROAS '+fmtRoas(roas)+' — no limite do breakeven (alvo '+fmtRoas(roasAlvo)+')'; }
    else { v='ruim'; reason='ROAS '+fmtRoas(roas)+' < alvo '+fmtRoas(roasAlvo)+' — no prejuízo'; }
    r._verdict=v; r._reason=reason;
    r._breaches=alvoBreaches(r);
  });
  const foraAlvo=rows.filter(r=>r._breaches.length).length;

  const good=rows.filter(r=>r._verdict==='bom').sort((a,b)=>(b._roas||0)-(a._roas||0));
  const bad =rows.filter(r=>r._verdict==='ruim').sort((a,b)=>(b.spend||0)-(a.spend||0));
  const watch=rows.filter(r=>r._verdict==='observar').sort((a,b)=>(b.spend||0)-(a.spend||0));
  const gastoRuim=bad.reduce((s,r)=>s+(r.spend||0),0);

  // agregações
  const aggBy=(keyFn)=>{
    const m={};
    rows.forEach(r=>{ const k=keyFn(r); if(k==null) return; if(!m[k]) m[k]={key:k,spend:0,receita:0,front:0,total:0,imp:0,clicks:0,ic:0,n:0}; const a=m[k]; a.spend+=r.spend||0; a.receita+=r._receita||0; a.front+=r._vendasFront||0; a.total+=r._vendasTotal||0; a.imp+=r.impressions||0; a.clicks+=r.clicks||0; a.ic+=r.initiate_checkout||0; a.n++; });
    return Object.values(m).map(a=>({...a, roas:a.spend>0?a.receita/a.spend:null, cpa:a.front>0?a.spend/a.front:null, ctr:a.imp>0?a.clicks/a.imp*100:0, cpm:a.imp>0?a.spend/a.imp*1000:0, cpc:a.clicks>0?a.spend/a.clicks:0, cic:a.ic>0?a.spend/a.ic:0, ticket:a.front>0?a.receita/a.front:0})).sort((x,y)=>y.spend-x.spend);
  };
  const byConta=aggBy(tagCA);
  const byLance=aggBy(tagLance);
  const byOferta=aggBy(tagOferta);
  const byAccount=aggBy(r=>r._accountName||'(sem conta)');

  // fragmentação: grupos (conta+lance+oferta+estrutura) com >2 campanhas
  const fragMap={};
  rows.forEach(r=>{ const k=tagCA(r)+' | '+tagLance(r)+' | '+tagOferta(r)+' | '+tagEstrutura(r); if(!fragMap[k]) fragMap[k]={key:k,n:0,spend:0}; fragMap[k].n++; fragMap[k].spend+=r.spend||0; });
  const frag=Object.values(fragMap).filter(g=>g.n>=3).sort((a,b)=>b.n-a.n);

  // ações recomendadas
  const actions=[];
  if(bad.length){ actions.push(`<b>Pausar ${bad.length} campanha(s) ruim(ns)</b>, liberando ${fmtMoney0(gastoRuim)} no período (${fmtMoney0(gastoRuim/days)}/dia) para realocar nas vencedoras.`); }
  if(good.length){ actions.push(`<b>Escalar as ${good.length} melhores</b> (subir orçamento 20% a 30% aos poucos): ${good.slice(0,4).map(r=>esc(shortName(r.name))).join('; ')}.`); }
  // comparação de dimensões: aponta vencedor claro por CPA
  const cmp=(arr,rot)=>{
    const val=arr.filter(a=>a.roas!=null && a.front>=3);
    if(val.length<2) return;
    val.sort((a,b)=>b.roas-a.roas);
    const best=val[0], worst=val[val.length-1];
    if(best.roas >= worst.roas*1.5 && worst.roas < roasAlvo){
      actions.push(`Em <b>${rot}</b>: <span class="winner">${esc(best.key)}</span> (ROAS ${fmtRoas(best.roas)}) dá muito mais lucro que <span class="loser">${esc(worst.key)}</span> (ROAS ${fmtRoas(worst.roas)}). Migrar verba para ${esc(best.key)}.`);
    }
  };
  cmp(byConta,'conta');
  cmp(byLance,'estratégia de lance');
  cmp(byOferta,'oferta/criativo');
  if(frag.length){ const g=frag[0]; actions.push(`<b>Desfragmentar:</b> há grupos com muitas campanhas quase idênticas competindo entre si (ex: "${esc(g.key)}" com ${g.n} campanhas, ${fmtMoney0(g.spend)}). CBO rende mais com menos campanhas e mais orçamento por campanha.`); }

  return {rows, T, blendedCPA, cpaAlvo, roasAlvo, minSpend, days, good, bad, watch, gastoRuim, byConta, byLance, byOferta, byAccount, frag, actions, off, foraAlvo};
}

  const root=$('root');

  root.innerHTML = renderControls(A) + (S.refreshing && !S.data.length ? `<div class="card"><div class="empty"><span class="loading"></span> Buscando campanhas e receita…</div></div>` : renderDashboard(A));
}

function renderContas(A){

  if(!arr.length) return '';
  const rel=arr.filter(a=>a.roas!=null && a.front>=3).sort((x,y)=>y.roas-x.roas);
  const best=rel[0]?.key, worst=rel.length>1?rel[rel.length-1].key:null;
  return `<div class="card"><h2>🏦 Comparativo entre contas <span class="mini">agregado pela conta de anúncio real · ordenado por gasto</span></h2>
    <div class="tbl-wrap" style="max-height:none"><table><thead><tr>
      <th>Conta</th><th class="num">Camp.</th><th class="num">Gasto</th><th class="num">CTR</th><th class="num">CPM</th><th class="num">Custo/checkout</th><th class="num">CPA front</th><th class="num">Ticket</th><th class="num">Receita</th><th class="num">ROAS</th><th>Veredito</th>
    </tr></thead><tbody>
    ${arr.map(a=>`<tr>
      <td>${esc(a.key)}</td>
      <td class="num">${a.n}</td>
      <td class="num">${fmtMoney0(a.spend)}</td>
      <td class="num">${fmtPct(a.ctr)}</td>
      <td class="num">${fmtMoney0(a.cpm)}</td>
      <td class="num">${a.cic?fmtMoney0(a.cic):'—'}</td>
      <td class="num">${a.cpa!=null?fmtMoney0(a.cpa):'—'}</td>
      <td class="num">${a.front?fmtMoney0(a.ticket):'—'}</td>
      <td class="num">${fmtMoney0(a.receita)}</td>
      <td class="num" style="color:${roasColor(a.roas)};font-weight:700">${fmtRoas(a.roas)}</td>
      <td>${a.key===best?'<span class="badge b-bom">melhor</span>':a.key===worst?'<span class="badge b-ruim">pior</span>':'<span class="badge b-observar">média</span>'}</td>
    </tr>`).join('')}
    </tbody></table></div>
    <div class="mini" style="margin-top:8px">Melhor/pior por ROAS entre contas com ≥3 vendas front. Faturamento inclui front + order bump + upsell + downsell (atribuídos pela UTM). Use para decidir onde concentrar ou tirar verba.</div>
  </div>`;
}
function renderActions(A){
  if(!A.actions.length) return '';
  return `<div class="card"><h2>💡 Ações recomendadas</h2>${A.actions.map(a=>`<div class="act">${a}</div>`).join('')}

}

  const rel=arr.filter(a=>a.cpa!=null && a.front>=3).sort((a,b)=>a.cpa-b.cpa);
  const best=rel[0]?.key, worst=rel.length>1?rel[rel.length-1].key:null;
  return `<div style="margin-bottom:18px">
    <h3>${title}${note?` <span class="mini">${note}</span>`:''}</h3>
    <div class="tbl-wrap" style="max-height:none">

      <th>Segmento</th><th class="num">Campanhas</th><th class="num">Gasto</th><th class="num">Front</th><th class="num">CPA</th><th class="num">Receita</th><th class="num">ROAS</th><th class="num">CTR</th>
    </tr></thead><tbody>
    ${arr.map(a=>`<tr>
      <td>${esc(a.key)} ${a.key===best?'<span class="badge b-bom">melhor</span>':a.key===worst?'<span class="badge b-ruim">pior</span>':''}</td>
      <td class="num">${a.n}</td>

      <td class="num" style="color:${roasColor(a.roas)};font-weight:700">${fmtRoas(a.roas)}</td>
      <td class="num">${fmtPct(a.ctr)}</td>

function renderDimensions(A){
  let fragHtml='';
  if(A.frag.length){
    fragHtml=`<h3>🧩 Fragmentação <span class="mini">grupos com 3+ campanhas quase idênticas competindo</span></h3>
      <div class="tbl-wrap" style="max-height:none;margin-bottom:6px"><table><thead><tr><th>Grupo (conta · lance · oferta · estrutura)</th><th class="num">Campanhas</th><th class="num">Gasto</th></tr></thead><tbody>
      ${A.frag.map(g=>`<tr><td>${esc(g.key)}</td><td class="num">${g.n}</td><td class="num">${fmtMoney0(g.spend)}</td></tr>`).join('')}

  const rows=[...A.rows].sort((a,b)=>(b.spend||0)-(a.spend||0));
  const badge=v=>`<span class="badge b-${v}">${v==='bom'?'escalar':v==='ruim'?'cortar':v==='observar'?'observar':'novo'}</span>`;

    <div class="tbl-wrap"><table><thead><tr>

    </tr></thead><tbody>
    ${rows.map(r=>`<tr>
      <td>${badge(r._verdict)}</td>

      <td>${esc(r.name)}<div class="mini" style="font-family:monospace">${esc(String(r.id))}</div></td>

    </tr>`).join('')}

  </div>`;
}

// ── Comparativo temporal 1D / 2D / 3D / 5D ──────────────────────────────────
async function fetchComparativo(){
  S._compLoading=true; render();
  try{
    const today=brToday();
    const daysAgo = d => Math.round((new Date(today+'T00:00:00Z') - new Date(d+'T00:00:00Z'))/864e5);
    const accs=(S.accounts||[]).filter(a=>a.currency==='BRL');
    const since=addDaysStr(today,-4), until=today;
    const camp={};
    // gasto diário (últimos 5 dias) por campanha
    for(const a of accs){
      const tok=getTokenById(a._tokenId); if(!tok) continue;
      let url=`${GQL}/${a.id}/insights?level=campaign&limit=500&time_increment=1&time_range=${encodeURIComponent(JSON.stringify({since,until}))}&fields=campaign_id,campaign_name,spend&access_token=${encodeURIComponent(tok)}`;
      let pages=0;
      try{
        while(url && pages<15){
          pages++;
          const j=await (await fetch(url)).json();
          if(j.error) break;
          for(const r of (j.data||[])){
            const id=r.campaign_id; if(!id) continue;
            const dA=daysAgo(r.date_start); if(dA<0||dA>4) continue;
            if(!camp[id]) camp[id]={name:r.campaign_name||id, s1:0,s2:0,s3:0,s5:0, r1:0,r2:0,r3:0,r5:0};
            const sp=parseFloat(r.spend)||0, c=camp[id];
            if(dA<1)c.s1+=sp; if(dA<2)c.s2+=sp; if(dA<3)c.s3+=sp; if(dA<5)c.s5+=sp;
          }
          url=(j.paging&&j.paging.next)?j.paging.next:null;
        }
      }catch(e){}
    }
    // faturamento (Supabase) por janela móvel — 4 chamadas
    const at=s=>`${s}T00:00:00-03:00`;
    for(const [n,key] of [[1,'r1'],[2,'r2'],[3,'r3'],[5,'r5']]){
      try{
        const res=await fetch(`${S.sbUrl}/rest/v1/rpc/meta_revenue_by_ad`,{method:'POST',headers:{'Content-Type':'application/json','apikey':S.sbKey,'Authorization':'Bearer '+S.sbKey},body:JSON.stringify({p_since:at(addDaysStr(today,-(n-1))), p_until:at(addDaysStr(today,1))})});
        if(res.ok){ for(const r of (await res.json())){ const id=r.campaign_id; if(!id||!camp[id]) continue; camp[id][key]+=parseFloat(r.receita_bruta)||0; } }
      }catch(e){}
    }
    S._comp=camp;
  }catch(e){ alert('Erro no comparativo: '+e.message); }
  S._compLoading=false; render();
}
function renderComparativoCard(A){
  if(S._compLoading) return `<div class="card"><div class="empty"><span class="loading"></span> Carregando comparativo 1D/2D/3D/5D…</div></div>`;
  if(!S._comp) return `<div class="card"><h2>📊 Comparativo temporal 1D / 2D / 3D / 5D</h2>
    <p class="sub" style="margin-bottom:10px">Gasto, faturamento e lucro de cada campanha em janelas móveis (hoje, 2, 3 e 5 dias) para comparar tendência e decidir. Puxa 5 dias diários do Meta + receita por janela do Supabase.</p>
    <button class="btn btn-purple" onclick="fetchComparativo()">Carregar comparativo</button></div>`;
  let rows=Object.entries(S._comp).map(([id,c])=>({id,...c})).filter(c=>matchFunnel(c.name) && c.s5>0).sort((a,b)=>b.s5-a.s5);
  const cell=(g,r)=>{ const l=r-g, col=l>0?'#137333':l<0?'#c5221f':'#888', bg=l>0?'#eafaef':l<0?'#fdeeee':'transparent';
    return `<td class="num">${fmtMoney0(g)}</td><td class="num">${fmtMoney0(r)}</td><td class="num" style="color:${col};background:${bg};font-weight:700">${fmtMoney0(l)}</td>`; };
  return `<div class="card"><h2>📊 Comparativo temporal 1D / 2D / 3D / 5D
      <button class="btn btn-gray btn-sm" style="float:right;padding:4px 10px" onclick="fetchComparativo()">↻ Atualizar</button></h2>
    <div class="tbl-wrap"><table><thead>
      <tr><th rowspan="2">Campanha (${rows.length})</th><th colspan="3" style="text-align:center;border-left:2px solid #e6e0f5">1D (hoje)</th><th colspan="3" style="text-align:center;border-left:2px solid #e6e0f5">2D</th><th colspan="3" style="text-align:center;border-left:2px solid #e6e0f5">3D</th><th colspan="3" style="text-align:center;border-left:2px solid #e6e0f5">5D</th></tr>
      <tr>${['1D','2D','3D','5D'].map(()=>'<th class="num" style="border-left:2px solid #e6e0f5">Gasto</th><th class="num">Fat</th><th class="num">Lucro</th>').join('')}</tr>
    </thead><tbody>
    ${rows.map(c=>`<tr><td style="max-width:340px">${esc(c.name)}<div class="mini" style="font-family:monospace">${esc(String(c.id))}</div></td>${cell(c.s1,c.r1)}${cell(c.s2,c.r2)}${cell(c.s3,c.r3)}${cell(c.s5,c.r5)}</tr>`).join('')}
    </tbody></table></div>
    <div class="mini" style="margin-top:8px">Janelas móveis incluindo hoje (2D = ontem + hoje, etc). Lucro = faturamento − gasto. Faturamento é a receita real atribuída pela UTM e inclui front + order bump + upsell + downsell. Vendas sem UTM do meta não entram aqui (aparecem em Outras fontes). Serve para comparar a tendência entre janelas.</div>
  </div>`;
}
