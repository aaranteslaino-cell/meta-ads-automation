<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Meta Ads — Otimização</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1c1e21;min-height:100vh}
.wrap{max-width:1400px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h1{color:#7b2ff7;font-size:22px;margin-bottom:2px}
h2{font-size:17px;margin-bottom:14px}
h3{font-size:14px;margin-bottom:10px;color:#444}
.sub{color:#888;font-size:13px}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-purple{background:#7b2ff7;color:#fff}.btn-purple:not(:disabled):hover{background:#6822d8}
.btn-gray{background:#e4e6eb;color:#1c1e21}.btn-gray:not(:disabled):hover{background:#d0d2d8}
label{display:block;font-size:12px;font-weight:700;color:#65676b;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
input,select{width:100%;padding:8px 11px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;background:#fff}
input:focus,select:focus{outline:none;border-color:#7b2ff7}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row > *{flex:0 0 auto}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:#f0f2f5;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border:none;color:#1c1e21}
.chip:hover{background:#e4e6eb}
.chip.active{background:#7b2ff7;color:#fff}
.connected{display:flex;align-items:center;gap:6px;font-size:13px;color:#42b72a;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#42b72a;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid #eee;font-size:13px}
th{font-weight:700;font-size:11px;color:#65676b;text-transform:uppercase;letter-spacing:.3px;background:#f7f8fa;cursor:pointer;user-select:none;position:sticky;top:0}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.total{background:#f3eefe;font-weight:700}
.loading{display:inline-block;width:14px;height:14px;border:2px solid #ddd;border-top-color:#7b2ff7;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:40px;text-align:center;color:#888;font-style:italic}
.tbl-wrap{max-height:560px;overflow:auto;border-radius:8px;border:1px solid #eee}
.info-box{background:#e7f0fd;border-radius:8px;padding:10px 14px;font-size:13px;color:#1877f2}
.warn-box{background:#fef3e2;border-radius:8px;padding:10px 14px;font-size:13px;color:#c47a00}
.err-box{background:#fce8e6;border-radius:8px;padding:10px 14px;font-size:13px;color:#c5221f}
.token-item{display:flex;gap:8px;align-items:center;margin-bottom:6px;padding:6px 10px;background:#f7f8fa;border-radius:6px;font-size:13px}
.token-item .lbl{font-weight:600;color:#7b2ff7}
.token-item .id{color:#888;font-family:monospace;font-size:11px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:#faf9ff;border:1px solid #efeaff;border-radius:10px;padding:14px}
.kpi .k-l{font-size:11px;font-weight:700;color:#7a7a8c;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.kpi .k-v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:12px;color:#888;margin-top:3px}
.kpi.danger{background:#fff5f5;border-color:#ffdada}
.kpi.danger .k-v{color:#d32f2f}
.kpi.good{background:#f2fbf4;border-color:#cfeed6}
/* Colunas bom/ruim */
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.cols2{grid-template-columns:1fr}}
.lane h3{display:flex;align-items:center;gap:8px;font-size:15px}
.item{border-radius:10px;padding:11px 13px;margin-bottom:8px;border:1px solid #eee}
.item.bom{background:#f2fbf4;border-color:#cfeed6}
.item.ruim{background:#fff5f5;border-color:#ffdada}
.item.observar{background:#fffdf3;border-color:#f2eccf}
.item .i-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.item .i-name{font-weight:700;font-size:10.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.item .i-metric{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .i-reason{font-size:12px;color:#555;margin-top:4px}
.item .i-sub{font-size:11px;color:#8a8a8a;margin-top:3px;font-family:monospace}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.3px}
.b-bom{background:#e6f4ea;color:#137333}
.b-ruim{background:#fce8e6;color:#c5221f}
.b-observar{background:#fef7e0;color:#a86b00}
.b-novo{background:#eef0f3;color:#65676b}
.verdict-good{color:#137333}.verdict-bad{color:#c5221f}
.act{background:#faf9ff;border-left:3px solid #7b2ff7;border-radius:6px;padding:10px 13px;margin-bottom:8px;font-size:13.5px;line-height:1.45}
.act b{color:#7b2ff7}
.mini{font-size:11px;color:#8a8a8a}
.pill{display:inline-block;padding:1px 7px;border-radius:8px;font-size:10px;font-weight:700;background:#eef0f3;color:#555;margin-left:5px}
.winner{color:#137333;font-weight:800}
.loser{color:#c5221f;font-weight:800}
details{margin-top:6px}
summary{cursor:pointer;font-weight:600;color:#7b2ff7;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Meta Ads — Otimização</h1>
    <p class="sub">Diagnóstico automático: o que escalar, o que cortar e leituras por conta, lance e oferta. Cruza gasto do Meta com receita real do Supabase.</p>
  </div>
  <div id="root"></div>
</div>

<script>
const GQL = 'https://graph.facebook.com/v21.0';
const SB_URL_DEFAULT = 'https://mnrnnmfaupvmjfgpzkou.supabase.co';
const SB_KEY_DEFAULT = 'sb_publishable_KraV-pqYINerxc0nCgdHaA_xHj7ew87';

// Funis do negócio — o match no nome da campanha ignora acento (TOMÉ = TOME)
const FUNNELS = [
  {key:'NATH',    label:'Nathalia', match:'NATH',     emoji:'👩'},
  {key:'TOME',    label:'Tomé',     match:'TOME',     emoji:'👨'},
  {key:'COELHO',  label:'Coelho',   match:'COELHO',   emoji:'🐰'},
  {key:'BACKEND', label:'Backend',  match:'mentoria', emoji:'💼', backend:true}, // Consultorias & Mentorias (sem mídia paga)
  {key:'ALL',     label:'Todos',    match:'',         emoji:'🌐'}
];

// ── Estado ──────────────────────────────────────────────────────────────────
let S = loadState() || {};
S.tokens = Array.isArray(S.tokens) ? S.tokens : [];
S.connected = false;
S.accounts = [];
S.data = [];
S.refreshing = false;
S.lastRefresh = null;
if(!S.period) S.period = 'last_7d';
if(typeof S.customSince!=='string') S.customSince='';   // YYYY-MM-DD (BRT) quando período='custom'
if(typeof S.customUntil!=='string') S.customUntil='';
if(typeof S.selCampaign!=='string') S.selCampaign='';   // campanha selecionada p/ curva do dia individual
if(typeof S.nameContains !== 'string') S.nameContains = '';
// Funil selecionado (seletor no topo). Migra o filtro antigo (nameContains='NATH') para funil.
if(!S.funnel){
  const nc0=(S.nameContains||'').trim().toUpperCase().replace('É','E');
  S.funnel = (nc0==='TOME')?'TOME' : (nc0==='COELHO')?'COELHO' : 'NATH';
  if(['NATH','TOME','COELHO'].includes(nc0)) S.nameContains='';
}
if(typeof S.sbUrl !== 'string' || !S.sbUrl) S.sbUrl = SB_URL_DEFAULT;
if(typeof S.sbKey !== 'string' || !S.sbKey) S.sbKey = SB_KEY_DEFAULT;
if(S.cpaAlvo == null) S.cpaAlvo = '';       // vazio = usa CPA médio da carteira
if(S.roasAlvo == null || S.roasAlvo === '') S.roasAlvo = 1.0;
if(S.minSpend == null) S.minSpend = '';     // vazio = default por período
// Custo alvo por métrica (referência nov/2025–jan/2026, métricas de pixel do Meta). Editáveis e persistidos.
S.alvos = Object.assign({cpm:40, cpc:1.5, ctr:2.7, cpl:5, cic:22, tkm:100, cvt:60, ppc:1.5}, S.alvos||{});
S._rev = null;
S._comp = null;        // cache do comparativo 1D/2D/3D/5D
S._compLoading = false;
S._exec = {};          // marca campanhas já executadas nesta sessão (não persiste)
S._otim = null;        // log de otimizações (Supabase)
S._intraday = null;    // curva do dia (gasto/receita por hora)
S._intradayLoading = false;
S._funis = null;       // funis de checkout + produtos (conversão)
S._funisLoading = false;
S._topAds = null;      // melhores anúncios ativos
S._topAdsLoading = false;
if(typeof S.topAdsSort!=='string') S.topAdsSort='roas'; // critério de ordenação dos top anúncios
S._topPub = null;      // melhores públicos ativos
S._topPubLoading = false;
if(typeof S.backendKeyword!=='string' || !S.backendKeyword) S.backendKeyword='mentoria'; // palavra-chave do backend (organização Mentoria e Consultorias)
S._crossover = null;      // compradores backend + origem no front (Supabase, sempre visível, independe da organização selecionada)
S._crossoverRate = null;  // taxa de conversão geral front→backend (histórico completo)
S._crossoverTipos = null; // breakdown por tipo (Mentoria x Consultoria): taxa, receita, ticket
S._crossoverLoading = false;
S._crossoverCAC = null;   // custo real (gasto Meta) por campanha de origem, carregado sob demanda
S._crossoverCACLoading = false;
S._pesquisa = null;       // painel da pesquisa de onboarding cruzada com compradores (funil Nathalia)
S._pesquisaLoading = false;

function loadState(){ try{ return JSON.parse(localStorage.getItem('mao_state')); }catch(e){ return null; } }
function saveState(){ try{ localStorage.setItem('mao_state', JSON.stringify({...S, data:[], accounts:[], _rev:null, _comp:null, _exec:{}, _otim:null, _intraday:null, _funis:null, _topAds:null, _topPub:null, _crossover:null, _crossoverRate:null, _crossoverTipos:null, _crossoverCAC:null, _pesquisa:null, refreshing:false})); }catch(e){} }

// Reaproveita tokens do monitor (mam_state) e da automação (maa_state)
function loadSharedTokens(){
  ['mam_state','maa_state'].forEach(key=>{
    try{
      const src = JSON.parse(localStorage.getItem(key));
      (src?.tokens||[]).forEach(t=>{
        if(t.token && !S.tokens.find(x=>x.token===t.token)) S.tokens.push({...t, id:t.id||Date.now()+Math.random()});
      });
    }catch(e){}
  });
  saveState();
}
loadSharedTokens();

// ── Helpers ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtMoney = (v)=> 'R$ '+(parseFloat(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtMoney0 = (v)=> 'R$ '+(parseFloat(v)||0).toLocaleString('pt-BR',{maximumFractionDigits:0});
const fmtNum = v => Math.round(parseFloat(v)||0).toLocaleString('pt-BR');
const fmtPct = v => (parseFloat(v)||0).toFixed(2)+'%';
const fmtRoas = r => (r==null) ? '—' : (parseFloat(r)||0).toFixed(2)+'x';
const roasColor = r => (r==null) ? '#888' : (r>=1.5?'#137333':r>=1?'#2e7d32':r>=0.7?'#b08900':'#d32f2f');
function getTokenById(id){ return S.tokens.find(t=>t.id===id)?.token || ''; }
// Funil: normaliza (sem acento, minúsculo) e casa nome da campanha com o funil + refino opcional
function norm(s){ return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function currentFunnel(){ return FUNNELS.find(f=>f.key===S.funnel) || FUNNELS[0]; }
function matchFunnel(name){
  const f=currentFunnel(), n=norm(name);
  if(f.match && !n.includes(norm(f.match))) return false;
  const refine=norm(S.nameContains).trim();
  if(refine && !n.includes(refine)) return false;
  return true;
}
function setFunnel(k){ S.funnel=k; S.selCampaign=''; S._intraday=null; S._funis=null; S._topAds=null; S._topPub=null; saveState(); render(); }
function setSelCampaign(id){ S.selCampaign=id||''; S._intraday=null; saveState(); render(); }
// Métricas de eficiência acima (ou CTR abaixo) do custo alvo
function alvoBreaches(r){
  const a=S.alvos, out=[];
  if((r.cpm||0)>a.cpm) out.push('CPM '+fmtMoney0(r.cpm));
  if((r.cpc||0)>a.cpc) out.push('CPC '+fmtMoney(r.cpc));
  if((r.impressions||0)>0 && (r.ctr||0)<a.ctr) out.push('CTR '+fmtPct(r.ctr));
  if((r.cost_per_landing_page_view||0)>a.cpl) out.push('c/PV '+fmtMoney(r.cost_per_landing_page_view));
  if((r.cost_per_initiate_checkout||0)>a.cic) out.push('c/checkout '+fmtMoney(r.cost_per_initiate_checkout));
  return out;
}

// ── API ─────────────────────────────────────────────────────────────────────
async function api(path, params={}, token=null){
  let url = path.startsWith('http') ? path : GQL+path;
  const sep = url.includes('?') ? '&' : '?';
  url += sep+'access_token='+encodeURIComponent(token);
  Object.entries(params).forEach(([k,v])=>{ url += '&'+encodeURIComponent(k)+'='+encodeURIComponent(typeof v==='object'?JSON.stringify(v):v); });
  const res = await fetch(url);
  const json = await res.json();
  if(json.error){ const e=json.error; throw new Error(`(${e.code}${e.error_subcode?'/'+e.error_subcode:''}) ${e.message}`); }
  return json;
}

// ── Conectar ────────────────────────────────────────────────────────────────
async function connect(){
  if(!S.tokens.length){ alert('Nenhum token encontrado. Conecte no monitor/automação primeiro (os tokens são compartilhados).'); return; }
  const btn = $('btn-connect'); if(btn){ btn.disabled=true; btn.textContent='Conectando…'; }
  S.accounts = []; const errs=[];
  for(const tk of S.tokens){
    if(!tk.token) continue;
    try{
      const r = await api('/me/adaccounts',{fields:'id,name,account_id,currency,account_status,timezone_name,timezone_offset_hours_utc',limit:500}, tk.token);
      const accs = (r.data||[]).map(a=>({...a, _tokenId:tk.id, _tokenLabel:tk.label,
        _tzOffset:(a.timezone_offset_hours_utc!=null?Number(a.timezone_offset_hours_utc):null), _tzName:a.timezone_name}));
      S.accounts.push(...accs);
    }catch(e){ errs.push(`[${tk.label}] ${e.message}`); }
  }
  const seen=new Set(); S.accounts = S.accounts.filter(a=>{ if(seen.has(a.id)) return false; seen.add(a.id); return true; });
  if(!S.accounts.length){ if(btn){ btn.disabled=false; btn.textContent='Conectar'; } alert('Nenhuma conta encontrada.'+(errs.length?'\n\n'+errs.join('\n'):'')); return; }
  S.connected = true; render(); await refreshData();
}
function disconnect(){ S.connected=false; S.accounts=[]; S.data=[]; saveState(); render(); }

// ── Insights ────────────────────────────────────────────────────────────────
const INSIGHT_FIELDS = 'spend,impressions,clicks,ctr,cpc,cpm,reach,frequency,actions,cost_per_action_type';
function getActionValue(actions, type){ if(!Array.isArray(actions)) return 0; const a=actions.find(x=>x.action_type===type); return a?parseFloat(a.value)||0:0; }
const BR_OFFSET = -3;
const brToday = () => new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const addDaysStr = (s,days)=>{ const d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+days); return d.toISOString().slice(0,10); };
function customRange(){ const u=S.customUntil||brToday(); const s=S.customSince||addDaysStr(u,-6); return (s<=u)?{since:s,until:u}:{since:u,until:s}; }
function brWindow(period){
  const today=brToday();
  if(period==='custom') return customRange();
  if(period==='today') return {since:today,until:today};
  if(period==='yesterday'){ const y=addDaysStr(today,-1); return {since:y,until:y}; }
  const n=period==='last_3d'?3:period==='last_7d'?7:period==='last_14d'?14:period==='last_30d'?30:7;
  return {since:addDaysStr(today,-n),until:addDaysStr(today,-1)};
}
function periodDays(period){
  if(period==='custom'){ const r=customRange(); return Math.max(1, Math.round((new Date(r.until+'T00:00:00Z')-new Date(r.since+'T00:00:00Z'))/864e5)+1); }
  return period==='today'||period==='yesterday'?1:(period==='last_3d'?3:period==='last_7d'?7:period==='last_14d'?14:period==='last_30d'?30:7);
}

async function fetchInsights(parentId, level, tokenId, tzOffset){
  if(tzOffset!=null && Number(tzOffset)!==BR_OFFSET) return await fetchInsightsHourlyBRT(parentId, level, tokenId, Number(tzOffset));
  const tok=getTokenById(tokenId); if(!tok) throw new Error('Token não encontrado');
  const params={level, fields:`${INSIGHT_FIELDS},campaign_id,campaign_name`, limit:500};
  if(S.period==='custom') params.time_range=brWindow('custom'); else params.date_preset=S.period;
  const r = await api(`/${parentId}/insights`, params, tok);
  return r.data||[];
}
async function fetchInsightsHourlyBRT(parentId, level, tokenId, tzOffset){
  const tok=getTokenById(tokenId); if(!tok) throw new Error('Token não encontrado');
  const win=brWindow(S.period); const shift=BR_OFFSET-tzOffset;
  const accSince=addDaysStr(win.since,-1), accUntil=addDaysStr(win.until,1);
  let url=`${GQL}/${parentId}/insights?`+[
    'level='+level,
    'fields='+encodeURIComponent('spend,impressions,clicks,actions,campaign_id,campaign_name'),
    'breakdowns=hourly_stats_aggregated_by_advertiser_time_zone',
    'time_increment=1',
    'time_range='+encodeURIComponent(JSON.stringify({since:accSince,until:accUntil})),
    'limit=500','access_token='+encodeURIComponent(tok)
  ].join('&');
  const acc={}; let pages=0;
  while(url && pages<60){
    pages++;
    const json=await (await fetch(url)).json();
    if(json.error) throw new Error(`(${json.error.code}) ${json.error.message}`);
    (json.data||[]).forEach(row=>{
      const hStr=row.hourly_stats_aggregated_by_advertiser_time_zone||'00';
      const hr=parseInt(hStr.slice(0,2),10)||0;
      const base=new Date(row.date_start+'T00:00:00Z'); base.setUTCHours(hr+shift);
      const brDate=base.toISOString().slice(0,10);
      if(brDate<win.since||brDate>win.until) return;
      const id=row.campaign_id; if(!id) return;
      if(!acc[id]) acc[id]={id,name:row.campaign_name||id,spend:0,impressions:0,clicks:0,lpv:0,ic:0};
      const a=acc[id];
      a.spend+=parseFloat(row.spend)||0; a.impressions+=parseInt(row.impressions)||0; a.clicks+=parseInt(row.clicks)||0;
      a.lpv+=getActionValue(row.actions,'landing_page_view');
      a.ic +=getActionValue(row.actions,'initiate_checkout')||getActionValue(row.actions,'offsite_conversion.fb_pixel_initiate_checkout');
    });
    url=(json.paging&&json.paging.next)?json.paging.next:null;
  }
  return Object.values(acc).map(a=>({
    spend:a.spend, impressions:a.impressions, clicks:a.clicks,
    ctr:a.impressions?(a.clicks/a.impressions*100):0, cpc:a.clicks?(a.spend/a.clicks):0, cpm:a.impressions?(a.spend/a.impressions*1000):0,
    actions:[{action_type:'landing_page_view',value:a.lpv},{action_type:'initiate_checkout',value:a.ic}],
    cost_per_action_type:[{action_type:'landing_page_view',value:a.lpv?a.spend/a.lpv:0},{action_type:'initiate_checkout',value:a.ic?a.spend/a.ic:0}],
    campaign_id:a.id, campaign_name:a.name
  }));
}
async function fetchEntityList(parentId, tokenId){
  const tok=getTokenById(tokenId);
  const r=await api(`/${parentId}/campaigns`, {fields:'id,name,status,effective_status,objective,bid_strategy,daily_budget,lifetime_budget,updated_time', limit:500}, tok);
  return r.data||[];
}
function mergeInsightsAndEntities(insights, entities){
  const byId={};
  entities.forEach(e=>{ byId[e.id]={...e, spend:0,impressions:0,clicks:0,ctr:0,cpc:0,cpm:0,landing_page_views:0,cost_per_landing_page_view:0,initiate_checkout:0,cost_per_initiate_checkout:0}; });
  insights.forEach(ins=>{
    const id=ins.campaign_id; if(!id) return;
    if(!byId[id]) byId[id]={id, name:ins.campaign_name||id, status:'?', effective_status:'?'};
    Object.assign(byId[id], {
      spend:parseFloat(ins.spend)||0, impressions:parseInt(ins.impressions)||0, clicks:parseInt(ins.clicks)||0,
      ctr:parseFloat(ins.ctr)||0, cpc:parseFloat(ins.cpc)||0, cpm:parseFloat(ins.cpm)||0,

function periodRange(period){
  const today=brToday(); const at=s=>`${s}T00:00:00-03:00`;
  if(period==='custom'){ const r=customRange(); return {since:at(r.since), until:at(addDaysStr(r.until,1))}; }
  if(period==='today') return {since:at(today),until:at(addDaysStr(today,1))};
  if(period==='yesterday') return {since:at(addDaysStr(today,-1)),until:at(today)};
  const n=periodDays(period);
  return {since:at(addDaysStr(today,-n)),until:at(today)};
}
async function fetchRevenue(){
  const {since,until}=periodRange(S.period);
  try{
    const res=await fetch(`${S.sbUrl}/rest/v1/rpc/meta_revenue_by_ad`,{method:'POST',headers:{'Content-Type':'application/json','apikey':S.sbKey,'Authorization':'Bearer '+S.sbKey},body:JSON.stringify({p_since:since,p_until:until})});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const rows=await res.json(); const byCampaign={}, byAdset={}, byAd={};
    const add=(m,k,v)=>{ if(!k) return; if(!m[k]) m[k]={front:0,total:0,receita:0}; m[k].front+=v.front; m[k].total+=v.total; m[k].receita+=v.receita; };
    (rows||[]).forEach(r=>{
      const v={front:parseInt(r.vendas_front)||0,total:parseInt(r.vendas_total)||0,receita:parseFloat(r.receita_bruta)||0};
      add(byCampaign, r.campaign_id, v); add(byAdset, r.adset_id, v); add(byAd, r.ad_id, v);
    });
    let offsite={front:0,total:0,receita:0};
    try{ const r2=await fetch(`${S.sbUrl}/rest/v1/rpc/meta_revenue_offsite`,{method:'POST',headers:{'Content-Type':'application/json','apikey':S.sbKey,'Authorization':'Bearer '+S.sbKey},body:JSON.stringify({p_since:since,p_until:until})}); if(r2.ok){ const o=(await r2.json())[0]||{}; offsite={front:parseInt(o.vendas_front)||0,total:parseInt(o.vendas_total)||0,receita:parseFloat(o.receita_bruta)||0}; } }catch(_){}
    // Faturamento TOTAL do funil (por projeto na Assiny) — bate com o painel da Assiny
    let funnelTotal={front:0,total:0,receita:0};
    try{ const r3=await fetch(`${S.sbUrl}/rest/v1/rpc/funnel_revenue`,{method:'POST',headers:{'Content-Type':'application/json','apikey':S.sbKey,'Authorization':'Bearer '+S.sbKey},body:JSON.stringify({p_since:since,p_until:until,p_funil:currentFunnel().match||''})}); if(r3.ok){ const o=(await r3.json())[0]||{}; funnelTotal={front:parseInt(o.vendas_front)||0,total:parseInt(o.vendas_total)||0,receita:parseFloat(o.receita_bruta)||0}; } }catch(_){}
    // faixa dos compradores por criativo (ad_id), cruzando com a pesquisa
    let faixaAd={};
    try{ const r4=await fetch(`${S.sbUrl}/rest/v1/rpc/faixa_por_criativo`,{method:'POST',headers:{'Content-Type':'application/json','apikey':S.sbKey,'Authorization':'Bearer '+S.sbKey},body:JSON.stringify({p_since:since,p_until:until})}); if(r4.ok){ (await r4.json()).forEach(x=>{ faixaAd[String(x.ad_id)]={n:parseInt(x.compradores)||0,a:parseInt(x.faixa_a)||0,b:parseInt(x.faixa_b)||0,c:parseInt(x.faixa_c)||0,sem:parseInt(x.sem_faixa)||0,resp0:parseInt(x.sem_resposta)||0}; }); } }catch(_){}
    return {byCampaign, byAdset, byAd, offsite, funnelTotal, faixaAd};
  }catch(e){ console.warn('receita falhou',e.message); return {byCampaign:{}, byAdset:{}, byAd:{}, offsite:{front:0,total:0,receita:0}, funnelTotal:{front:0,total:0,receita:0}, _error:e.message}; }

// ── Tags derivadas do nome ──────────────────────────────────────────────────
function tagCA(r){ const m=(r.name||'').match(/\[CA\s*0*(\d+)\s*\]/i); return m?('CA '+String(m[1]).padStart(2,'0')):(r._accountName||'Outra'); }
function tagLance(r){ const m=(r.name||'').match(/CBO\s*(TRAD|CPA)/i); if(m) return 'CBO '+m[1].toUpperCase(); if(/\bABO\b/i.test(r.name||'')) return 'ABO'; if(r.daily_budget>0||r.lifetime_budget>0) return 'CBO'; return 'ABO'; }
function tagOferta(r){ const n=r.name||''; const d=(n.match(/(\d{2}\.\d{2})/)||[])[1]||'s/data'; const c=(n.match(/VSL\s*37\s*(QUIZ|LP)/i)||[])[1]; return d+(c?(' '+c.toUpperCase()):''); }
function tagEstrutura(r){ const m=(r.name||'').match(/1-(\d)-X/i); return m?('1-'+m[1]):'—'; }
function shortName(n){
  n=String(n||'');
  const ca=(n.match(/\[CA\s*0*(\d+)\s*\]/i)||[])[0]||'';
  const of=tagOferta({name:n});
  const la=tagLance({name:n});
  const es=tagEstrutura({name:n});
  let s=[of,la,es].filter(x=>x&&x!=='—').join(' ');
  if(ca) s=ca.replace(/[\[\]]/g,'')+' · '+s;
  return s||n.slice(0,60);
}

// ── Motor de análise ────────────────────────────────────────────────────────
function analyze(){
  const days=periodDays(S.period);
  // universo do funil: BRL, com gasto no período, batendo o funil (+ refino). Inclui pausadas/desativadas.
  const inFunil = r => (r._currency||'BRL')==='BRL' && (r.spend||0)>0 && matchFunnel(r.name);
  const rowsAll = (S.data||[]).filter(inFunil);
  // decisão (bom/ruim, escalar/cortar, botões): só o que está ATIVO agora
  let rows = rowsAll.filter(r=>(r.effective_status||'')==='ACTIVE');
  const pausadasCount = rowsAll.length - rows.length;
  // TOTAIS do período: tudo que gastou (ativas + pausadas/desativadas) → análise correta do dia
  const T={spend:0,receita:0,front:0,total:0,imp:0,clicks:0,ic:0,lpv:0};
  rowsAll.forEach(r=>{ T.spend+=r.spend||0; T.receita+=r._receita||0; T.front+=r._vendasFront||0; T.total+=r._vendasTotal||0; T.imp+=r.impressions||0; T.clicks+=r.clicks||0; T.ic+=r.initiate_checkout||0; T.lpv+=r.landing_page_views||0; });
  const pausadasGasto = rowsAll.filter(r=>(r.effective_status||'')!=='ACTIVE').reduce((s,r)=>s+(r.spend||0),0);
  const blendedCPA = T.front>0 ? T.spend/T.front : 0;
  const off=(S._rev&&S._rev.offsite)||{front:0,total:0,receita:0};
  const funnelTotal=(S._rev&&S._rev.funnelTotal)||{front:0,total:0,receita:0};

  // config
  const cpaAlvo = (parseFloat(S.cpaAlvo)>0) ? parseFloat(S.cpaAlvo) : (blendedCPA||9999);
  const roasAlvo = (parseFloat(S.roasAlvo)>0) ? parseFloat(S.roasAlvo) : 1.0;
  const defMin = ({1:60,3:150,7:250,14:450,30:800})[days] || 250;
  const minSpend = (parseFloat(S.minSpend)>=0 && S.minSpend!=='') ? parseFloat(S.minSpend) : defMin;

  // classifica — critério baseado SÓ no ROAS vs ROAS alvo (breakeven)
  rows.forEach(r=>{
    const spend=r.spend||0, roas=r._roas;
    let v,reason;
    if(spend<minSpend){ v='novo'; reason='gasto abaixo do mínimo para julgar ('+fmtMoney0(spend)+')'; }
    else if(roas==null){ v='novo'; reason='sem dado de receita'; }
    else if(roas>=roasAlvo){ v='bom'; reason='ROAS '+fmtRoas(roas)+' ≥ alvo '+fmtRoas(roasAlvo)+' — no lucro'; }
    else if(roas>=roasAlvo*0.85){ v='observar'; reason='ROAS '+fmtRoas(roas)+' — no limite do breakeven (alvo '+fmtRoas(roasAlvo)+')'; }
    else { v='ruim'; reason='ROAS '+fmtRoas(roas)+' < alvo '+fmtRoas(roasAlvo)+' — no prejuízo'; }
    r._verdict=v; r._reason=reason;
    r._breaches=alvoBreaches(r);
  });
  const foraAlvo=rows.filter(r=>r._breaches.length).length;

  const good=rows.filter(r=>r._verdict==='bom').sort((a,b)=>(b._roas||0)-(a._roas||0));
  const bad =rows.filter(r=>r._verdict==='ruim').sort((a,b)=>(b.spend||0)-(a.spend||0));
  const watch=rows.filter(r=>r._verdict==='observar').sort((a,b)=>(b.spend||0)-(a.spend||0));
  const gastoRuim=bad.reduce((s,r)=>s+(r.spend||0),0);

  // agregações
  const aggBy=(keyFn)=>{
    const m={};
    rows.forEach(r=>{ const k=keyFn(r); if(k==null) return; if(!m[k]) m[k]={key:k,spend:0,receita:0,front:0,total:0,imp:0,clicks:0,ic:0,n:0}; const a=m[k]; a.spend+=r.spend||0; a.receita+=r._receita||0; a.front+=r._vendasFront||0; a.total+=r._vendasTotal||0; a.imp+=r.impressions||0; a.clicks+=r.clicks||0; a.ic+=r.initiate_checkout||0; a.n++; });
    return Object.values(m).map(a=>({...a, roas:a.spend>0?a.receita/a.spend:null, cpa:a.front>0?a.spend/a.front:null, ctr:a.imp>0?a.clicks/a.imp*100:0, cpm:a.imp>0?a.spend/a.imp*1000:0, cpc:a.clicks>0?a.spend/a.clicks:0, cic:a.ic>0?a.spend/a.ic:0, ticket:a.front>0?a.receita/a.front:0})).sort((x,y)=>y.spend-x.spend);
  };
  const byConta=aggBy(tagCA);
  const byLance=aggBy(tagLance);
  const byOferta=aggBy(tagOferta);
  const byAccount=aggBy(r=>r._accountName||'(sem conta)');

  // fragmentação: grupos (conta+lance+oferta+estrutura) com >2 campanhas
  const fragMap={};
  rows.forEach(r=>{ const k=tagCA(r)+' | '+tagLance(r)+' | '+tagOferta(r)+' | '+tagEstrutura(r); if(!fragMap[k]) fragMap[k]={key:k,n:0,spend:0}; fragMap[k].n++; fragMap[k].spend+=r.spend||0; });
  const frag=Object.values(fragMap).filter(g=>g.n>=3).sort((a,b)=>b.n-a.n);

  // ações recomendadas
  const actions=[];
  if(bad.length){ actions.push(`<b>Pausar ${bad.length} campanha(s) ruim(ns)</b>, liberando ${fmtMoney0(gastoRuim)} no período (${fmtMoney0(gastoRuim/days)}/dia) para realocar nas vencedoras.`); }
  if(good.length){ actions.push(`<b>Escalar as ${good.length} melhores</b> (subir orçamento 20% a 30% aos poucos): ${good.slice(0,4).map(r=>esc(shortName(r.name))).join('; ')}.`); }
  // comparação de dimensões: aponta vencedor claro por CPA
  const cmp=(arr,rot)=>{
    const val=arr.filter(a=>a.roas!=null && a.front>=3);
    if(val.length<2) return;
    val.sort((a,b)=>b.roas-a.roas);
    const best=val[0], worst=val[val.length-1];
    if(best.roas >= worst.roas*1.5 && worst.roas < roasAlvo){
      actions.push(`Em <b>${rot}</b>: <span class="winner">${esc(best.key)}</span> (ROAS ${fmtRoas(best.roas)}) dá muito mais lucro que <span class="loser">${esc(worst.key)}</span> (ROAS ${fmtRoas(worst.roas)}). Migrar verba para ${esc(best.key)}.`);
    }
  };
  cmp(byConta,'conta');
  cmp(byLance,'estratégia de lance');
  cmp(byOferta,'oferta/criativo');
  if(frag.length){ const g=frag[0]; actions.push(`<b>Desfragmentar:</b> há grupos com muitas campanhas quase idênticas competindo entre si (ex: "${esc(g.key)}" com ${g.n} campanhas, ${fmtMoney0(g.spend)}). CBO rende mais com menos campanhas e mais orçamento por campanha.`); }

  return {rows, T, blendedCPA, cpaAlvo, roasAlvo, minSpend, days, good, bad, watch, gastoRuim, byConta, byLance, byOferta, byAccount, frag, actions, off, funnelTotal, foraAlvo, pausadasCount, pausadasGasto};
}

// ── Render ──────────────────────────────────────────────────────────────────

  const root=$('root');

// ── Visão própria do Backend (Mentoria & Consultoria) — sem mídia paga ───────
function renderBackendView(A){
  const tipos=S._crossoverTipos||[];
  const totBruta=tipos.reduce((s,t)=>s+(+t.receita_bruta||0),0);
  const totLiq=tipos.reduce((s,t)=>s+(+t.receita_liquida||0),0);
  const totVendas=tipos.reduce((s,t)=>s+(+t.vendas||0),0);
  const totComp=tipos.reduce((s,t)=>s+(+t.compradores||0),0);
  const fr=A.funnelTotal||{};
  const receita = totBruta>0?totBruta:(parseFloat(fr.receita)||0);
  const vendas  = totVendas>0?totVendas:(parseInt(fr.total)||0);
  const ticket  = vendas?receita/vendas:0;
  const carregando = S._crossoverTipos==null;
  const kpi=`<div class="card">
    <h2>💼 Backend · Mentoria &amp; Consultoria · ${A.days}d</h2>
    <div class="kpis">
      <div class="kpi"><div class="k-l">Receita bruta</div><div class="k-v">${fmtMoney0(receita)}</div><div class="k-s">${totLiq>0?'líquida '+fmtMoney0(totLiq):(carregando?'<span class="loading"></span>':'')}</div></div>
      <div class="kpi"><div class="k-l">Vendas</div><div class="k-v">${fmtNum(vendas)}</div><div class="k-s">${fmtNum(totComp)} compradores</div></div>
      <div class="kpi"><div class="k-l">Ticket médio</div><div class="k-v">${fmtMoney0(ticket)}</div><div class="k-s">bruto</div></div>
    </div>
    <div class="mini" style="margin-top:10px">Backend fechado por WhatsApp/call — <b>sem mídia paga direta</b>, por isso não há campanhas para otimizar aqui. Receita da Assiny (projeto "Consultorias &amp; Mentorias"). O split por tipo, a origem e a taxa de conversão do front estão logo abaixo.</div>
  </div>`;
  return kpi + renderBackendProdutos(A) + renderCrossover(A);
}

function renderBackendProdutos(A){
  const head=`<h2>📦 Produtos do backend <span class="mini" style="text-transform:none">receita e compradores por produto no período</span><button class="btn btn-gray btn-sm" style="float:right;padding:4px 10px" onclick="reloadFunis()">↻ Atualizar</button></h2>`;
  if(S._funisLoading || S._funis==null){ if(!S._funisLoading && S.connected) setTimeout(()=>fetchFunis(),40); return `<div class="card">${head}<div class="empty"><span class="loading"></span> Carregando produtos…</div></div>`; }
  const prodMap={};
  S._funis.forEach(f=>(f.produtos||[]).forEach(p=>{
    const k=p.nome||'(sem nome)';
    if(!prodMap[k]) prodMap[k]={nome:k, compradores:0, receita:0};
    prodMap[k].compradores+=p.compradores; prodMap[k].receita+=p.receita;
  }));
  const prods=Object.values(prodMap).sort((a,b)=>b.receita-a.receita);
  if(!prods.length) return `<div class="card">${head}<div class="empty">Sem vendas no período.</div></div>`;
  const totR=prods.reduce((s,p)=>s+p.receita,0);
  const tipoBadge=(nome)=> /franquia|consultoria/i.test(nome)?'<span class="badge b-novo">Consultoria</span>':'<span class="badge b-bom">Mentoria</span>';
  return `<div class="card">${head}

    </tr></thead><tbody>
    ${prods.map(p=>`<tr><td>${esc(p.nome)}</td><td>${tipoBadge(p.nome)}</td><td class="num">${fmtNum(p.compradores)}</td><td class="num">${fmtMoney0(p.receita)}</td><td class="num">${fmtMoney0(p.compradores?p.receita/p.compradores:0)}</td><td class="num">${totR?(p.receita/totR*100).toFixed(0):0}%</td></tr>`).join('')}

  </div>`;
}

function renderKPIs(A){
  const T=A.T; const roas=T.spend>0?T.receita/T.spend:null;
  const funnelReceita = (A.funnelTotal&&A.funnelTotal.receita>0) ? A.funnelTotal.receita : (T.receita+A.off.receita);
  const funnelVendas = (A.funnelTotal&&A.funnelTotal.total>0) ? A.funnelTotal.total : (T.total+A.off.total);
  const temFunnel = !!(A.funnelTotal&&A.funnelTotal.receita>0);
  const semUtm = Math.max(0, funnelReceita - T.receita);
  const lucro = funnelReceita - T.spend;
  const margem = funnelReceita>0 ? (lucro/funnelReceita*100) : null;
  const lucroKpiCls = lucro>=0 ? 'good' : 'danger';
  const lucroColor = lucro>=0 ? '#137333' : '#c5221f';
  return `<div class="card">
    <h2>Panorama · ${currentFunnel().emoji} ${esc(currentFunnel().label)} · ${A.rows.length} ativas${A.pausadasCount?` + ${A.pausadasCount} pausadas c/ gasto`:''} · ${A.days}d</h2>
    <div class="kpis">
      <div class="kpi"><div class="k-l">Gasto</div><div class="k-v">${fmtMoney0(T.spend)}</div><div class="k-s">${fmtMoney0(T.spend/A.days)}/dia</div></div>
      <div class="kpi"><div class="k-l">Receita do funil${temFunnel?' (Assiny)':''}</div><div class="k-v">${fmtMoney0(funnelReceita)}</div><div class="k-s">Meta ${fmtMoney0(T.receita)} · ROAS <b style="color:${roasColor(roas)}">${fmtRoas(roas)}</b></div></div>
      <div class="kpi ${lucroKpiCls}"><div class="k-l">💰 Lucro</div><div class="k-v" style="color:${lucroColor}">${fmtMoney0(lucro)}</div><div class="k-s">margem ${margem!=null?margem.toFixed(0)+'%':'—'} · ${fmtMoney0(lucro/A.days)}/dia</div></div>
      <div class="kpi"><div class="k-l">Vendas front</div><div class="k-v">${fmtNum(T.front)}</div><div class="k-s">${fmtNum(T.total)} totais</div></div>
      <div class="kpi"><div class="k-l">CPA médio (front)</div><div class="k-v">${fmtMoney0(A.blendedCPA)}</div><div class="k-s">ticket ${fmtMoney0(T.front>0?T.receita/T.front:0)}</div></div>
      <div class="kpi good"><div class="k-l">✅ Escalar</div><div class="k-v">${A.good.length}</div><div class="k-s">campanhas boas</div></div>
      <div class="kpi danger"><div class="k-l">🔴 Verba em risco</div><div class="k-v">${fmtMoney0(A.gastoRuim)}</div><div class="k-s">${A.bad.length} ruins · ${fmtMoney0(A.gastoRuim/A.days)}/dia</div></div>
    </div>
    <div class="mini" style="margin-top:10px"><b>Receita do funil ${fmtMoney0(funnelReceita)}</b>${temFunnel?` (${fmtNum(funnelVendas)} vendas, bate com a Assiny em valor líquido, após taxas)`:''}. Dentro dela: ${fmtMoney0(T.receita)} atribuídos ao Meta por UTM (entram no ROAS) e ${fmtMoney0(semUtm)} sem UTM do Meta (direct/orgânico). Gasto inclui tudo que rodou no período${A.pausadasGasto>0?` (${fmtMoney0(A.pausadasGasto)} de pausadas/desativadas)`:''}; as listas de decisão mostram só as ${A.rows.length} ativas. <b>Lucro</b> = receita do funil − gasto em mídia (não desconta produto/imposto/reembolso).</div>
  </div>`;
}

    <td>${l} <span class="mini">(${dir==='low'?'≤ melhor':'≥ melhor'}${hint?' · '+hint:''})</span></td>

    <td class="num" style="font-weight:800">${fv}</td>

// ── Funis de checkout + produtos (conversão / take rate) ────────────────────
async function fetchFunis(){
  if(S._funisLoading) return; S._funisLoading=true; render();
  try{
    const {since,until}=periodRange(S.period);
    const res=await fetch(`${S.sbUrl}/rest/v1/rpc/funnel_products`,{method:'POST',headers:{'Content-Type':'application/json','apikey':S.sbKey,'Authorization':'Bearer '+S.sbKey},body:JSON.stringify({p_since:since,p_until:until,p_org:currentFunnel().match||''})});
    const rows=res.ok?await res.json():[];
    const m={};
    rows.forEach(r=>{ const f=r.funil_id; if(!m[f]) m[f]={id:f,nome:r.funil_nome||'',produtos:[]}; m[f].produtos.push({nome:r.produto_nome,tipo:r.tipo_oferta,compradores:parseInt(r.compradores)||0,receita:parseFloat(r.receita)||0}); });
    S._funis=Object.values(m);
  }catch(e){ S._funis=[]; }
  S._funisLoading=false; render();
}
function reloadFunis(){ S._funis=null; fetchFunis(); }
// Ordem fixa dos produtos no card de funis: Front, OB1, OB2, OB3, UP1, DW1, DW2, UP2, UP3
const PROD_ORDER=['ENTRY','OB1','OB2','OB3','UP1','DW1','DW2','UP2','UP3'];
function prodRank(p){
  if(p.tipo==='ENTRY') return 0;
  const nome=p.nome||'';
  // overrides para produtos sem número no nome mas com posição conhecida
  if(/c[oó]digo\s*de\s*r\$?\s*500/i.test(nome)) return PROD_ORDER.indexOf('OB3');
  if(/call\s*com\s*s[oó]cio/i.test(nome)) return PROD_ORDER.indexOf('OB3'); // OB3 alternativo, já rodou nessa posição
  if(/loja pronta/i.test(nome)){
    if(p.tipo==='UPSELL') return PROD_ORDER.indexOf('UP1');
    if(p.tipo==='DOWNSELL') return PROD_ORDER.indexOf('DW1');
  }
  if(/mentoria\s*1x1/i.test(nome)) return PROD_ORDER.indexOf('UP3'); // 3º upsell da esteira, confirmado nos dois funis principais
  const m=nome.match(/\b(OB|UP|DW)\s*#?\s*(\d)/i);
  if(m){ const idx=PROD_ORDER.indexOf(m[1].toUpperCase()+m[2]); if(idx>=0) return idx; }
  const fallback={ORDERBUMP:1.5, UPSELL:4.5, DOWNSELL:5.5}; // produto sem número no nome: agrupa perto do tipo
  return 50+(fallback[p.tipo]||9);
}
function nomeFunil(prods){
  const t=(prods||[]).map(p=>p.nome||'').join(' ');
  if(/loja pronta/i.test(t)) return 'Front + Loja Pronta';
  if(/mentoria|up#/i.test(t)) return 'Quiz + Mentoria/Upsell';
  return 'Front + Order Bumps';
}
function renderFunis(A){
  const head=`<h2>🗂️ Funis e produtos · conversão <span class="mini" style="text-transform:none">take rate = % dos compradores front que levaram cada item</span><button class="btn btn-gray btn-sm" style="float:right;padding:4px 10px" onclick="reloadFunis()">↻ Atualizar</button></h2>`;
  if(S._funisLoading || S._funis==null){ if(!S._funisLoading && S.connected) setTimeout(()=>fetchFunis(),40); return `<div class="card">${head}<div class="empty"><span class="loading"></span> Carregando funis e produtos…</div></div>`; }
  if(!S._funis.length) return `<div class="card">${head}<div class="empty">Sem vendas no período para a organização ${esc(currentFunnel().label)}.</div></div>`;
  const funis=S._funis.map(f=>{
    const front=f.produtos.filter(p=>p.tipo==='ENTRY').reduce((s,p)=>s+p.compradores,0);
    const receita=f.produtos.reduce((s,p)=>s+p.receita,0);
    const rate=t=>{ const c=f.produtos.filter(p=>p.tipo===t).reduce((s,p)=>s+p.compradores,0); return front?c/front*100:0; };
    return {...f, front, receita, ticket:front?receita/front:0, bump:rate('ORDERBUMP'), up:rate('UPSELL'), dw:rate('DOWNSELL'), nome:(f.nome||nomeFunil(f.produtos))};
  }).filter(f=>f.front>0 || f.receita>0).sort((a,b)=>b.front-a.front);
  const tBadge=t=>`<span class="badge b-${t==='ENTRY'?'bom':t==='UPSELL'?'observar':t==='DOWNSELL'?'ruim':'novo'}">${t}</span>`;
  const SLOT_TAGS=PROD_ORDER.slice(1); // ['OB1','OB2','OB3','UP1','DW1','DW2','UP2','UP3']
  const slotType=tag=>tag.startsWith('OB')?'ORDERBUMP':tag.startsWith('UP')?'UPSELL':'DOWNSELL';
  const body=funis.map(f=>{
    const frontProd=f.produtos.find(p=>p.tipo==='ENTRY');
    const bySlot={};
    f.produtos.filter(p=>p.tipo!=='ENTRY').forEach(p=>{ const r=prodRank(p); (bySlot[r]=bySlot[r]||[]).push(p); });
    const frontRow=`<tr><td>Front${frontProd?` <span class="mini">${esc(frontProd.nome)}</span>`:''}</td><td>${tBadge('ENTRY')}</td><td class="num">${f.front}</td><td class="num">base</td><td class="num">${fmtMoney0(frontProd?frontProd.receita:0)}</td></tr>`;
    // sempre mostra os 8 slots (OB1,OB2,OB3,UP1,DW1,DW2,UP2,UP3); zera quando não houve venda no período
    const slotRows=SLOT_TAGS.map(tag=>{
      const rank=PROD_ORDER.indexOf(tag);
      const list=(bySlot[rank]||[]).sort((a,b)=>b.compradores-a.compradores);
      if(list.length){
        return list.map(p=>`<tr><td>${tag} <span class="mini">${esc(p.nome)}</span></td><td>${tBadge(p.tipo)}</td><td class="num">${p.compradores}</td><td class="num">${f.front?(p.compradores/f.front*100).toFixed(1)+'%':'—'}</td><td class="num">${fmtMoney0(p.receita)}</td></tr>`).join('');
      }
      return `<tr style="opacity:.4"><td>${tag}</td><td>${tBadge(slotType(tag))}</td><td class="num">0</td><td class="num">0.0%</td><td class="num">R$ 0</td></tr>`;
    }).join('');
    return `<div style="border:1px solid #eee;border-radius:10px;padding:12px;margin-bottom:12px">
      <div class="row" style="justify-content:space-between;align-items:baseline">
        <div><b style="font-size:15px">${esc(f.nome)}</b> <span class="mini" style="font-family:monospace">${esc(String(f.id).slice(0,8))}</span></div>
        <div class="mini">${f.front} front · receita ${fmtMoney0(f.receita)} · ticket ${fmtMoney0(f.ticket)}</div>
      </div>
      <div class="row" style="gap:16px;margin:8px 0">
        <span class="mini">🛒 Order bump: <b style="color:#137333">${f.bump.toFixed(1)}%</b></span>
        <span class="mini">⬆️ Upsell: <b style="color:#137333">${f.up.toFixed(1)}%</b></span>
        <span class="mini">⬇️ Downsell: <b>${f.dw.toFixed(1)}%</b></span>
      </div>
      <div class="tbl-wrap" style="max-height:none"><table><thead><tr><th>Produto</th><th>Tipo</th><th class="num">Compradores</th><th class="num">Conversão</th><th class="num">Receita</th></tr></thead><tbody>
      ${frontRow}${slotRows}
      </tbody></table></div>
    </div>`;
  }).join('');
  return `<div class="card">${head}${body}
    <div class="mini" style="margin-top:4px">Conversão do produto = compradores do produto ÷ compradores do front do mesmo funil. As taxas de bump/upsell/downsell no topo são agregadas por tipo (igual ao painel da Assiny). Vendas reais do Supabase, por funil de checkout.</div>
  </div>`;
}

// ── Cruzamento IniciAmazon (front) → Backend (Mentoria e Consultorias) ───────

function renderCrossover(A){
  const head=`<h2>🔗 IniciAmazon → Backend <span class="mini" style="text-transform:none">cruza compradores do front com a organização de mentoria/consultoria pelo e-mail, sem janela de tempo</span><button class="btn btn-gray btn-sm" style="float:right;padding:4px 10px" onclick="reloadCrossover()">↻ Atualizar</button></h2>`;

  }
  const rate=S._crossoverRate||{total_front_buyers:0,total_backend_buyers:0,convertidos:0,taxa_conversao:0};
  // taxa com precisão real (não arredonda a esconder o número): dígitos significativos p/ taxas pequenas
  const fmtTaxa=(conv,tot)=>{
    if(!tot) return '0%';
    const p=100*conv/tot;
    if(p===0) return '0%';
    let s = p>=1 ? p.toFixed(2) : p.toPrecision(3); // ex.: 2/2098 -> "0.0953%"
    s = s.replace(/(\.\d*?)0+$/,'$1').replace(/\.$/,''); // tira zeros à direita
    return s+'%';
  };
  if(!rate.total_backend_buyers){
    return `<div class="card">${head}${kwField}
      <div class="empty" style="font-style:normal">Nenhuma venda encontrada ainda para a organização "<b>${esc(S.backendKeyword)}</b>". Assim que o webhook da Mentoria e Consultorias for criado e começar a vender, essa análise já aparece pronta aqui — sem precisar mexer em nada. Base atual: <b>${fmtNum(rate.total_front_buyers)}</b> compradores do front no histórico.</div>
    </div>`;
  }
  const rows=S._crossover||[];
  const comFront=rows.filter(r=>r.front_data);
  const receitaBackend=rows.reduce((s,r)=>s+(+r.backend_valor||0),0);
  const receitaFrontDosConvertidos=comFront.reduce((s,r)=>s+(+r.front_valor||0),0);
  const ticketBackend=rows.length?receitaBackend/rows.length:0;
  const ltvMedio=comFront.length?(receitaBackend+receitaFrontDosConvertidos)/comFront.length:0;
  // agrega por campanha de origem
  const byCamp={};

    if(!byCamp[k]) byCamp[k]={key:k, nome:r.front_campanha||k, n:0, receitaBackend:0, campId:r.front_meta_campaign_id};
    byCamp[k].n++; byCamp[k].receitaBackend+=(+r.backend_valor||0);

  const campArr=Object.values(byCamp).sort((a,b)=>b.receitaBackend-a.receitaBackend);
  const cac=S._crossoverCAC;
  const cacBtn = cac ? '' : `<button class="btn btn-purple btn-sm" onclick="fetchCrossoverCAC()" ${S._crossoverCACLoading?'disabled':''}>${S._crossoverCACLoading?'<span class="loading"></span> Carregando…':'💰 Carregar CAC real (gasto Meta)'}</button>`;
  // ── breakdown por tipo (Mentoria x Consultoria) ──
  const tipos = S._crossoverTipos||[];
  const linha=(l,v)=>`<div style="display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;gap:12px"><span class="mini">${l}</span><b style="white-space:nowrap">${v}</b></div>`;
  const tipoBlock=(t)=>{
    const isCons = t.tipo==='Consultoria';
    const origens = comFront.filter(r=>(r.backend_tipo||'Mentoria')===t.tipo);
    const campIds = [...new Set(origens.map(r=>r.front_meta_campaign_id).filter(Boolean))];
    let cacTipo=null;
    if(cac){ const gasto=campIds.reduce((s,id)=>s+(cac[id]!=null?+cac[id]:0),0); cacTipo=origens.length?gasto/origens.length:null; }
    const cor=isCons?'#7c3aed':'#0891b2';
    const custoVal = cac ? (cacTipo!=null?fmtMoney0(cacTipo):'—')
                         : (origens.length?'<span class="mini" style="font-weight:400">clique “Carregar CAC”</span>':'<span class="mini" style="font-weight:400">sem origem Meta rastreada</span>');
    return `<div style="flex:1;min-width:250px;border:1px solid #e9e9ef;border-left:4px solid ${cor};border-radius:10px;padding:14px 16px;background:#fff">
      <div style="font-weight:800;font-size:15px;margin-bottom:10px">${isCons?'🏛️ Consultoria':'🎓 Mentoria'}</div>
      ${linha('Receita bruta (período)', fmtMoney0(t.receita_bruta))}
      ${linha('Receita líquida', fmtMoney0(t.receita_liquida))}
      ${linha('Vendas / compradores', fmtNum(t.vendas)+' / '+fmtNum(t.compradores))}
      ${linha('Ticket médio', fmtMoney0(t.ticket_medio))}
      ${linha('Taxa front→backend', fmtTaxa(t.convertidos_hist,rate.total_front_buyers)+' <span class="mini" style="font-weight:400">('+fmtNum(t.convertidos_hist)+' conv. no histórico)</span>')}
      ${linha('Custo (CAC atribuído)', custoVal)}
    </div>`;
  };
  const ordem={'Mentoria':0,'Consultoria':1};
  const tiposHtml = tipos.length ? `<h3 style="margin:4px 0 8px">Separado por tipo <span class="mini" style="text-transform:none">receita, ticket e compradores no período · taxa de conversão no histórico</span></h3>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px">${[...tipos].sort((a,b)=>(ordem[a.tipo]??9)-(ordem[b.tipo]??9)).map(tipoBlock).join('')}</div>` : '';
  return `<div class="card">${head}${kwField}
    <div class="kpis" style="margin-bottom:14px">
      <div class="kpi good"><div class="k-l">Taxa de conversão front→backend</div><div class="k-v">${fmtTaxa(rate.convertidos,rate.total_front_buyers)}</div><div class="k-s">${fmtNum(rate.convertidos)} de ${fmtNum(rate.total_front_buyers)} (histórico completo)</div></div>
      <div class="kpi"><div class="k-l">Compradores backend no período</div><div class="k-v">${fmtNum(rows.length)}</div><div class="k-s">${fmtNum(comFront.length)} com origem identificada no front</div></div>
      <div class="kpi"><div class="k-l">Receita backend</div><div class="k-v">${fmtMoney0(receitaBackend)}</div><div class="k-s">ticket ${fmtMoney0(ticketBackend)}</div></div>

    </div>
    ${tiposHtml}
    <h3 style="margin:2px 0 8px">Origem (campanha que trouxe o comprador no front) <span class="mini" style="text-transform:none">ordenado por receita backend atribuída</span></h3>
    <div style="margin-bottom:10px">${cacBtn}</div>
    <div class="tbl-wrap" style="max-height:none"><table><thead><tr>
      <th>Campanha de origem</th><th class="num">Convertidos</th><th class="num">Receita backend</th>${cac?'<th class="num">Gasto Meta (vitalício)</th><th class="num">CAC por convertido</th>':''}
    </tr></thead><tbody>
    ${campArr.map(g=>{
      const gasto = cac ? cac[g.campId] : null;
      const cacVal = (gasto!=null && g.n) ? gasto/g.n : null;
      return `<tr><td>${esc(shortName(g.nome))}<div class="mini" style="font-family:monospace">${esc(g.campId||'')}</div></td>
        <td class="num">${g.n}</td><td class="num">${fmtMoney0(g.receitaBackend)}</td>
        ${cac?`<td class="num">${gasto!=null?fmtMoney0(gasto):'—'}</td><td class="num" style="font-weight:700">${cacVal!=null?fmtMoney0(cacVal):'—'}</td>`:''}
      </tr>`;
    }).join('')}
    </tbody></table></div>
    <details style="margin-top:14px"><summary>Ver cada comprador convertido (${rows.length})</summary>
      <div class="tbl-wrap" style="max-height:340px;margin-top:8px"><table><thead><tr>
        <th>E-mail</th><th>Tipo</th><th>Backend</th><th class="num">Valor</th><th>Origem (front)</th><th class="num">Dias até converter</th>
      </tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${esc(r.cliente_email)}</td><td>${esc(r.backend_tipo||'Mentoria')}</td><td>${esc(r.backend_produto||'')}</td><td class="num">${fmtMoney0(r.backend_valor)}</td>
        <td>${r.front_projeto?esc(r.front_projeto):'<span class="mini">sem compra front identificada</span>'}</td>
        <td class="num">${r.dias_front_ate_backend!=null?Math.round(r.dias_front_ate_backend):'—'}</td></tr>`).join('')}
      </tbody></table></div>
    </details>
    <div class="mini" style="margin-top:10px">Cruzamento por e-mail do cliente, sem limite de tempo (conta como conversão em qualquer momento). CAC = gasto vitalício da campanha ÷ nº de convertidos que vieram dela (aproximação; não isola só quem converteu, é o gasto total da campanha).</div>
  </div>`;
}
const RENDA_LBL=['Sem renda','Menos de 1k','1k–3k','3k–5k','5k–10k','10k–20k','Acima de 20k'];
const INVEST_LBL=['Sem caixa','Menos de 1k','1k–3k','3k–5k','5k–10k','10k–15k','Acima de 15k'];
function renderPesquisa(A){
  if(!['NATH','ALL'].includes(S.funnel)) return ''; // pesquisa é do funil Nathalia
  const head=`<h2>🧭 Perfil dos compradores · pesquisa de onboarding <span class="mini" style="text-transform:none">quiz preenchido após comprar o IniciAmazon (funil Nathalia) · snapshot 01–13 jul</span><button class="btn btn-gray btn-sm" style="float:right;padding:4px 10px" onclick="reloadPesquisa()">↻ Atualizar</button></h2>`;
  if(S._pesquisaLoading || S._pesquisa==null){ if(!S._pesquisaLoading && S.connected) setTimeout(()=>fetchPesquisa(),40); return `<div class="card">${head}<div class="empty"><span class="loading"></span> Carregando perfil…</div></div>`; }
  const p=S._pesquisa; if(!p || !p.total) return `<div class="card">${head}<div class="empty">Sem respostas de pesquisa importadas.</div></div>`;
  const fx=p.por_faixa||[];
  const semCaixa = (fx.find(f=>f.faixa==='sem faixa')||{}).respondentes||0;
  const opp = fx.filter(f=>f.faixa!=='sem faixa').reduce((s,f)=>s+f.respondentes,0);
  const faixaCor={A:'#137333',B:'#0891b2',C:'#b26a00','sem faixa':'#8a8a8a'};
  // ── resultado financeiro do funil no período selecionado (do print) ──
  const T=A.T||{};
  const faturamento=(A.funnelTotal&&A.funnelTotal.receita>0)?A.funnelTotal.receita:((T.receita||0)+((A.off&&A.off.receita)||0));
  const investimento=T.spend||0;
  const custoLiq=faturamento-investimento;
  const respP=p.respondentes_periodo||0;
  const cpl=respP>0?investimento/respP:null;
  // compradores front no período (p/ CPA médio e extrapolação por faixa) e CPA backend
  const frontPeriod=(A.funnelTotal&&A.funnelTotal.front)||T.front||0;
  const cpaFlat=frontPeriod>0?investimento/frontPeriod:null; // CPA médio do comprador front
  const backendPer=p.backend_periodo||0;
  const backendFront=p.backend_periodo_do_front||0; // backend que realmente veio do front (IniciAmazon)
  const cpaBackend=backendFront>0?custoLiq/backendFront:null; // custo líquido do funil ÷ backend que veio do front
  // não responderam a pesquisa
  const naoResp=Math.max(0,(p.compradores_front||0)-(p.compradores_responderam||0));
  const taxaResp=p.compradores_front>0?100*(p.compradores_responderam||0)/p.compradores_front:0;
  // custo estimado por comprador de um segmento = CPA médio ÷ participação do segmento (extrapola a amostra p/ todos os compradores)
  const custoSeg=(share)=> (cpaFlat!=null && share>0) ? cpaFlat/share : null;
  const finBlock=`<h3 style="margin:2px 0 8px">Resultado do funil no período selecionado <span class="mini" style="text-transform:none">faturamento e gasto do Meta do funil ${esc(currentFunnel().label)} no período escolhido no topo</span></h3>
    <div class="kpis" style="margin-bottom:16px">
      <div class="kpi"><div class="k-l">Faturamento (front)</div><div class="k-v">${fmtMoney0(faturamento)}</div><div class="k-s">receita do funil no período</div></div>
      <div class="kpi"><div class="k-l">Investimento (Meta)</div><div class="k-v">${fmtMoney0(investimento)}</div><div class="k-s">gasto em mídia no período</div></div>
      <div class="kpi ${custoLiq>=0?'good':'danger'}"><div class="k-l">Custo líquido</div><div class="k-v" style="color:${custoLiq>=0?'#137333':'#c5221f'}">${fmtMoney0(custoLiq)}</div><div class="k-s">faturamento − investimento</div></div>
      <div class="kpi"><div class="k-l">CPL (preencheu pesquisa)</div><div class="k-v">${cpl!=null?fmtMoney0(cpl):'—'}</div><div class="k-s">${fmtNum(respP)} responderam no período</div></div>
      <div class="kpi ${cpaBackend!=null&&cpaBackend<0?'danger':''}"><div class="k-l">CPA backend (via front)</div><div class="k-v" style="color:${cpaBackend!=null&&cpaBackend<0?'#c5221f':'inherit'}">${cpaBackend!=null?fmtMoney0(cpaBackend):'—'}</div><div class="k-s">custo líquido ÷ ${fmtNum(backendFront)} que vieram do front (de ${fmtNum(backendPer)} no total)</div></div>
    </div>`;
  // tabela de renda/investimento com % + custo estimado por comprador do segmento

  const bandTable=(titulo,arr,lbls)=>{

      <div class="kpi"><div class="k-l">Foram pro backend</div><div class="k-v">${fmtNum(p.backend)}</div><div class="k-s">alto ticket (mentoria/consult.)</div></div>
    </div>
    <h3 style="margin:2px 0 8px">Faixas (poder de investimento) <span class="mini" style="text-transform:none">custo = CPA médio ÷ participação da faixa (extrapolado p/ todos os compradores)</span></h3>
    <div class="tbl-wrap" style="max-height:none"><table><thead><tr>
      <th>Faixa</th><th class="num">Compradores</th><th class="num">% do total</th><th class="num">Custo/compr.</th><th class="num">Foram pro backend</th><th class="num">Taxa backend</th>
    </tr></thead><tbody>
    ${fx.map(f=>{const c=custoSeg(f.respondentes/p.total);return `<tr><td><b style="color:${faixaCor[f.faixa]||'#333'}">${f.faixa==='sem faixa'?'Sem faixa':'Faixa '+f.faixa}</b></td>
      <td class="num">${fmtNum(f.respondentes)}</td><td class="num">${(100*f.respondentes/p.total).toFixed(0)}%</td>
      <td class="num" style="font-weight:700">${c!=null?fmtMoney0(c):'—'}</td>
      <td class="num">${f.backend||0}</td><td class="num">${f.respondentes?(100*(f.backend||0)/f.respondentes).toFixed(1):'0'}%</td></tr>`;}).join('')}
    <tr style="border-top:2px solid #ddd"><td><b>Total</b></td><td class="num"><b>${fmtNum(p.total)}</b></td><td class="num"><b>100%</b></td><td class="num"><b>${cpaFlat!=null?fmtMoney0(cpaFlat):'—'}</b></td><td class="num"><b>${fmtNum(p.backend)}</b></td><td class="num"></td></tr>
    </tbody></table></div>
    <div class="info-box" style="margin-top:10px">⚠️ <b>${p.total?(100*semCaixa/p.total).toFixed(0):0}% dos compradores do IniciAmazon declaram não ter caixa para investir</b>. O front de R$37 está trazendo majoritariamente público sem caixa. O backend (alto ticket) só veio de Faixa A e B — nenhum comprador "sem faixa" foi pro backend. Para escalar o backend, o gargalo é a <b>qualidade do lead que o front atrai</b>, não a oferta.</div>

// ── Comparativo temporal 1D / 2D / 3D / 5D ──────────────────────────────────
async function fetchComparativo(){
  S._compLoading=true; render();
  try{
    const today=brToday();
    const daysAgo = d => Math.round((new Date(today+'T00:00:00Z') - new Date(d+'T00:00:00Z'))/864e5);
    const accs=(S.accounts||[]).filter(a=>a.currency==='BRL');
    const since=addDaysStr(today,-4), until=today;
    const camp={};
    // gasto diário (últimos 5 dias) por campanha
    for(const a of accs){
      const tok=getTokenById(a._tokenId); if(!tok) continue;
      let url=`${GQL}/${a.id}/insights?level=campaign&limit=500&time_increment=1&time_range=${encodeURIComponent(JSON.stringify({since,until}))}&fields=campaign_id,campaign_name,spend&access_token=${encodeURIComponent(tok)}`;
      let pages=0;
      try{
        while(url && pages<15){
          pages++;
          const j=await (await fetch(url)).json();
          if(j.error) break;
          for(const r of (j.data||[])){
            const id=r.campaign_id; if(!id) continue;
            const dA=daysAgo(r.date_start); if(dA<0||dA>4) continue;
            if(!camp[id]) camp[id]={name:r.campaign_name||id, s1:0,s2:0,s3:0,s5:0, r1:0,r2:0,r3:0,r5:0};
            const sp=parseFloat(r.spend)||0, c=camp[id];
            if(dA<1)c.s1+=sp; if(dA<2)c.s2+=sp; if(dA<3)c.s3+=sp; if(dA<5)c.s5+=sp;
          }
          url=(j.paging&&j.paging.next)?j.paging.next:null;
        }
      }catch(e){}
    }
    // faturamento (Supabase) por janela móvel — 4 chamadas
    const at=s=>`${s}T00:00:00-03:00`;
    for(const [n,key] of [[1,'r1'],[2,'r2'],[3,'r3'],[5,'r5']]){
      try{
        const res=await fetch(`${S.sbUrl}/rest/v1/rpc/meta_revenue_by_ad`,{method:'POST',headers:{'Content-Type':'application/json','apikey':S.sbKey,'Authorization':'Bearer '+S.sbKey},body:JSON.stringify({p_since:at(addDaysStr(today,-(n-1))), p_until:at(addDaysStr(today,1))})});
        if(res.ok){ for(const r of (await res.json())){ const id=r.campaign_id; if(!id||!camp[id]) continue; camp[id][key]+=parseFloat(r.receita_bruta)||0; } }
      }catch(e){}
    }
    S._comp=camp;
  }catch(e){ alert('Erro no comparativo: '+e.message); }
  S._compLoading=false; render();
}
// Critério de corte/escala baseado SÓ no ROAS por janela (árvore definida com o Arthur)
// Escala olha só HOJE; corte/redução usa a cascata hoje → 3D → 5D.
function acaoSugerida(c, B, cpaAlvo){
  const roas=(s,r)=> s>0 ? r/s : null;
  const r1=roas(c.s1,c.r1), r3=roas(c.s3,c.r3), r5=roas(c.s5,c.r5);
  // ESCALA: olha só hoje. ROAS de hoje ≥ breakeven → +30%. Exige gasto mínimo hoje (evita ruído).
  if(r1!=null && r1>=B){
    if(c.s1 >= 0.5*cpaAlvo) return {a:'ESCALAR', cls:'bom', pct:1.3, why:'ROAS hoje '+fmtRoas(r1)+' ≥ '+fmtRoas(B)+' (escala olha só hoje)'};
    return {a:'AGUARDA', cls:'novo', why:'positiva hoje ('+fmtRoas(r1)+') mas gasto de hoje ainda baixo ('+fmtMoney0(c.s1)+')'};
  }
  // hoje negativa (ou sem gasto hoje)
  if(r3==null) return {a:'AGUARDA', cls:'novo', why:'sem dado no 3D para decidir'};
  if(r3>=B) return {a:'REDUZIR', cls:'observar', pct:0.7, why:'negativa hoje ('+fmtRoas(r1)+'), 3D no lucro ('+fmtRoas(r3)+') → reduzir 30%'};
  // hoje neg + 3D neg
  if(r5==null) return {a:'AGUARDA', cls:'novo', why:'sem dado no 5D para decidir'};
  if(r5>=B) return {a:'REDUZIR', cls:'observar', pct:0.7, why:'negativa hoje e 3D, mas 5D no lucro ('+fmtRoas(r5)+') → reduzir 30%'};
  return {a:'DESATIVAR', cls:'ruim', why:'negativa em hoje, 3D e 5D → desativar'};
}
function renderComparativoCard(A){
  if(S._compLoading) return `<div class="card"><div class="empty"><span class="loading"></span> Carregando comparativo 1D/2D/3D/5D…</div></div>`;
  if(!S._comp) return `<div class="card"><h2>📊 Comparativo temporal + Ações</h2>
    <p class="sub" style="margin-bottom:10px">Gasto, faturamento e lucro por janela (hoje, 2, 3 e 5 dias), com a ação sugerida (escalar / reduzir / desativar) e botão para executar direto na conta. Puxa 5 dias diários do Meta + receita por janela do Supabase.</p>
    <button class="btn btn-purple" onclick="fetchComparativo()">Carregar comparativo</button></div>`;
  const byId={}; (S.data||[]).forEach(r=>byId[r.id]=r);
  // só campanhas ATIVAS agora (pausadas/desativadas já saíram, não sujam a análise)
  let rows=Object.entries(S._comp).map(([id,c])=>({id,...c})).filter(c=>matchFunnel(c.name) && c.s5>0 && ((byId[c.id]||{}).effective_status==='ACTIVE')).sort((a,b)=>b.s5-a.s5);
  const B=parseFloat(A.roasAlvo)||1, cpaAlvo=A.cpaAlvo||9999;

      <button class="btn btn-red btn-sm" onclick="execLote('DESATIVAR')" ${nD?'':'disabled'}>🔴 Desativar (${nD})</button>

async function apiPost(id, body, tok){
  const p=new URLSearchParams(body);
  const res=await fetch(`${GQL}/${id}?${p.toString()}&access_token=${encodeURIComponent(tok)}`, {method:'POST'});
  const j=await res.json();
  if(j.error) throw new Error('('+j.error.code+') '+j.error.message);
  return j;
}
// Evita reagir na mesma campanha várias vezes seguidas no mesmo dia (causa reaprendizado do CBO — foi a causa
// confirmada do CPM subir 16% depois de escalar a mesma campanha 4x em poucas horas)
const COOLDOWN_H = 6;
function lastActionFor(campaignId){
  if(!S._otim || !S._otim.length) return null;
  const evs=S._otim.filter(e=>String(e.campaign_id)===String(campaignId));
  if(!evs.length) return null;
  return evs.reduce((a,b)=> new Date(a.created_at) > new Date(b.created_at) ? a : b);
}
const hoursSince=iso=>(Date.now()-new Date(iso).getTime())/36e5;
const fmtHoras=h=> h<1 ? Math.round(h*60)+'min' : Math.round(h)+'h';
function jaFeitoRecente(id){ if(S._exec&&S._exec[id]) return true; const l=lastActionFor(id); return !!(l && hoursSince(l.created_at) < COOLDOWN_H); }
function acaoBody(id){
  const c=S._comp&&S._comp[id]; const d=(S.data||[]).find(r=>r.id===id);
  if(!c||!d) return null;
  const A=analyze(); const act=acaoSugerida({id,...c}, parseFloat(A.roasAlvo)||1, A.cpaAlvo||80);
  const daily=+(d.daily_budget||0), tok=getTokenById(d._tokenId);
  if(act.a==='DESATIVAR') return {act, body:{status:'PAUSED'}, resumo:'PAUSAR a campanha', tok, name:d.name, orcAntes:+(daily/100).toFixed(2), orcDepois:0};
  if((act.a==='ESCALAR'||act.a==='REDUZIR') && daily>0){ const novo=Math.round(daily*act.pct);
    return {act, body:{daily_budget:String(novo)}, resumo:(act.a==='ESCALAR'?'AUMENTAR':'REDUZIR')+' orçamento de R$ '+(daily/100).toFixed(2)+' para R$ '+(novo/100).toFixed(2), tok, name:d.name, orcAntes:+(daily/100).toFixed(2), orcDepois:+(novo/100).toFixed(2)}; }
  return null;
}
async function execAcao(id){
  const info=acaoBody(id);
  if(!info){ alert('Sem ação executável (campanha ABO com orçamento no conjunto, ou dado insuficiente).'); return; }
  if(!info.tok){ alert('Token da conta não encontrado.'); return; }
  if(!confirm('Confirmar: '+info.resumo+'?\n\n'+info.name)) return;
  try{ await apiPost(id, info.body, info.tok); S._exec=S._exec||{}; S._exec[id]=info.act.a; await logOtim(id, info.act.a, info.orcAntes, info.orcDepois); await refreshOtim(); render(); }
  catch(e){ alert('Erro ao executar: '+e.message); }
}
// Executa com percentual escolhido manualmente (seletor +30/+50/+100% no escalar, ou "manter reduzida" no lugar de pausar)
async function execCustom(id, tipoLabel, pct){
  const d=(S.data||[]).find(r=>r.id===id);
  if(!d){ alert('Campanha não encontrada.'); return; }
  const daily=+(d.daily_budget||0), tok=getTokenById(d._tokenId);
  if(!daily){ alert('Campanha ABO (orçamento no conjunto), não dá para ajustar por aqui.'); return; }
  if(!tok){ alert('Token da conta não encontrado.'); return; }
  const novo=Math.round(daily*pct);
  const pctTxt=(pct>=1?'+':'')+Math.round((pct-1)*100)+'%';
  const resumo=(pct>1?'AUMENTAR':'REDUZIR')+' orçamento de R$ '+(daily/100).toFixed(2)+' para R$ '+(novo/100).toFixed(2)+' ('+pctTxt+')';
  if(!confirm('Confirmar: '+resumo+'?\n\n'+d.name)) return;
  try{
    await apiPost(id, {daily_budget:String(novo)}, tok);
    S._exec=S._exec||{}; S._exec[id]=tipoLabel;
    await logOtim(id, tipoLabel, +(daily/100).toFixed(2), +(novo/100).toFixed(2));
    await refreshOtim(); render();
  }catch(e){ alert('Erro ao executar: '+e.message); }
}
async function execLote(tipo){
  const B=parseFloat(S.roasAlvo)||1; const A=analyze(); const cpaAlvo=A.cpaAlvo||80;
  const byId={}; (S.data||[]).forEach(r=>byId[r.id]=r);
  const ids=Object.entries(S._comp).map(([id,c])=>({id,...c})).filter(c=>matchFunnel(c.name)&&c.s5>0 && ((byId[c.id]||{}).effective_status==='ACTIVE'))
    .filter(c=>acaoSugerida(c,B,cpaAlvo).a===tipo && !jaFeitoRecente(c.id)).map(c=>c.id);
  if(!ids.length){ alert('Nada para executar.'); return; }
  const rot=tipo==='ESCALAR'?'ESCALAR +30%':tipo==='REDUZIR'?'REDUZIR −30%':'DESATIVAR';
  if(!confirm('Confirmar '+rot+' em '+ids.length+' campanha(s)? Isso aplica direto na conta.')) return;
  let ok=0, fail=0; const erros=[];
  for(const id of ids){
    const info=acaoBody(id); if(!info){ fail++; continue; }
    try{ await apiPost(id, info.body, info.tok); S._exec=S._exec||{}; S._exec[id]=info.act.a; await logOtim(id, info.act.a, info.orcAntes, info.orcDepois); ok++; }
    catch(e){ fail++; erros.push(id+': '+e.message); }
  }
  await refreshOtim();
  alert('Lote '+rot+': '+ok+' aplicada(s), '+fail+' falha(s).'+(erros.length?'\n\n'+erros.slice(0,6).join('\n'):''));
  render();
}

function intradayDate(){ const t=brToday(); if(S.period==='today') return t; if(S.period==='custom') return customRange().until; return addDaysStr(t,-1); }
async function fetchIntraday(){
  if(S._intradayLoading) return; S._intradayLoading=true; render();
  try{
    const today=intradayDate();
    const accs=(S.accounts||[]).filter(a=>a.currency==='BRL');
    const spendH=new Array(24).fill(0);
    const since=addDaysStr(today,-1);
    for(const a of accs){
      const tok=getTokenById(a._tokenId); if(!tok) continue;
      const shift=BR_OFFSET-(a._tzOffset!=null?Number(a._tzOffset):BR_OFFSET);
      let url=`${GQL}/${a.id}/insights?`+[
        'level=campaign','limit=500',
        'breakdowns=hourly_stats_aggregated_by_advertiser_time_zone',
        'time_increment=1',
        'time_range='+encodeURIComponent(JSON.stringify({since, until:today})),
        'fields='+encodeURIComponent('spend,campaign_name,campaign_id'),
        'access_token='+encodeURIComponent(tok)
      ].join('&');
      let pages=0;
      while(url && pages<20){ pages++;
        const j=await (await fetch(url)).json(); if(j.error) break;
        for(const r of (j.data||[])){
          if(!matchFunnel(r.campaign_name)) continue;
          if(S.selCampaign && String(r.campaign_id)!==String(S.selCampaign)) continue;
          const hStr=r.hourly_stats_aggregated_by_advertiser_time_zone||'00';
          const hr=parseInt(hStr.slice(0,2),10)||0;
          const base=new Date(r.date_start+'T00:00:00Z'); base.setUTCHours(hr+shift);
          if(base.toISOString().slice(0,10)!==today) continue;
          spendH[base.getUTCHours()]+=parseFloat(r.spend)||0;
        }
        url=(j.paging&&j.paging.next)?j.paging.next:null;
      }
    }
    const revH=new Array(24).fill(0);
    try{
      const at=s=>`${s}T00:00:00-03:00`;
      const res=await fetch(`${S.sbUrl}/rest/v1/rpc/revenue_hourly`,{method:'POST',headers:{'Content-Type':'application/json','apikey':S.sbKey,'Authorization':'Bearer '+S.sbKey},body:JSON.stringify({p_since:at(today), p_until:at(addDaysStr(today,1)), p_funil: currentFunnel().match||'', p_campaign: S.selCampaign||null})});
      if(res.ok){ for(const row of await res.json()){ const h=+row.hora; if(h>=0&&h<24) revH[h]=parseFloat(row.receita)||0; } }
    }catch(e){}
    S._intraday={date:today, spendH, revH};
  }catch(e){ S._intraday={date:brToday(), spendH:new Array(24).fill(0), revH:new Array(24).fill(0), _error:e.message}; }
  S._intradayLoading=false; render();
}

function svgIntraday(sp, rv, events, fullDay){
  const W=880,H=250,padL=56,padR=14,padT=18,padB=42, plotW=W-padL-padR, plotH=H-padT-padB;

  let lastData=0; for(let h=0;h<24;h++){ if(sp[h]>0||rv[h]>0) lastData=h; }
  const lastH=fullDay ? 23 : Math.max(nowH,lastData,1);

  let area='M'+x(0)+' '+y(0); for(let h=0;h<=lastH;h++) area+=' L'+x(h).toFixed(1)+' '+y(cr[h]).toFixed(1); area+=' L'+x(lastH).toFixed(1)+' '+y(0)+' Z';

  let xl=''; for(let h=0;h<=23;h+=3) xl+=`<text x="${x(h).toFixed(1)}" y="${H-padB+16}" font-size="9" text-anchor="middle" fill="#aaa">${String(h).padStart(2,'0')}h</text>`;
  let slots=''; [9,12,15,18,21].forEach(s=>{ slots+=`<line x1="${x(s).toFixed(1)}" y1="${padT}" x2="${x(s).toFixed(1)}" y2="${padT+plotH}" stroke="#efeaff"/>`; });
  // ROAS acumulado anotado nos horários de análise
  let ann=''; [9,12,15,18,21].forEach(s=>{ if(s<=lastH && cs[s]>0){ const ro=cr[s]/cs[s]; ann+=`<text x="${x(s).toFixed(1)}" y="${(y(cr[s])-6).toFixed(1)}" font-size="9" text-anchor="middle" fill="${ro>=1?'#137333':'#c5221f'}" font-weight="700">${ro.toFixed(2)}x</text>`; } });
  // Marca as otimizações exatas: agrupa eventos a menos de 5min de distância num só marcador
  // (tooltip nativo no hover mostra hora, campanha, ação e orçamento antes→depois de cada uma)
  let marks='';

  const groups=[];
