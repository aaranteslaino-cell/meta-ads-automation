<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1c1e21;min-height:100vh}
.wrap{max-width:940px;margin:0 auto;padding:20px}
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.1)}

h2{font-size:17px;margin-bottom:16px}
h3{font-size:14px;margin-bottom:12px;color:#444}
.tabs{display:flex;gap:4px;background:#f0f2f5;padding:4px;border-radius:10px;margin-bottom:20px}

input:disabled,select:disabled{background:#f5f5f5;color:#aaa}
textarea{resize:vertical;min-height:72px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.btn{padding:9px 18px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:all .15s}
.btn:disabled{opacity:.45;cursor:not-allowed}

.btn-green{background:#42b72a;color:#fff}.btn-green:not(:disabled):hover{background:#36a420}
.btn-red{background:#fa3e3e;color:#fff}.btn-red:not(:disabled):hover{background:#d32f2f}
.btn-gray{background:#e4e6eb;color:#1c1e21}.btn-gray:not(:disabled):hover{background:#d0d2d8}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-full{width:100%;padding:13px;font-size:15px}
.box{border:1.5px solid #e4e6eb;border-radius:10px;padding:16px;margin-bottom:14px}
.box-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}
.b-blue{background:#e7f0fd;color:#1877f2}
.b-green{background:#e6f4ea;color:#137333}
.b-orange{background:#fef3e2;color:#c47a00}
.b-red{background:#fce8e6;color:#c5221f}
.log-wrap{background:#111;border-radius:8px;padding:14px;font-family:monospace;font-size:12.5px;max-height:340px;overflow-y:auto}
.lg{margin-bottom:3px}.lg.s{color:#4caf50}.lg.e{color:#f44336}.lg.i{color:#90caf9}.lg.w{color:#ffb74d}
.rv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f0f2f5;font-size:14px}
.rv-lbl{color:#65676b}.rv-val{font-weight:500}
.err-box{background:#fce8e6;border-radius:8px;padding:11px 14px;margin-bottom:14px}
.err-box li{color:#c5221f;font-size:13px;margin-left:16px;margin-bottom:3px}
.info-box{background:#e7f0fd;border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:#1877f2}
.warn-box{background:#fef3e2;border-radius:8px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:#c47a00}
.pl-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.pl-item{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
.pl-section{margin-bottom:10px}
.pl-title{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;margin-bottom:5px}
.connected{display:flex;align-items:center;gap:6px;font-size:13px;color:#42b72a;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#42b72a}
hr{border:none;border-top:1px solid #e4e6eb;margin:14px 0}
.hint{font-size:11px;color:#999;margin-top:4px}
.file-chosen{font-size:12px;color:#42b72a;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Meta Ads Automation</h1>
    <p style="color:#888;font-size:13px">Criação automatizada de campanhas via Marketing API</p>
  </div>
  <div id="root"></div>
</div>

<script>
// ── Constantes ────────────────────────────────────────────────────────────────
const GQL = 'https://graph.facebook.com/v21.0';

const OBJECTIVES = [
  {v:'OUTCOME_SALES',l:'Vendas'},
  {v:'OUTCOME_LEADS',l:'Leads'},
  {v:'OUTCOME_TRAFFIC',l:'Tráfego'},
  {v:'OUTCOME_ENGAGEMENT',l:'Engajamento'},
  {v:'OUTCOME_AWARENESS',l:'Reconhecimento de marca'},
  {v:'OUTCOME_APP_PROMOTION',l:'Promoção de App'}
];

const OPT_GOAL = {
  OUTCOME_SALES:'OFFSITE_CONVERSIONS',
  OUTCOME_LEADS:'OFFSITE_CONVERSIONS',   // pixel; use LEAD_GENERATION para Instant Forms
  OUTCOME_TRAFFIC:'LINK_CLICKS',
  OUTCOME_ENGAGEMENT:'POST_ENGAGEMENT',
  OUTCOME_AWARENESS:'REACH',
  OUTCOME_APP_PROMOTION:'APP_INSTALLS'
};

function getDestinationType(objective){
  const map = {OUTCOME_SALES:'WEBSITE',OUTCOME_LEADS:'WEBSITE',OUTCOME_TRAFFIC:'WEBSITE',OUTCOME_APP_PROMOTION:'APP'};
  return map[objective] || null;
}

const EVENTS = ['PURCHASE','INITIATE_CHECKOUT','ADD_TO_CART','VIEW_CONTENT',
  'LEAD','COMPLETE_REGISTRATION','SUBSCRIBE','CONTACT','FIND_LOCATION'];

const CTAS = ['LEARN_MORE','SHOP_NOW','SIGN_UP','GET_OFFER','BOOK_TRAVEL',
  'DOWNLOAD','WATCH_MORE','APPLY_NOW','CONTACT_US','GET_QUOTE',
  'SUBSCRIBE','CALL_NOW','ORDER_NOW','BUY_NOW','SEE_MORE','MESSAGE_PAGE'];

const PLACEMENTS = {
  'Facebook':[
    {id:'fb_feed',l:'Feed'},
    {id:'fb_reels',l:'Reels'},
    {id:'fb_stories',l:'Stories'},
    {id:'fb_right_column',l:'Coluna direita'},
    {id:'fb_marketplace',l:'Marketplace'},
    {id:'fb_video_feeds',l:'Video Feeds'},
    {id:'fb_search',l:'Pesquisa'},
    {id:'fb_instream',l:'In-stream'}
  ],
  'Instagram':[
    {id:'ig_feed',l:'Feed'},
    {id:'ig_stories',l:'Stories'},
    {id:'ig_reels',l:'Reels'},
    {id:'ig_explore',l:'Explorar'},
    {id:'ig_shop',l:'Loja'},
    {id:'ig_profile',l:'Perfil'}
  ],
  'Messenger':[
    {id:'msg_inbox',l:'Caixa de entrada'},
    {id:'msg_stories',l:'Stories'}
  ],
  'Audience Network':[
    {id:'an_native',l:'Nativo/Banner'},
    {id:'an_rewarded',l:'Recompensado'}
  ]
};

const PL_MAP = {
  fb_feed:['facebook','feed'],
  fb_reels:['facebook','facebook_reels'],
  fb_stories:['facebook','story'],
  fb_right_column:['facebook','right_hand_column'],
  fb_marketplace:['facebook','marketplace'],
  fb_video_feeds:['facebook','video_feeds'],
  fb_search:['facebook','search'],
  fb_instream:['facebook','instream_video'],
  ig_feed:['instagram','stream'],
  ig_stories:['instagram','story'],
  ig_reels:['instagram','reels'],
  ig_explore:['instagram','explore'],
  ig_shop:['instagram','explore_home'],
  ig_profile:['instagram','profile_feed'],
  msg_inbox:['messenger','messenger_home'],
  msg_stories:['messenger','story'],
  an_native:['audience_network','classic'],
  an_rewarded:['audience_network','rewarded_video']
};

// ── Estado ────────────────────────────────────────────────────────────────────
let S = loadState() || {
  tokens:[],          // [{id, label, token}] — múltiplos tokens (BMs diferentes)
  token:'',           // legado: ainda preenchido com o token da conta ativa
  connected:false,
  accounts:[],        // cada conta tem _tokenId indicando qual token usar
  selectedAccount:'',
  pixels:[],
  pages:[],           // cada página tem _tokenId
  catalogs:[],
  igCache:{},
  tab:'campaign',
  log:[],
  running:false,
  camp:{
    name:'',
    objective:'OUTCOME_SALES',
    budgetType:'CBO',
    budgetPeriod:'DAILY',
    budget:'',
    bidStrategy:'LOWEST_COST_WITHOUT_CAP',
    status:'PAUSED',
    shareAdsetBudget:false,
    oneAdsetPerAd:false,
    duplicateCount:'1'
  },
  adsets:[],
  ads:[]
};
// Nunca restaurar estado "conectado" – força nova autenticação
S.connected = false;
S.running = false;
// Sempre começa sem conta selecionada — usuário escolhe manualmente
S.selectedAccount = '';
S.accounts = []; S.pages = []; S.pixels = []; S.catalogs = []; S.igCache = {};
// Migração: se tiver token legado mas sem tokens[], cria um
if(S.token && (!S.tokens || !S.tokens.length)){
  S.tokens = [{id:Date.now(), label:'Token 1', token:S.token}];
}
if(!Array.isArray(S.tokens)) S.tokens = [];

function loadState(){
  try{ return JSON.parse(localStorage.getItem('maa_state')); }catch(e){ return null; }
}
function saveState(){
  try{
    const save = {...S};
    // Não salvar os objetos File (não serializáveis)
    save.ads = S.ads.map(a=>({...a, imageFile:null, videoFile:null}));
    save.log = [];
    localStorage.setItem('maa_state', JSON.stringify(save));
  }catch(e){}
}

// ── Helpers ───────────────────────────────────────────────────────────────────
const $  = id => document.getElementById(id);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const https = url => { url=(url||'').trim(); return url&&!url.startsWith('http')?'https://'+url:url; };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
let _uid = Date.now();
const uid = () => ++_uid;

function log(msg, type='i'){
  S.log.push({msg, type, t: new Date().toLocaleTimeString('pt-BR')});
  const box = $('logbox');
  if(box){
    const d = document.createElement('div');
    d.className = 'lg '+type;
    d.textContent = `[${S.log[S.log.length-1].t}] ${msg}`;
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }
}

// ── Helpers de token ──────────────────────────────────────────────────────────
function getTokenById(id){
  return S.tokens.find(t=>t.id===id)?.token || '';
}
function getAccountToken(accountId){
  const acc = S.accounts.find(a=>a.id===accountId);
  if(acc && acc._tokenId) return getTokenById(acc._tokenId);
  return S.token; // fallback
}
function getActiveToken(){
  return getAccountToken(S.selectedAccount) || S.token || S.tokens[0]?.token || '';
}

// ── API ───────────────────────────────────────────────────────────────────────
async function api(path, method='GET', data=null, tok=null){
  const t = tok || getActiveToken();
  let url = path.startsWith('http') ? path : GQL+path;
  const opts = {method, headers:{}};

  if(method==='GET'){
    const sep = url.includes('?')?'&':'?';
    url += sep+'access_token='+encodeURIComponent(t);
    if(data) Object.entries(data).forEach(([k,v])=>{
      url += '&'+encodeURIComponent(k)+'='+encodeURIComponent(typeof v==='object'?JSON.stringify(v):v);
    });
  } else {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify({...(data||{}), access_token:t});
  }

  const res = await fetch(url, opts);
  const json = await res.json();
  if(json.error){
    const e = json.error;
    const sub = e.error_subcode ? '/'+e.error_subcode : '';
    const detail = e.error_user_msg && e.error_user_msg !== e.message ? ' → '+e.error_user_msg : '';
    throw new Error(`(${e.code}${sub}) ${e.message}${detail}`);
  }
  return json;
}

async function apiForm(path, fd, tok=null){
  // Garantir que o access_token correto está no FormData
  const t = tok || getActiveToken();
  if(t){
    fd.delete('access_token');
    fd.append('access_token', t);
  }
  const res = await fetch(GQL+path, {method:'POST', body:fd});
  const json = await res.json();
  if(json.error) throw new Error(`(${json.error.code}) ${json.error.message}`);
  return json;
}

// ── Conectar ──────────────────────────────────────────────────────────────────
async function connect(){
  if(!S.tokens.length){ alert('Adicione pelo menos 1 token antes de conectar.'); return; }

  const btn = $('btn-connect');
  if(btn){ btn.disabled=true; btn.textContent='Conectando...'; }

  S.accounts = [];
  S.pages = [];
  const tokenErrors = [];

  for(const tk of S.tokens){
    if(!tk.token) continue;
    try {
      const r1 = await api('/me/adaccounts','GET',{fields:'id,name,account_id,currency',limit:500}, tk.token);
      const accs = (r1.data || []).map(a=>({...a, _tokenId:tk.id, _tokenLabel:tk.label}));
      S.accounts.push(...accs);
    } catch(e){
      tokenErrors.push(`[${tk.label}] ${e.message}`);
    }
    try {
      const r2 = await api('/me/accounts','GET',{fields:'id,name,access_token',limit:500}, tk.token);
      const pgs = (r2.data || []).map(p=>({...p, _tokenId:tk.id}));
      S.pages.push(...pgs);
    } catch(e){ /* sem páginas tudo bem */ }
  }

  // Dedup contas (mesma conta pode aparecer em múltiplos tokens)
  const seen = new Set();
  S.accounts = S.accounts.filter(a=>{
    if(seen.has(a.id)) return false;
    seen.add(a.id); return true;
  });

  if(!S.accounts.length){
    if(btn){ btn.disabled=false; btn.textContent='Conectar'; }
    const msg = tokenErrors.length ? '\n\nErros:\n'+tokenErrors.join('\n') : '';
    alert('Nenhuma conta de anúncios encontrada.'+msg);
    return;
  }

  // Não pré-seleciona nenhuma conta — usuário escolhe manualmente
  S.selectedAccount = '';
  S.token = '';
  S.pixels = []; S.catalogs = []; S.igCache = {};

  S.connected = true;
  log(`Conectado! ${S.accounts.length} conta(s) encontrada(s) em ${S.tokens.length} token(s). Selecione a conta para começar.`,'s');
  if(tokenErrors.length) tokenErrors.forEach(e=>log('⚠️ '+e,'w'));
  S.tab = 'campaign';
  saveState();
  render();
}

function addToken(){
  const labelInp = $('new-tok-label');
  const tokInp = $('new-tok-value');
  const label = (labelInp?.value || '').trim();
  const token = (tokInp?.value || '').trim();
  if(!label || !token){ alert('Preencha label e token.'); return; }
  S.tokens.push({id:Date.now()+Math.random(), label, token});
  saveState(); render();
}
function removeToken(id){
  if(!confirm('Remover este token?')) return;
  S.tokens = S.tokens.filter(t=>t.id!==id);
  saveState(); render();
}
function editTokenLabel(id, newLabel){
  const tk = S.tokens.find(t=>t.id===id);
  if(tk){ tk.label = newLabel; saveState(); }
}

async function loadAccountAssets(accountId){
  try {
    const r = await api(`/${accountId}/adspixels`,'GET',{fields:'id,name',limit:200});
    S.pixels = r.data || [];
  } catch(e){ S.pixels=[]; }
  try {
    const r = await api(`/${accountId}/product_catalogs`,'GET',{fields:'id,name',limit:200});
    S.catalogs = r.data || [];
  } catch(e){ S.catalogs=[]; }
}

// ── Resolver instagram_user_id ───────────────────────────────────────────────
async function resolveIg(pageId){
  if(!pageId) return null;
  if(S.igCache[pageId]) return S.igCache[pageId];

  // Tentativa 1: instagram_business_account
  try {
    const r = await api(`/${pageId}`,'GET',{fields:'instagram_business_account'});
    if(r.instagram_business_account?.id){
      S.igCache[pageId] = r.instagram_business_account.id;
      log(`[IG] Página ${pageId} → conta vinculada: ${r.instagram_business_account.id}`,'i');
      return r.instagram_business_account.id;
    }
  } catch(e){}

  // Tentativa 2: page_backed_instagram_accounts via page token
  const pageTok = S.pages.find(p=>p.id===pageId)?.access_token;
  if(pageTok){
    try {
      const r = await api(`/${pageId}/page_backed_instagram_accounts`,'GET',{fields:'id'},pageTok);
      if(r.data?.[0]?.id){
        S.igCache[pageId] = r.data[0].id;
        log(`[IG] Página ${pageId} → page-backed: ${r.data[0].id}`,'i');
        return r.data[0].id;
      }
      // Criar conta page-backed
      const cr = await api(`/${pageId}/page_backed_instagram_accounts`,'POST',{},pageTok);
      if(cr.id){
        S.igCache[pageId] = cr.id;
        log(`[IG] Conta page-backed criada para ${pageId}: ${cr.id}`,'s');
        return cr.id;
      }
    } catch(e){ log(`[IG] page-backed falhou: ${e.message}`,'w'); }
  }

  log(`[IG] Nenhuma conta IG encontrada para página ${pageId} — criativo sem instagram_user_id`,'w');
  return null;
}

// ── Upload ────────────────────────────────────────────────────────────────────
async function uploadImage(file, accountId){
  log(`Upload de imagem: ${file.name}…`,'i');
  const tok = getAccountToken(accountId);
  const fd = new FormData();
  fd.append('filename', file, file.name);
  const r = await apiForm(`/${accountId}/adimages`, fd, tok);
  const key = Object.keys(r.images)[0];
  log(`Imagem enviada. Hash: ${r.images[key].hash}`,'s');
  return r.images[key].hash;
}

async function uploadVideo(file, accountId){
  const sizeMB = (file.size/1024/1024).toFixed(1);
  const tok = getAccountToken(accountId);
  log(`Upload de vídeo: ${file.name} (${sizeMB} MB)…`,'i');

  // Para vídeos < 15 MB, tenta upload direto (mais rápido)
  if(file.size < 15*1024*1024){
    try{
      const fd = new FormData();
      fd.append('source', file, file.name);
      fd.append('title', file.name);
      const r = await apiForm(`/${accountId}/advideos`, fd, tok);
      log(`Vídeo enviado. ID: ${r.id}`,'s');
      return r.id;
    } catch(e){
      log(`Upload direto falhou (${e.message}). Tentando chunked…`,'w');
    }
  }

  // Upload em chunks (resumable) — para vídeos grandes
  // Fase 1: start
  const startFd = new FormData();
  startFd.append('upload_phase', 'start');
  startFd.append('file_size', file.size);
  const startR = await apiForm(`/${accountId}/advideos`, startFd, tok);
  const sessionId = startR.upload_session_id;
  const videoId = startR.video_id;
  let startOffset = parseInt(startR.start_offset);
  let endOffset = parseInt(startR.end_offset);
  log(`Sessão iniciada: ${sessionId}`,'i');

  // Fase 2: transfer (chunks)
  while(startOffset < endOffset){
    const chunk = file.slice(startOffset, endOffset);
    const transferFd = new FormData();
    transferFd.append('upload_phase', 'transfer');
    transferFd.append('upload_session_id', sessionId);
    transferFd.append('start_offset', startOffset);
    transferFd.append('video_file_chunk', chunk, file.name);
    const tr = await apiForm(`/${accountId}/advideos`, transferFd, tok);
    const pct = ((parseInt(tr.start_offset)/file.size)*100).toFixed(0);
    log(`  ↳ ${pct}% (${(parseInt(tr.start_offset)/1024/1024).toFixed(1)}/${sizeMB} MB)`,'i');
    startOffset = parseInt(tr.start_offset);
    endOffset = parseInt(tr.end_offset);
  }

  // Fase 3: finish
  const finishFd = new FormData();
  finishFd.append('upload_phase', 'finish');
  finishFd.append('upload_session_id', sessionId);
  await apiForm(`/${accountId}/advideos`, finishFd, tok);

  log(`Vídeo enviado. ID: ${videoId}`,'s');
  return videoId;
}

// ── Posicionamentos ───────────────────────────────────────────────────────────
function buildTargeting(adset){
  const targeting = {
    geo_locations:{ countries: [(adset.country||'BR').toUpperCase()] },
    age_min: parseInt(adset.ageMin)||18,
    age_max: parseInt(adset.ageMax)||65,
    // Meta exige declarar Público Advantage+ explicitamente (erro 1870227)
    targeting_automation: { advantage_audience: adset.advantageAudience ? 1 : 0 }
  };

  if(adset.gender && adset.gender!=='all')
    targeting.genders = [adset.gender==='male'?1:2];

  const ca = (adset.customAudiences||'').split(',').map(s=>s.trim()).filter(s=>s.length>4);
  const ea = (adset.excludedAudiences||'').split(',').map(s=>s.trim()).filter(s=>s.length>4);
  if(ca.length) targeting.custom_audiences = ca.map(id=>({id}));
  if(ea.length) targeting.excluded_custom_audiences = ea.map(id=>({id}));

  if(adset.placementType==='manual'){
    const sel = adset.placements || [];
    if(sel.length){
      const plats = new Set(), fb=[], ig=[], ms=[], an=[];
      sel.forEach(p=>{
        const m = PL_MAP[p]; if(!m) return;
        plats.add(m[0]);
        if(m[0]==='facebook') fb.push(m[1]);
        if(m[0]==='instagram') ig.push(m[1]);
        if(m[0]==='messenger') ms.push(m[1]);
        if(m[0]==='audience_network') an.push(m[1]);
      });
      targeting.publisher_platforms = [...plats];
      if(fb.length) targeting.facebook_positions = fb;
      if(ig.length) targeting.instagram_positions = ig;
      if(ms.length) targeting.messenger_positions = ms;
      if(an.length) targeting.audience_network_positions = an;
    }
  }
  return targeting;
}

// ── Validar ───────────────────────────────────────────────────────────────────
function validate(){
  const errs = [];
  const c = S.camp;
  if(!c.name.trim()) errs.push('Nome da campanha é obrigatório');
  if(c.budgetType==='CBO' && (!c.budget || isNaN(parseFloat(c.budget)) || parseFloat(c.budget)<=0)) errs.push('Orçamento da campanha inválido');
  if(c.budgetType==='ABO') S.adsets.forEach((a,i)=>{ if(!a.budget || isNaN(parseFloat(a.budget)) || parseFloat(a.budget)<=0) errs.push(`Conjunto ${i+1}: orçamento obrigatório para ABO`); });
  if(!S.selectedAccount) errs.push('Selecione uma conta de anúncio');
  if(!S.adsets.length) errs.push('Adicione pelo menos um conjunto');
  if(!S.ads.length) errs.push('Adicione pelo menos um anúncio');

  S.adsets.forEach((a,i)=>{
    const n=i+1;
    if(!a.name?.trim()) errs.push(`Conjunto ${n}: nome obrigatório`);
    if(['OUTCOME_SALES','OUTCOME_LEADS'].includes(c.objective) && !a.pixelId?.trim()) errs.push(`Conjunto ${n}: Pixel ID obrigatório para ${c.objective}`);
  });

  S.ads.forEach((a,i)=>{
    const n=i+1;
    if(!a.name?.trim()) errs.push(`Anúncio ${n}: nome obrigatório`);
    if(!a.pageId?.trim()) errs.push(`Anúncio ${n}: ID da Página obrigatório`);
    const hasText = (a.texts||[]).some(t=>t?.trim());
    if(!hasText) errs.push(`Anúncio ${n}: texto obrigatório`);
    if(!a.linkUrl?.trim() && a.type!=='catalog') errs.push(`Anúncio ${n}: URL de destino obrigatória`);
    if(a.type==='image' && !a.imageFile && !a.imageHash?.trim())
      errs.push(`Anúncio ${n}: imagem ou hash obrigatório`);
    if(a.type==='video' && !a.videoFile && !a.videoId?.trim())
      errs.push(`Anúncio ${n}: vídeo ou ID de vídeo obrigatório`);
    if(a.type==='catalog' && !a.productSetId?.trim())
      errs.push(`Anúncio ${n}: ID do Product Set obrigatório`);
  });
  return errs;
}

// ── Criar campanha ────────────────────────────────────────────────────────────
async function run(){
  const errs = validate();
  if(errs.length){ alert('Corrija antes de criar:\n\n'+errs.join('\n')); return; }

  S.running = true;
  S.log = [];
  S.tab = 'log';
  render();

  const acct = S.selectedAccount;
  const c = S.camp;

  try {
   const campDups = Math.max(1, parseInt(c.duplicateCount)||1);
   for(let campIdx=0; campIdx<campDups; campIdx++){
    if(campDups>1) log(`━━━━━ Campanha ${campIdx+1} de ${campDups} ━━━━━`,'i');

    // ── 1. Campanha
    log('Criando campanha…','i');
    const campName = campDups>1 ? `${c.name} (${campIdx+1})` : c.name;
    const campBody = {
      name: campName,
      objective: c.objective,
      status: c.status,
      special_ad_categories: ['NONE']
    };
    if(c.budgetType==='CBO'){
      if(c.budgetPeriod==='LIFETIME'){
        campBody.lifetime_budget = Math.round(parseFloat(c.budget)*100);
      } else {
        campBody.daily_budget = Math.round(parseFloat(c.budget)*100);
      }
      // bid_strategy sempre explícito na campanha CBO
      campBody.bid_strategy = c.bidStrategy || 'LOWEST_COST_WITHOUT_CAP';
    } else {
      // ABO: Meta API exige declarar se conjuntos compartilham orçamento (checkbox da UI)
      campBody.is_adset_budget_sharing_enabled = !!c.shareAdsetBudget;
    }
    log('[Campaign body] '+JSON.stringify(campBody),'i');
    const campR = await api(`/${acct}/campaigns`,'POST',campBody);
    log(`✓ Campanha criada: ${campR.id}`,'s');

    // ── 2. Adsets
    // Quando oneAdsetPerAd, cria N grupos (1 ad por grupo). Senão, 1 grupo com todos.
    const adGroups = c.oneAdsetPerAd ? S.ads.map(a=>[a]) : [S.ads];

    for(const adset of S.adsets){
      const dups = Math.max(1, parseInt(adset.duplicateCount)||1);

      for(let d=0; d<dups; d++){
        for(let g=0; g<adGroups.length; g++){
          const adsInGroup = adGroups[g];
          let adsetName = dups>1 ? `${adset.name} (${d+1})` : adset.name;
          if(c.oneAdsetPerAd && adGroups.length > 1){
            const adNameSuffix = adsInGroup[0]?.name || `Anúncio ${g+1}`;
            adsetName = `${adsetName} - ${adNameSuffix}`;
          }
        log(`Criando conjunto: ${adsetName}…`,'i');

        const optGoal = adset.optimizationGoal || OPT_GOAL[c.objective] || 'OFFSITE_CONVERSIONS';
        const isLeadGenForm = c.objective === 'OUTCOME_LEADS' && optGoal === 'LEAD_GENERATION';
        const needsPixel = c.objective === 'OUTCOME_SALES' ||
          (c.objective === 'OUTCOME_LEADS' && !isLeadGenForm);

        // Criativo dinâmico DESATIVADO por escolha do usuário.
        // Mesmo com múltiplas variações de texto/título, NÃO marca o conjunto como dinâmico.
        // Cada anúncio usa apenas o 1º texto + 1º título preenchidos.
        const anyMultiVariation = false;

        const adsetBody = {
          name: adsetName,
          campaign_id: campR.id,
          status: c.status,
          billing_event: 'IMPRESSIONS',
          optimization_goal: optGoal,
          targeting: buildTargeting(adset)
        };
        if(anyMultiVariation) adsetBody.is_dynamic_creative = true;

        const bidRequiresAmount = ['LOWEST_COST_WITH_BID_CAP','COST_CAP','MINIMUM_ROAS'].includes(c.bidStrategy);
        if(bidRequiresAmount && adset.bidAmount && parseFloat(adset.bidAmount) > 0){
          adsetBody.bid_amount = Math.round(parseFloat(adset.bidAmount) * 100);
        }

        // destination_type: LEAD_GENERATION usa ON_AD, não WEBSITE
        if(isLeadGenForm){
          adsetBody.destination_type = 'ON_AD';
        } else {
          const destType = getDestinationType(c.objective);
          if(destType) adsetBody.destination_type = destType;
        }

        if(needsPixel && adset.pixelId?.trim()){
          adsetBody.promoted_object = {
            pixel_id: adset.pixelId.trim(),
            custom_event_type: adset.conversionEvent || 'PURCHASE'
          };
          // attribution_spec só enviada quando configurada — algumas contas rejeitam com bid obrigatório
          if(adset.attributionClick || adset.attributionView){
            const spec = [];
            if(adset.attributionClick) spec.push({event_type:'CLICK_THROUGH', window_days:parseInt(adset.attributionClick)});
            if(adset.attributionView)  spec.push({event_type:'VIEW_THROUGH',  window_days:parseInt(adset.attributionView)});
            adsetBody.attribution_spec = spec;
          }
        } else if(isLeadGenForm){
          // Instant Forms: promoted_object usa page_id (da página do anúncio)
          const pageId = S.ads[0]?.pageId?.trim();
          if(pageId) adsetBody.promoted_object = { page_id: pageId };
        }

        // bid_strategy: em CBO pertence à campanha (não ao conjunto).
        // Em ABO, vai no conjunto. Nunca colocar bid_strategy no adset de CBO — causa erro 1815857.
        if(c.budgetType === 'ABO'){
          adsetBody.bid_strategy = c.bidStrategy || 'LOWEST_COST_WITHOUT_CAP';
        }

        if(c.budgetType==='ABO' && adset.budget){
          if(c.budgetPeriod==='LIFETIME'){
            adsetBody.lifetime_budget = Math.round(parseFloat(adset.budget)*100);
          } else {
            adsetBody.daily_budget = Math.round(parseFloat(adset.budget)*100);
          }
        }
        if(c.budgetType==='CBO' && adset.spendingLimit && parseFloat(adset.spendingLimit)>0){
          adsetBody.adset_budget_optimization_spending_limit = Math.round(parseFloat(adset.spendingLimit)*100);
        }

        const st = adset.startDate ? Math.floor(new Date(adset.startDate).getTime()/1000) : NaN;
        const et = adset.endDate   ? Math.floor(new Date(adset.endDate).getTime()/1000)   : NaN;
        if(adset.startDate && !isNaN(st)) adsetBody.start_time = st;
        if(adset.endDate   && !isNaN(et)) adsetBody.end_time   = et;

        // Catálogo no adset (campo separado, fora do promoted_object)
        const catalogAd = S.ads.find(a=>a.type==='catalog' && a.catalogId?.trim());
        if(catalogAd) adsetBody.product_catalog_id = catalogAd.catalogId;

        log('[Adset body] '+JSON.stringify(adsetBody),'i');
        const adsetR = await api(`/${acct}/adsets`,'POST',adsetBody);
        log(`✓ Conjunto criado: ${adsetR.id}`,'s');

        // ── 3. Anúncios (do grupo deste conjunto)
        for(const ad of adsInGroup){
          log(`Criando anúncio: ${ad.name}…`,'i');
          try {
            const linkUrl = https(ad.linkUrl);
            // UTM agora vai para url_tags (campo "Parâmetros de URL" no Meta Ads Manager),
            // não mais concatenado na URL do link
            const linkWithUtm = linkUrl;

            // Verificar se precisa de IG actor (Instagram nos posicionamentos ou automático)
            const hasIgPl = adset.placementType==='auto' ||
              (adset.placements||[]).some(p=>p.startsWith('ig_'));

            let igActorId = ad.igActorId?.trim() || null;
            // Se o usuário digitou @username ou texto não numérico, tenta resolver
            if(igActorId && !/^\d+$/.test(igActorId)){
              const handle = igActorId.replace(/^@/,'').trim();
              log(`[IG] Resolvendo @${handle} para ID numérico…`,'i');
              try{
                // Primeiro pega a conta IG da página (necessária para Business Discovery)
                const pageIgId = await resolveIg(ad.pageId);
                if(!pageIgId) throw new Error('Página sem Instagram vinculado para Business Discovery');
                const br = await api(`/${pageIgId}`,'GET',{
                  fields:`business_discovery.username(${handle}){id,username}`
                });
                if(br.business_discovery?.id){
                  igActorId = br.business_discovery.id;
                  log(`[IG] @${handle} → ${igActorId}`,'s');
                } else {
                  throw new Error('Conta não encontrada via Business Discovery');
                }
              } catch(e){
                throw new Error(`Não foi possível resolver "${ad.igActorId}". Use o ID numérico do Instagram (ex: 17841412345678901) ou deixe o campo vazio para detecção automática. Detalhe: ${e.message}`);
              }
            }
            // Se o usuário deixou em branco, NÃO tenta auto-resolver IG.
            // O anúncio será criado só com a página do Facebook.
            // (Comportamento anterior: tentava resolveIg(pageId) automaticamente)

            let creativeBody;

            // Normaliza texts/headlines (suporte a campos legados text/headline)
            const texts = (ad.texts||[ad.text||'']).filter(t=>t?.trim());
            const headlines = (ad.headlines||[ad.headline||'']).filter(h=>h?.trim());
            // Criativo dinâmico DESATIVADO — sempre usa só o 1º texto + 1º título
            const multiVariation = false;
            if((texts.length > 1 || headlines.length > 1) && ad === adsInGroup[0]){
              log(`ℹ️ Criativo dinâmico desativado: usando apenas o 1º texto/título preenchido.`,'i');
            }

            if(ad.type==='image'){
              let hash = ad.imageHash?.trim();
              if(!hash && ad.imageFile) hash = await uploadImage(ad.imageFile, acct);
              if(!hash) throw new Error('Hash de imagem não encontrado');

              if(multiVariation){
                creativeBody = {
                  name: ad.name+' - Creative',
                  object_story_spec:{ page_id: ad.pageId },
                  asset_feed_spec:{
                    bodies: texts.map(t=>({text:t})),
                    titles: headlines.length ? headlines.map(h=>({text:h})) : [{text:ad.name}],
                    images: [{hash}],
                    link_urls: [{website_url:linkWithUtm}],
                    call_to_action_types: [ad.cta||'LEARN_MORE'],
                    ad_formats: ['SINGLE_IMAGE']
                  }
                };
                if(igActorId) creativeBody.object_story_spec.instagram_user_id = igActorId;
              } else {
                creativeBody = {
                  name: ad.name+' - Creative',
                  object_story_spec:{
                    page_id: ad.pageId,
                    link_data:{
                      image_hash: hash,
                      link: linkWithUtm,
                      message: texts[0]||'',
                      call_to_action:{ type: ad.cta||'LEARN_MORE', value:{ link: linkWithUtm } }
                    }
                  }
                };
                if(headlines[0]) creativeBody.object_story_spec.link_data.name = headlines[0];
                if(ad.description) creativeBody.object_story_spec.link_data.description = ad.description;
                if(igActorId) creativeBody.object_story_spec.instagram_user_id = igActorId;
              }

            } else if(ad.type==='video'){
              let videoId = ad.videoId?.trim();
              if(!videoId && ad.videoFile) videoId = await uploadVideo(ad.videoFile, acct);
              if(!videoId) throw new Error('ID do vídeo não encontrado');

              // Aguarda a Meta processar o vídeo (status: ready) — até 10 minutos
              log(`  ↳ Aguardando processamento do vídeo…`,'i');
              let videoReady = false;
              let lastStatus = '';
              let consecutiveErrors = 0;
              let waitMs = 5000; // intervalo base entre checks
              const startTime = Date.now();
              while(Date.now() - startTime < 600000){ // 10 min máx
                await sleep(waitMs);
                try{
                  const sr = await api(`/${videoId}`,'GET',{fields:'status'});
                  consecutiveErrors = 0;
                  waitMs = 5000; // reseta intervalo após sucesso
                  let status, progress;
                  if(typeof sr.status === 'string'){ status = sr.status; }
                  else { status = sr.status?.video_status; progress = sr.status?.processing_progress; }
                  status = status || 'processing';

                  if(status === 'ready'){
                    log(`  ↳ Vídeo processado e pronto`,'s');
                    videoReady = true;
                    break;
                  }
                  if(status === 'error'){
                    throw new Error(`Meta retornou erro no processamento: ${JSON.stringify(sr.status)}`);
                  }
                  if(status !== lastStatus){
                    const pctMsg = (progress!=null) ? ` (${progress}%)` : '';
                    log(`  ↳ Status: ${status}${pctMsg}…`,'i');
                    lastStatus = status;
                  }
                } catch(e){
                  if(e.message.includes('processamento')) throw e;
                  // Rate limit / quota exceeded → recua MUITO
                  if(/request limit reached|rate limit|throttl|\(4\)|\(17\)|\(32\)|\(613\)/i.test(e.message)){
                    waitMs = Math.min(waitMs * 2, 60000); // exponential, máx 60s
                    log(`  ⏸ Rate limit Meta API. Esperando ${waitMs/1000}s antes de tentar novamente…`,'w');
                  } else {
                    consecutiveErrors++;
                    if(consecutiveErrors >= 3) log(`  ↳ ⚠️ Erro consultando status (${e.message}).`,'w');
                    if(consecutiveErrors >= 20) throw new Error(`Falhou ao consultar status do vídeo: ${e.message}`);
                  }
                }
              }
              if(!videoReady) throw new Error('Tempo esgotado esperando processamento do vídeo (>10min). Tenta de novo em alguns minutos (Meta API com sobrecarga).');

              // Busca thumbnail (geralmente já está disponível quando o vídeo está ready)
              let thumbUrl = '';
              for(let attempt=0; attempt<10; attempt++){
                try{
                  const tr = await api(`/${videoId}/thumbnails`,'GET',{fields:'uri,is_preferred'});
                  const thumbs = tr.data || [];
                  if(thumbs.length){
                    const preferred = thumbs.find(t=>t.is_preferred) || thumbs[0];
                    thumbUrl = preferred.uri;
                    log(`  ↳ Thumbnail obtida`,'i');
                    break;
                  }
                } catch(e){ /* tenta de novo */ }
                await sleep(2000);
              }
              if(!thumbUrl) log('  ↳ ⚠️ Thumbnail não disponível — usando padrão','w');

              if(multiVariation){
                creativeBody = {
                  name: ad.name+' - Creative',
                  object_story_spec:{ page_id: ad.pageId },
                  asset_feed_spec:{
                    bodies: texts.map(t=>({text:t})),
                    titles: headlines.length ? headlines.map(h=>({text:h})) : [{text:ad.name}],
                    videos: [{video_id:videoId, thumbnail_url:thumbUrl}],
                    link_urls: [{website_url:linkWithUtm}],
                    call_to_action_types: [ad.cta||'LEARN_MORE'],
                    ad_formats: ['SINGLE_VIDEO']
                  }
                };
                if(igActorId) creativeBody.object_story_spec.instagram_user_id = igActorId;
              } else {
                const videoData = {
                  video_id: videoId,
                  message: texts[0]||'',
                  title: headlines[0]||ad.name,
                  call_to_action:{ type: ad.cta||'LEARN_MORE', value:{ link: linkWithUtm } }
                };
                if(thumbUrl) videoData.image_url = thumbUrl;
                creativeBody = {
                  name: ad.name+' - Creative',
                  object_story_spec:{
                    page_id: ad.pageId,
                    video_data: videoData
                  }
                };
                if(ad.description) creativeBody.object_story_spec.video_data.link_description = ad.description;
                if(igActorId) creativeBody.object_story_spec.instagram_user_id = igActorId;
              }

            } else if(ad.type==='catalog'){
              creativeBody = {
                name: ad.name+' - Creative',
                object_story_spec:{
                  page_id: ad.pageId,
                  template_data:{
                    message: ad.text,
                    link: linkWithUtm,
                    name: '{{product.name}}',
                    description: '{{product.description}}',
                    call_to_action:{
                      type: ad.cta||'SHOP_NOW',
                      value:{ link: linkWithUtm }
                    }
                  }
                },
                product_set_id: ad.productSetId
              };
              if(igActorId) creativeBody.object_story_spec.instagram_user_id = igActorId;
            }

            // UTM vai no url_tags TANTO do creative QUANTO do ad — algumas contas leem só de um
            if(ad.utm?.trim()){
              creativeBody.url_tags = ad.utm.trim();
            }
            log(`[Creative body] ${JSON.stringify(creativeBody)}`,'i');
            const crR = await api(`/${acct}/adcreatives`,'POST',creativeBody);

            const adBody = {
              name: ad.name,
              adset_id: adsetR.id,
              creative:{ creative_id: crR.id },
              status: c.status
            };
            if(ad.utm?.trim()) adBody.url_tags = ad.utm.trim();
            const adR = await api(`/${acct}/ads`,'POST',adBody);
            log(`✓ Anúncio criado: ${adR.id}`,'s');

          } catch(e){
            log(`✗ Erro no anúncio "${ad.name}": ${e.message}`,'e');
            throw e;
          }
        }
        await sleep(200);
        } // fim for(let g=0; g<adGroups.length; g++)
      }
    }

    if(campDups>1) log(`✓ Campanha ${campIdx+1}/${campDups} concluída`,'s');
   } // fim for(let campIdx=0; campIdx<campDups; campIdx++)

    log('','i');
    log(campDups>1 ? `🎉 ${campDups} CAMPANHAS CRIADAS COM SUCESSO!` : '🎉 CAMPANHA CRIADA COM SUCESSO!','s');

  } catch(e){
    log(`✗ ERRO: ${e.message}`,'e');
  }

  S.running = false;
  render();
}

// ── Gerenciar adsets/ads ──────────────────────────────────────────────────────
function addAdset(){
  S.adsets.push({
    id:uid(), name:'', pixelId:'', conversionEvent:'PURCHASE',
    optimizationGoal:'', bidAmount:'', attributionClick:'', attributionView:'',
    spendingLimit:'',
    country:'BR', ageMin:'18', ageMax:'65', gender:'all',
    customAudiences:'', excludedAudiences:'',
    advantageAudience:false,
    placementType:'auto',
    placements:['fb_feed','ig_feed','ig_stories','ig_reels'],
    startDate:'', endDate:'', budget:'', duplicateCount:'1'
  });
  saveState(); render();
}
function delAdset(id){ S.adsets=S.adsets.filter(a=>a.id!==id); saveState(); render(); }
function setAdset(id,k,v){ const a=S.adsets.find(a=>a.id===id); if(a){ a[k]=v; saveState(); }}
function togglePl(adsetId,pl){
  const a=S.adsets.find(a=>a.id===adsetId); if(!a) return;
  a.placements = a.placements.includes(pl)
    ? a.placements.filter(p=>p!==pl)
    : [...a.placements, pl];
  saveState(); render();
}

function addAd(){
  S.ads.push({
    id:uid(), name:'', type:'image', pageId:'', igActorId:'',
    texts:[''], headlines:[''], description:'', cta:'LEARN_MORE',
    linkUrl:'', utm:'',
    imageFile:null, imageHash:'',
    videoFile:null, videoId:'',
    catalogId:'', productSetId:''
  });
  saveState(); render();
}
function delAd(id){ S.ads=S.ads.filter(a=>a.id!==id); saveState(); render(); }
function setAd(id,k,v){ const a=S.ads.find(a=>a.id===id); if(a){ a[k]=v; saveState(); }}
function addAdText(id){ const a=S.ads.find(a=>a.id===id); if(a&&a.texts.length<5){a.texts.push('');saveState();render();}}
function removeAdText(id,i){ const a=S.ads.find(a=>a.id===id); if(a&&a.texts.length>1){a.texts.splice(i,1);saveState();render();}}
function setAdText(id,i,v){ const a=S.ads.find(a=>a.id===id); if(a){a.texts[i]=v;saveState();}}
function addAdHeadline(id){ const a=S.ads.find(a=>a.id===id); if(a&&a.headlines.length<5){a.headlines.push('');saveState();render();}}
function removeAdHeadline(id,i){ const a=S.ads.find(a=>a.id===id); if(a&&a.headlines.length>1){a.headlines.splice(i,1);saveState();render();}}
function setAdHeadline(id,i,v){ const a=S.ads.find(a=>a.id===id); if(a){a.headlines[i]=v;saveState();}}

// ── Biblioteca de textos/títulos (persistente, separada do estado da campanha) ──
function loadLib(){
  try{ return JSON.parse(localStorage.getItem('maa_library')) || {texts:[], headlines:[]}; }
  catch(e){ return {texts:[], headlines:[]}; }
}
function saveLib(lib){ try{ localStorage.setItem('maa_library', JSON.stringify(lib)); }catch(e){} }
function libAdd(kind, val){
  val = (val||'').trim(); if(!val) return;
  const lib = loadLib();
  if(!lib[kind].includes(val)){ lib[kind].unshift(val); lib[kind] = lib[kind].slice(0,50); saveLib(lib); }
}
function libRemove(kind, val){
  const lib = loadLib();
  lib[kind] = lib[kind].filter(x=>x!==val);
  saveLib(lib); render();
}
function saveAdText(id,i){
  const a=S.ads.find(a=>a.id===id); if(!a) return;
  libAdd('texts', a.texts[i]); render();
}
function saveAdHeadline(id,i){
  const a=S.ads.find(a=>a.id===id); if(!a) return;
  libAdd('headlines', a.headlines[i]); render();
}
function pickFromLib(id, kind, idx, val){
  const a=S.ads.find(a=>a.id===id); if(!a||!val) return;
  if(kind==='texts'){ a.texts[idx] = val; }
  else { a.headlines[idx] = val; }
  saveState(); render();
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  $('root').innerHTML = S.connected ? buildMain() : buildLogin();
  // Rebind file inputs (não são serializáveis, precisam de listener direto)
  S.ads.forEach(ad=>{
    const imgInp = $('img-file-'+ad.id);
    if(imgInp) imgInp.addEventListener('change', e=>{
      const f=e.target.files[0]; if(!f) return;
      setAd(ad.id,'imageFile',f); setAd(ad.id,'imageHash','');
      $('img-chosen-'+ad.id).textContent='✓ '+f.name; $('img-chosen-'+ad.id).style.display='block';
    });
    const vidInp = $('vid-file-'+ad.id);
    if(vidInp) vidInp.addEventListener('change', e=>{
      const f=e.target.files[0]; if(!f) return;
      setAd(ad.id,'videoFile',f); setAd(ad.id,'videoId','');
      $('vid-chosen-'+ad.id).textContent='✓ '+f.name; $('vid-chosen-'+ad.id).style.display='block';
    });
  });
  const logbox = $('logbox');
  if(logbox){
    logbox.innerHTML = S.log.map(l=>`<div class="lg ${l.type}">[${l.t}] ${esc(l.msg)}</div>`).join('');
    logbox.scrollTop = logbox.scrollHeight;
  }
}

function buildMain(){
  const tabs = [
    {id:'campaign',l:'Campanha'},
    {id:'adsets',l:`Conjuntos (${S.adsets.length})`},
    {id:'ads',l:`Anúncios (${S.ads.length})`},

    {id:'log',l:'Log'}

  const cur = selAcct?.currency || '';

  return `
  <div class="card">

        ${(()=>{
          // Agrupa contas por BM (label do token)
          const groups = {};
          S.accounts.forEach(a=>{
            const key = a._tokenLabel || 'Outros';
            if(!groups[key]) groups[key] = [];
            groups[key].push(a);
          });
          return Object.entries(groups).map(([label, accs])=>`
            <optgroup label="${esc(label)} (${accs.length})">
              ${accs.map(a=>`<option value="${esc(a.id)}" ${a.id===S.selectedAccount?'selected':''}>${esc(a.name)}${a.currency&&a.currency!=='BRL'?` [${a.currency}]`:''}</option>`).join('')}

        <button class="btn btn-gray btn-sm" onclick="importConfig()" title="Importar configuração">📂</button>

function buildTab(){
  if(S.tab==='campaign') return buildCamp();
  if(S.tab==='adsets')   return buildAdsets();

}

function buildAds(){

  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn btn-gray" onclick="addAd()">+ Adicionar Anúncio</button>
    <button class="btn btn-blue" onclick="document.getElementById('bulk-upload').click()">📦 Upload em massa</button>
    ${S.ads.length>1?`<button class="btn btn-green" onclick="applyTemplateToAll()">🔄 Aplicar template do Anúncio 1 a todos</button>`:''}
    <input type="file" id="bulk-upload" multiple accept="image/*,video/*" style="display:none" onchange="handleBulkUpload(this.files);this.value=''">
  </div>`;
}

function applyTemplateToAll(){
  if(S.ads.length<2) return;
  const t = S.ads[0];
  if(!confirm(`Aplicar texto, título, página, CTA, link e UTM do Anúncio 1 aos outros ${S.ads.length-1} anúncios? (mídia de cada um será mantida)`)) return;
  for(let i=1;i<S.ads.length;i++){
    const a = S.ads[i];
    a.pageId = t.pageId || a.pageId;
    a.igActorId = t.igActorId || a.igActorId;
    a.texts = [...(t.texts || [''])];
    a.headlines = [...(t.headlines || [''])];
    a.description = t.description || '';
    a.cta = t.cta || a.cta;
    a.linkUrl = t.linkUrl || '';
    a.utm = t.utm || '';
  }
  saveState(); render();
  alert(`✅ Template aplicado a ${S.ads.length-1} anúncio(s).`);
}

function handleBulkUpload(files){
  if(!files || files.length===0) return;
  const template = S.ads[0] || {};
  let created = 0;
  for(const file of files){
    const isVideo = file.type.startsWith('video/');
    const baseName = file.name.replace(/\.[^.]+$/,'');
    const newAd = {
      id: uid(),
      name: baseName,
      type: isVideo ? 'video' : 'image',
      pageId: template.pageId || '',
      igActorId: template.igActorId || '',
      texts: [...(template.texts || [''])],
      headlines: [...(template.headlines || [''])],
      description: template.description || '',
      cta: template.cta || 'LEARN_MORE',
      linkUrl: template.linkUrl || '',
      utm: template.utm || '',
      imageFile: isVideo ? null : file,
      imageHash: '',
      videoFile: isVideo ? file : null,
      videoId: '',
      catalogId: '',
      productSetId: ''
    };
    S.ads.push(newAd);
    created++;
  }
  saveState();
  render();
  alert(`✅ ${created} anúncio(s) criado(s) a partir dos arquivos. Cada um herdou texto/título/página/CTA/link do primeiro anúncio.`);
}

function buildMediaFields(ad){
  if(ad.type==='image') return `
    <div class="fg">
      <label>Imagem</label>
      <input value="${esc(ad.imageHash||'')}" oninput="setAd(${ad.id},'imageHash',this.value);setAd(${ad.id},'imageFile',null)"
        placeholder="Hash da imagem (se já enviada) OU use o upload abaixo" style="margin-bottom:6px">
      <input type="file" id="img-file-${ad.id}" accept="image/*">
      <div id="img-chosen-${ad.id}" class="file-chosen" style="display:${ad.imageFile?'block':'none'}">${ad.imageFile?'✓ '+ad.imageFile.name:''}</div>
    </div>`;

  if(ad.type==='video') return `
    <div class="fg">
      <label>Vídeo</label>
      <input value="${esc(ad.videoId||'')}" oninput="setAd(${ad.id},'videoId',this.value);setAd(${ad.id},'videoFile',null)"
        placeholder="ID do vídeo (se já enviado) OU use o upload abaixo" style="margin-bottom:6px">
      <input type="file" id="vid-file-${ad.id}" accept="video/*">
      <div id="vid-chosen-${ad.id}" class="file-chosen" style="display:${ad.videoFile?'block':'none'}">${ad.videoFile?'✓ '+ad.videoFile.name:''}</div>
    </div>`;

  if(ad.type==='catalog') return `
    <div class="row">
      <div class="fg">
        <label>ID do Catálogo</label>
        <input value="${esc(ad.catalogId||'')}" oninput="setAd(${ad.id},'catalogId',this.value)"
          placeholder="ID do catálogo" list="cat-${ad.id}">
        <datalist id="cat-${ad.id}">
          ${S.catalogs.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}
        </datalist>
      </div>
      <div class="fg">
        <label>ID do Product Set</label>
        <input value="${esc(ad.productSetId||'')}" oninput="setAd(${ad.id},'productSetId',this.value)" placeholder="ID do conjunto de produtos">
      </div>
    </div>`;
  return '';
}

// ── Aba Revisar ───────────────────────────────────────────────────────────────
function buildReview(){
  const errs = validate();
  const c = S.camp;
  const totalAdsets = S.adsets.reduce((s,a)=>s+(parseInt(a.duplicateCount)||1),0);
  const totalAds = totalAdsets * S.ads.length;

  return `
  <h2>Revisar e Criar</h2>
  ${errs.length?`
    <div class="err-box">
      <strong style="color:#c5221f">Corrija antes de criar:</strong>
      <ul style="margin-top:8px">${errs.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>
    </div>`:`
    <div class="info-box">
      ✓ Pronto para criar: 1 campanha · ${totalAdsets} conjunto(s) · ${totalAds} anúncio(s)
    </div>`}
  <div class="rv"><span class="rv-lbl">Campanha</span><span class="rv-val">${esc(c.name)||'—'}</span></div>
  <div class="rv"><span class="rv-lbl">Objetivo</span><span class="rv-val">${c.objective}</span></div>
  <div class="rv"><span class="rv-lbl">Orçamento</span><span class="rv-val">${c.budgetType} · R$ ${c.budget||0}/dia</span></div>
  <div class="rv"><span class="rv-lbl">Lance</span><span class="rv-val">${c.bidStrategy}</span></div>
  <div class="rv"><span class="rv-lbl">Status</span><span class="rv-val"><span class="badge ${c.status==='PAUSED'?'b-orange':'b-green'}">${c.status}</span></span></div>
  <hr>
  ${S.adsets.map((a,i)=>`
    <div class="rv">
      <span class="rv-lbl">Conjunto ${i+1}</span>
      <span class="rv-val">${esc(a.name)||'—'} ${parseInt(a.duplicateCount||1)>1?`<span class="badge b-blue">×${a.duplicateCount}</span>`:''}</span>
    </div>`).join('')}
  <hr>
  ${S.ads.map((a,i)=>`
    <div class="rv">
      <span class="rv-lbl">Anúncio ${i+1}</span>
      <span class="rv-val">${esc(a.name)||'—'} <span class="badge b-blue">${a.type}</span></span>
    </div>`).join('')}
  <hr>
  <button class="btn btn-green btn-full" onclick="run()" ${errs.length||S.running?'disabled':''}>
    ${S.running?'Criando…':'🚀 Criar Campanha'}
  </button>`;
}

// ── Export / Import config ────────────────────────────────────────────────────
function exportConfig(){
  const cfg = {
    tokens: S.tokens,
    camp: S.camp,
    adsets: S.adsets.map(a=>({...a, id:a.id})),
    ads: S.ads.map(a=>({...a, imageFile:null, videoFile:null}))
  };
  const blob = new Blob([JSON.stringify(cfg, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='meta-ads-config.json'; a.click();
  URL.revokeObjectURL(url);
}

function importConfig(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.json';
  inp.onchange = e=>{
    const f=e.target.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      try {
        const cfg = JSON.parse(ev.target.result);
        if(cfg.camp) S.camp = cfg.camp;
        if(cfg.adsets) S.adsets = cfg.adsets;
        if(cfg.ads) S.ads = cfg.ads;
        if(cfg.tokens && Array.isArray(cfg.tokens)) S.tokens = cfg.tokens;
        else if(cfg.token){
          // legacy: arquivos antigos com 1 token só
          S.tokens = S.tokens || [];
          if(!S.tokens.find(t=>t.token===cfg.token)){
            S.tokens.push({id:Date.now(), label:'Importado', token:cfg.token});
          }
        }
        saveState(); render();
        alert('Configuração importada com sucesso!');
      } catch(err){ alert('Erro ao importar: arquivo inválido'); }
    };
    reader.readAsText(f);
  };
  inp.click();
}

// ── Misc ──────────────────────────────────────────────────────────────────────
function setTab(t){ S.tab=t; render(); }
function disconnect(){
  // Mantém os tokens cadastrados — só "desloga"
  S.connected=false; S.log=[]; S.accounts=[]; S.pages=[]; S.pixels=[]; S.catalogs=[]; S.igCache={};
  saveState(); render();
}
async function changeAcct(id){
  S.selectedAccount = id || '';
  S.token = id ? getAccountToken(id) : '';
  S.igCache = {}; // limpa cache de IG (token pode ser diferente)
  if(id){
    await loadAccountAssets(id);
  } else {
    S.pixels = []; S.catalogs = [];
  }
  saveState(); render();
}

// ── Init ──────────────────────────────────────────────────────────────────────
render();
</script>
